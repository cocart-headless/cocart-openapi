openapi: 3.0.3
info:
  title: CoCart Plus - Others API v2
  version: 2.0.0
  description: |
    CoCart Plus extends the CoCart REST API v2 with a customer registration
    endpoint, a public order withdrawal request endpoint and batch requests
    (several cart routes in one request).

    Requires CoCart Starter v5.0+ to be installed and active.

    Order withdrawal responses belong to one order, so they are kept out of shared caches (CDNs, a host's nginx
    microcache): `Cache-Control: no-cache, no-store, must-revalidate, max-age=0,
    private`, `Pragma: no-cache`, `X-Accel-Expires: 0` (consumed by nginx) and
    `Vary: Cart-Key, CoCart-API-Cart-Key, Authorization`.
  termsOfService: https://cocartapi.com/terms-of-conditions-polar/
  contact:
    email: support@cocartapi.com
  license:
    name: GNU General Public License v3.0
    url: http://www.gnu.org/licenses/gpl-3.0.html
externalDocs:
  description: Find out more about CoCart API
  url: https://docs.cocartapi.com
servers:
- url: '{protocol}://{host}/wp-json/cocart/v2'
  description: API v2
  variables:
    protocol:
      enum:
      - http
      - https
      default: https
    host:
      default: example-store.com
      description: Your store domain
tags:
- name: customers
  description: Operations for registering customers
- name: orders
  description: Operations for submitting order withdrawal requests
- name: batch
  description: Several requests in one.
paths:
  /register:
    post:
      tags:
      - customers
      summary: Register a customer
      description: Creates a customer account and returns `201` with the customer, as `GET /my-account` gives it, with `account_created` in `result` and logging in as the action to take next. An email or username already used is a `409`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  description: Customers email address.
                  type: string
                requested_username:
                  description: Customers requested username.
                  type: string
                requested_password:
                  description: Customers requested password. Kept exactly as sent, as WooCommerce keeps passwords.
                  type: string
                formatted:
                  description: True if you want to return the price values formatted.
                  default: false
                  type: boolean
                meta_keys:
                  description: Only these keys in each `meta`, e.g. meta_keys=gift_message,_configuration. Narrows the keys the store allows; it can never add one. Default every allowed key.
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: The account was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              example:
                object: customer
                result:
                  code: account_created
                  message: Your account was created successfully. Your login details have been sent to your email address.
                id: 901
                username: janedoe
                email: jane@example.com
                pending_email: null
                first_name: ''
                last_name: ''
                display_name: janedoe
                avatar_url: https://secure.gravatar.com/avatar/8c87b489ce35cf2e2f39f80e282cb2e804932a56a213983eeeb428407d43b52d?s=96&d=mm&r=g
                date_registered:
                  iso: '2026-11-20T20:07:17+00:00'
                  label: November 20, 2026, 8:07 pm
                currency:
                  currency_code: USD
                  currency_symbol: $
                  currency_symbol_pos: currency_prefix
                  currency_minor_unit: 2
                  currency_decimal_separator: .
                  currency_thousand_separator: ','
                  currency_prefix: $
                  currency_suffix: ''
                stats:
                  orders_count: 0
                  total_spent: '0'
                  is_paying_customer: false
                billing: null
                shipping: null
                tax:
                  is_vat_exempt: false
                  is_outside_base: false
                recent_orders: []
                meta: {}
                extensions:
                  email_verification:
                    verified: false
        '400':
          description: 'Bad request: `cocart_account_creation_failed`, `cocart_invalid_email`, `cocart_registration_invalid_username`, `cocart_registration_missing_password`, `cocart_registration_reserved_username`, `cocart_registration_weak_password`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cocart_account_creation_failed:
                  summary: cocart_account_creation_failed
                  value:
                    code: cocart_account_creation_failed
                    message: ''
                    data:
                      status: 400
                cocart_invalid_email:
                  summary: cocart_invalid_email
                  value:
                    code: cocart_invalid_email
                    message: A valid email address is required.
                    data:
                      status: 400
                cocart_registration_invalid_username:
                  summary: cocart_registration_invalid_username
                  value:
                    code: cocart_registration_invalid_username
                    message: Please provide a valid username.
                    data:
                      status: 400
                cocart_registration_missing_password:
                  summary: cocart_registration_missing_password
                  value:
                    code: cocart_registration_missing_password
                    message: Please enter an account password.
                    data:
                      status: 400
                cocart_registration_reserved_username:
                  summary: cocart_registration_reserved_username
                  value:
                    code: cocart_registration_reserved_username
                    message: This username cannot be registered. Please choose another.
                    data:
                      status: 400
                cocart_registration_weak_password:
                  summary: cocart_registration_weak_password
                  value:
                    code: cocart_registration_weak_password
                    message: This password is too weak. Please choose a stronger password.
                    data:
                      status: 400
        '409':
          description: 'Conflict: `cocart_account_exists`, `cocart_registration_username_exists`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cocart_account_exists:
                  summary: cocart_account_exists
                  value:
                    code: cocart_account_exists
                    message: An account is already registered with your email address.
                    data:
                      status: 409
                      account_exists: true
                cocart_registration_username_exists:
                  summary: cocart_registration_username_exists
                  value:
                    code: cocart_registration_username_exists
                    message: An account is already registered with that username. Please choose another.
                    data:
                      status: 409
  /order-withdrawal:
    post:
      tags:
      - orders
      summary: Ask to withdraw from an order
      description: Records a request to withdraw from an order, as WooCommerce's own form does, and emails an acknowledgement. Returns `withdrawal_requested` in `result` with the email it went to. Needs WooCommerce 11.1 or later with its order withdrawal feature turned on; otherwise it is `404 cocart_order_withdrawal_unavailable`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  description: First name of the person requesting the withdrawal.
                  type: string
                last_name:
                  description: Last name of the person requesting the withdrawal.
                  type: string
                email:
                  description: Email address to match against the order and to send the acknowledgement to.
                  type: string
                email_confirmation:
                  description: Confirmation of the email address. Must match the email field.
                  type: string
                order_number:
                  description: The order number to withdraw from.
                  type: string
                withdrawal_type:
                  description: Whether to withdraw the full order or specific items only. One of "full_order" or "specific_items_only".
                  type: string
                  default: full_order
                additional_details:
                  description: Additional details about the withdrawal. Required when only withdrawing specific items.
                  type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderWithdrawal'
              example:
                object: withdrawal_request
                result:
                  code: withdrawal_requested
                  message: We have received your withdrawal request and sent an acknowledgement to shopper@example.com.
                email: shopper@example.com
        '400':
          description: 'Bad request: `cocart_order_withdrawal_email_mismatch`, `cocart_order_withdrawal_invalid_email`, `cocart_order_withdrawal_invalid_type`, `cocart_order_withdrawal_missing_additional_details`, `cocart_order_withdrawal_missing_email_confirmation`, `cocart_order_withdrawal_missing_first_name`, `cocart_order_withdrawal_missing_last_name`, `cocart_order_withdrawal_missing_order_number`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cocart_order_withdrawal_email_mismatch:
                  summary: cocart_order_withdrawal_email_mismatch
                  value:
                    code: cocart_order_withdrawal_email_mismatch
                    message: Email addresses do not match.
                    data:
                      status: 400
                cocart_order_withdrawal_invalid_email:
                  summary: cocart_order_withdrawal_invalid_email
                  value:
                    code: cocart_order_withdrawal_invalid_email
                    message: Please enter a valid email address.
                    data:
                      status: 400
                cocart_order_withdrawal_invalid_type:
                  summary: cocart_order_withdrawal_invalid_type
                  value:
                    code: cocart_order_withdrawal_invalid_type
                    message: Choose what you want to withdraw.
                    data:
                      status: 400
                cocart_order_withdrawal_missing_additional_details:
                  summary: cocart_order_withdrawal_missing_additional_details
                  value:
                    code: cocart_order_withdrawal_missing_additional_details
                    message: Please list the specific items you want to withdraw.
                    data:
                      status: 400
                cocart_order_withdrawal_missing_email_confirmation:
                  summary: cocart_order_withdrawal_missing_email_confirmation
                  value:
                    code: cocart_order_withdrawal_missing_email_confirmation
                    message: Please confirm your email address.
                    data:
                      status: 400
                cocart_order_withdrawal_missing_first_name:
                  summary: cocart_order_withdrawal_missing_first_name
                  value:
                    code: cocart_order_withdrawal_missing_first_name
                    message: First name is required.
                    data:
                      status: 400
                cocart_order_withdrawal_missing_last_name:
                  summary: cocart_order_withdrawal_missing_last_name
                  value:
                    code: cocart_order_withdrawal_missing_last_name
                    message: Last name is required.
                    data:
                      status: 400
                cocart_order_withdrawal_missing_order_number:
                  summary: cocart_order_withdrawal_missing_order_number
                  value:
                    code: cocart_order_withdrawal_missing_order_number
                    message: Order number is required.
                    data:
                      status: 400
        '404':
          description: 'Not found: `cocart_order_withdrawal_unavailable`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cocart_order_withdrawal_unavailable:
                  summary: cocart_order_withdrawal_unavailable
                  value:
                    code: cocart_order_withdrawal_unavailable
                    message: Order withdrawal is not available on this store.
                    data:
                      status: 404
        '409':
          description: 'Conflict: `cocart_order_withdrawal_already_requested`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cocart_order_withdrawal_already_requested:
                  summary: cocart_order_withdrawal_already_requested
                  value:
                    code: cocart_order_withdrawal_already_requested
                    message: A withdrawal request has already been submitted for this order. Please contact us if you need help or want to make changes.
                    data:
                      status: 409
        '429':
          description: 'Too many requests: `cocart_order_withdrawal_rate_limited`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cocart_order_withdrawal_rate_limited:
                  summary: cocart_order_withdrawal_rate_limited
                  value:
                    code: cocart_order_withdrawal_rate_limited
                    message: Please wait before submitting another withdrawal request.
                    data:
                      status: 429
        '500':
          description: 'Server error: `cocart_order_withdrawal_failed`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cocart_order_withdrawal_failed:
                  summary: cocart_order_withdrawal_failed
                  value:
                    code: cocart_order_withdrawal_failed
                    message: We could not submit your withdrawal request. Please try again or contact us if the problem continues.
                    data:
                      status: 500
  /batch:
    servers:
    - url: '{protocol}://{host}/wp-json/cocart'
      description: The batch route is outside the versioned namespace.
      variables:
        protocol:
          enum:
          - http
          - https
          default: https
        host:
          default: example.com
    post:
      tags:
      - batch
      summary: Send requests in a batch
      description: 'Sends several requests in one. When every request is to a cart route, the response is the cart after them all, with each failed request as an `error` notice. Otherwise it is WordPress''s batch envelope, `{"responses": [...]}`, with each response''s body, status and headers.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                validation:
                  type: string
                  enum:
                  - require-all-validate
                  - normal
                  default: normal
                requests:
                  type: array
                  maxItems: 25
                  items:
                    type: object
                    properties:
                      method:
                        type: string
                        enum:
                        - GET
                        - POST
                        - PUT
                        - PATCH
                        - DELETE
                        default: POST
                      path:
                        type: string
                      body:
                        type: object
                        additionalProperties: true
                      headers:
                        type: object
                        additionalProperties:
                          oneOf:
                          - type: string
                          - type: array
                            items:
                              type: string
                    required:
                    - path
              required:
              - requests
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
              example:
                cart_hash: 9660c269f8154ab17ddc480c24891f9e
                cart_key: test_cart_key_123
                currency:
                  currency_code: USD
                  currency_symbol: $
                  currency_symbol_pos: currency_prefix
                  currency_minor_unit: 2
                  currency_decimal_separator: .
                  currency_thousand_separator: ','
                  currency_prefix: $
                  currency_suffix: ''
                customer:
                  billing_address:
                    billing_first_name: Jane
                    billing_last_name: Doe
                    billing_company: ''
                    billing_country: US
                    billing_address_1: 123 Main St
                    billing_address_2: ''
                    billing_postcode: '75001'
                    billing_city: Paris
                    billing_state: ''
                    billing_phone: 0123456789
                    billing_email: allowed@example.com
                  shipping_address:
                    shipping_first_name: Jane
                    shipping_last_name: Doe
                    shipping_company: ''
                    shipping_country: US
                    shipping_address_1: 123 Test Street
                    shipping_address_2: ''
                    shipping_postcode: '90210'
                    shipping_city: Paris
                    shipping_state: CA
                    shipping_phone: 0123456789
                items:
                - item_key: 228bbc2f87caeb21bb7f6949fddcb91d
                  id: 2322
                  name: Test Product
                  title: Test Product
                  variation: {}
                  price: '1000'
                  regular_price: ''
                  on_sale: false
                  quantity:
                    value: 1
                    minimum: 1
                    maximum: 9999
                    multiple_of: 1
                    editable: true
                  totals:
                    subtotal: '1000'
                    subtotal_tax: '0'
                    total: '1000'
                    tax: '0'
                  slug: test-product
                  meta:
                    product_type: simple
                    sku: ''
                    dimensions:
                      length: ''
                      width: ''
                      height: ''
                      unit: in
                    weight: '0.0'
                  backorders: ''
                  cart_item_data: {}
                  featured_image: ''
                  extensions: {}
                item_count: 1
                items_weight: '0'
                coupons: []
                needs_payment: true
                needs_shipping: false
                shipping: []
                fees:
                  handling:
                    name: Handling
                    fee: '200'
                taxes: []
                totals:
                  subtotal: '1000'
                  subtotal_tax: '0'
                  fee_total: '200'
                  fee_tax: '0'
                  discount_total: '0'
                  discount_tax: '0'
                  shipping_total: '0'
                  shipping_tax: '0'
                  total: '1200'
                  total_tax: '0'
                removed_items: []
                cross_sells: []
                notices:
                  error:
                  - This product cannot be added to the cart.
                  success:
                  - “Test Product” has been added to your cart.
                extensions:
                  points_and_rewards:
                    points_balance: 0
                    points_to_earn: 10
                    redemption_coupon: ''
                meta: {}
        '207':
          description: 'Some requests failed: the batch envelope.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
              example:
                responses:
                - body:
                    cart_hash: ''
                    cart_key: test_cart_key_123
                    currency:
                      currency_code: USD
                      currency_symbol: $
                      currency_symbol_pos: currency_prefix
                      currency_minor_unit: 2
                      currency_decimal_separator: .
                      currency_thousand_separator: ','
                      currency_prefix: $
                      currency_suffix: ''
                    customer:
                      billing_address:
                        billing_first_name: Jane
                        billing_last_name: Doe
                        billing_company: ''
                        billing_country: US
                        billing_address_1: 123 Main St
                        billing_address_2: ''
                        billing_postcode: '75001'
                        billing_city: Paris
                        billing_state: ''
                        billing_phone: 0123456789
                        billing_email: allowed@example.com
                      shipping_address:
                        shipping_first_name: Jane
                        shipping_last_name: Doe
                        shipping_company: ''
                        shipping_country: US
                        shipping_address_1: 123 Test Street
                        shipping_address_2: ''
                        shipping_postcode: '90210'
                        shipping_city: Paris
                        shipping_state: CA
                        shipping_phone: 0123456789
                    items: []
                    coupons: []
                    removed_items: []
                    cross_sells: []
                    shipping: []
                    fees: {}
                    taxes: []
                    item_count: 0
                    items_weight: '0'
                    needs_payment: false
                    needs_shipping: false
                    totals:
                      subtotal: '0'
                      subtotal_tax: '0'
                      fee_total: '0'
                      fee_tax: '0'
                      discount_total: '0'
                      discount_tax: '0'
                      shipping_total: '0'
                      shipping_tax: '0'
                      total: '0'
                      total_tax: '0'
                    notices:
                      notice:
                      - Cart is cleared.
                    meta: {}
                  status: 200
                  headers:
                    Cart-Key: test_cart_key_123
                    Allow: POST
                - body:
                    code: cocart_rest_not_authorized
                    message: Sorry, you are not authorized.
                    data:
                      status: 401
                  status: 401
                  headers: {}
        '400':
          description: 'Bad request: `cocart_rest_invalid_path`, `rest_invalid_param`, `rest_missing_callback_param`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cocart_rest_invalid_path:
                  summary: cocart_rest_invalid_path
                  value:
                    code: cocart_rest_invalid_path
                    message: Invalid path provided.
                    data:
                      status: 400
                rest_invalid_param:
                  summary: rest_invalid_param
                  value:
                    code: rest_invalid_param
                    message: 'Invalid parameter(s): requests'
                    data:
                      status: 400
                      params:
                        requests: requests must contain at most 25 items.
                      details:
                        requests:
                          code: rest_too_many_items
                          message: requests must contain at most 25 items.
                          data: null
                rest_missing_callback_param:
                  summary: rest_missing_callback_param
                  value:
                    code: rest_missing_callback_param
                    message: 'Missing parameter(s): requests'
                    data:
                      status: 400
                      params:
                      - requests
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        Basic authentication with username and password.

        Since CoCart v4.9.0, if an `X-HTTP-Method-Override` header is present, it is honored
        when determining the request method during authentication (e.g. credentials sent in a
        JSON body are still detected when the original method is tunneled through POST).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer token authentication (JWT). Not required for registering a customer.
  schemas:
    BatchResponse:
      description: The cart, when every request was to a cart route, or WordPress's batch envelope.
      oneOf:
      - allOf:
        - $ref: '#/components/schemas/Cart'
        required:
        - cart_key
      - $ref: '#/components/schemas/BatchResponses'
    BatchResponses:
      description: 'WordPress''s batch envelope: each request''s response.'
      type: object
      properties:
        failed:
          description: 'With `validation` set to `require-all-validate`: "validation" when a request failed validation, and none was run.'
          type: string
          enum:
          - validation
          readOnly: true
        responses:
          description: Each request's response. When none was run, null for each request that was valid.
          type: array
          items:
            type: object
            properties:
              body:
                description: What the route returned, or its error.
                additionalProperties: true
                readOnly: true
              status:
                description: HTTP status code of the response.
                type: integer
                readOnly: true
              headers:
                description: HTTP headers of the response.
                type: object
                additionalProperties: true
                readOnly: true
            nullable: true
          readOnly: true
      required:
      - responses
    Cart:
      description: 'The cart, as `GET /cart` gives it, with what CoCart Plus adds: its `meta`, and each coupon''s `discount_type`. Fees, shipping packages and their rates are keyed by ID.'
      type: object
      properties:
        cart_hash:
          description: A Unique hash key of the carts contents.
          type: string
          readOnly: true
        cart_key:
          description: The cart key identifying the cart in session.
          type: string
          readOnly: true
        currency:
          description: The store currency information.
          type: object
          properties:
            currency_code:
              description: The currency code (in ISO format) for returned prices.
              type: string
              readOnly: true
            currency_symbol:
              description: The currency symbol for the currency which can be used to format returned prices.
              type: string
              readOnly: true
            currency_symbol_pos:
              description: The currency symbol position to which the currency needs to return for the prices.
              type: string
              readOnly: true
            currency_minor_unit:
              description: The currency minor unit (number of digits after the decimal separator) for returned prices.
              type: integer
              readOnly: true
            currency_decimal_separator:
              description: The decimal separator for the currency which can be used to format returned prices.
              type: string
              readOnly: true
            currency_thousand_separator:
              description: The thousand separator for the currency which can be used to format returned prices.
              type: string
              readOnly: true
            currency_prefix:
              description: The price prefix for the currency which can be used to format returned prices.
              type: string
              readOnly: true
            currency_suffix:
              description: The price prefix for the currency which can be used to format returned prices.
              type: string
              readOnly: true
          readOnly: true
        customer:
          description: The customer information.
          type: object
          properties:
            billing_address:
              description: Customers billing address.
              type: object
              properties:
                billing_first_name:
                  description: Customers billing first name.
                  type: string
                  readOnly: true
                billing_last_name:
                  description: Customers billing last name.
                  type: string
                  readOnly: true
                billing_company:
                  description: Customers billing company name.
                  type: string
                  readOnly: true
                billing_country:
                  description: Customers billing country.
                  type: string
                  readOnly: true
                billing_address_1:
                  description: Customers billing address line one.
                  type: string
                  readOnly: true
                billing_address_2:
                  description: Customers billing address line two.
                  type: string
                  readOnly: true
                billing_city:
                  description: Customers billing address city.
                  type: string
                  readOnly: true
                billing_state:
                  description: Customers billing state.
                  type: string
                  readOnly: true
                billing_postcode:
                  description: Customers billing postcode or zip code.
                  type: string
                  readOnly: true
                billing_phone:
                  description: Customers billing phone.
                  type: string
                  readOnly: true
                billing_email:
                  description: Customers billing email address.
                  type: string
                  readOnly: true
              readOnly: true
            shipping_address:
              description: Customers shipping address.
              type: object
              properties:
                shipping_first_name:
                  description: Customers shipping first name.
                  type: string
                  readOnly: true
                shipping_last_name:
                  description: Customers shipping last name.
                  type: string
                  readOnly: true
                shipping_company:
                  description: Customers shipping company name.
                  type: string
                  readOnly: true
                shipping_country:
                  description: Customers shipping country.
                  type: string
                  readOnly: true
                shipping_address_1:
                  description: Customers shipping address line one.
                  type: string
                  readOnly: true
                shipping_address_2:
                  description: Customers shipping address line two.
                  type: string
                  readOnly: true
                shipping_city:
                  description: Customers shipping address city.
                  type: string
                  readOnly: true
                shipping_state:
                  description: Customers shipping state.
                  type: string
                  readOnly: true
                shipping_postcode:
                  description: Customers shipping postcode or zip code.
                  type: string
                  readOnly: true
                shipping_phone:
