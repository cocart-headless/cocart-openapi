                    description: Quantity information.
                    type: object
                    properties:
                      value:
                        description: Quantity value.
                        type: integer
                        readOnly: true
                      minimum:
                        description: Minimum quantity.
                        type: integer
                        readOnly: true
                      maximum:
                        description: Maximum quantity.
                        type: integer
                        readOnly: true
                    readOnly: true
                  variation:
                    description: Selected variation attributes.
                    type: object
                    additionalProperties:
                      type: string
                    readOnly: true
                  discount:
                    description: Discount applied to this item, or null if none.
                    type: number
                    readOnly: true
                    nullable: true
                  optional_selected:
                    description: Whether the customer included this optional item.
                    type: boolean
                    readOnly: true
              readOnly: true
            child_items:
              description: Summary of bundled child items nested under this container.
              type: array
              items:
                type: object
                properties:
                  item_key:
                    description: Cart item key of the child item.
                    type: string
                    readOnly: true
                  bundled_item_id:
                    description: Internal bundle definition ID for this child.
                    type: integer
                    readOnly: true
                  id:
                    description: Product or variation ID.
                    type: integer
                    readOnly: true
                  name:
                    description: Product name.
                    type: string
                    readOnly: true
                  quantity:
                    description: Quantity information.
                    type: object
                    properties:
                      value:
                        description: Quantity value.
                        type: integer
                        readOnly: true
                      minimum:
                        description: Minimum quantity.
                        type: integer
                        readOnly: true
                      maximum:
                        description: Maximum quantity.
                        type: integer
                        readOnly: true
                    readOnly: true
                  price:
                    description: Unit price in the smallest currency unit.
                    type: string
                    readOnly: true
                  variation:
                    description: Selected variation attributes.
                    type: object
                    additionalProperties:
                      type: string
                    readOnly: true
              readOnly: true
            child_item_keys:
              description: Cart item keys of the bundled child items.
              type: array
              items:
                type: string
              readOnly: true
          readOnly: true
        accommodation_booking_data:
          description: Accommodation booking check-in and check-out information for the cart item.
          type: object
          properties:
            check_in:
              description: Check-in date and time.
              type: string
              readOnly: true
            check_out:
              description: Check-out date and time.
              type: string
              readOnly: true
          readOnly: true
        booking_data:
          description: Booking configuration for the cart item.
          type: object
          properties:
            start_date:
              description: Booking start date and time.
              type: string
              readOnly: true
            end_date:
              description: Booking end date and time.
              type: string
              readOnly: true
            all_day:
              description: Whether the booking spans the full day.
              type: boolean
              readOnly: true
            resource_id:
              description: Resource ID assigned to the booking.
              type: integer
              readOnly: true
            persons:
              description: Person counts per type for the booking.
              type: array
              items:
                type: integer
              readOnly: true
            cost:
              description: Calculated booking cost in the smallest currency unit.
              type: string
              readOnly: true
          readOnly: true
        discount:
          description: Discount applied to this cart item by Advanced Dynamic Pricing.
          type: object
          properties:
            original_price:
              description: Original per-unit price before discount.
              type: string
              readOnly: true
            saved_amount:
              description: Amount saved on this line by the matched rule(s).
              type: string
              readOnly: true
            is_free_item:
              description: Whether this item was added free by a Buy X Get Y rule.
              type: boolean
              readOnly: true
            rules:
              description: Names of the pricing rules that matched this cart item.
              type: array
              items:
                type: string
              readOnly: true
          readOnly: true
        addons:
          description: Add-on selections made by the customer for this cart item.
          type: array
          items:
            type: object
            properties:
              field_label:
                description: The add-on field label.
                type: string
                readOnly: true
              field_type:
                description: The add-on field type (e.g. custom_text, multiple_choice, file_upload).
                type: string
                readOnly: true
              value:
                description: The selected or entered value, pre-formatted for display.
                type: string
                readOnly: true
              price:
                description: Price contribution of this selection. For percentage_based, the percentage of the product price, e.g. "10" for 10%, not an amount.
                type: string
                readOnly: true
              price_type:
                description: 'Price type: flat_fee, quantity_based, or percentage_based.'
                type: string
                readOnly: true
          readOnly: true
        warranty:
          description: Warranty selected for this cart item.
          type: object
          properties:
            label:
              description: Warranty label.
              type: string
              readOnly: true
            type:
              description: 'Warranty type: included or addon.'
              type: string
              readOnly: true
            duration:
              description: Human-readable warranty duration.
              type: string
              readOnly: true
            cost:
              description: Additional cost for this warranty.
              type: string
              readOnly: true
          readOnly: true
    Customer:
      description: The customer, like a receipt. A request that changes something gives what it did first, in `result`.
      type: object
      properties:
        object:
          description: 'The kind of document: "customer".'
          type: string
          enum:
          - customer
          readOnly: true
        result:
          description: What the request did. Only in responses to requests that change something.
          type: object
          properties:
            code:
              description: Result code to branch on, not translated.
              type: string
              readOnly: true
            message:
              description: Message for the customer.
              type: string
              readOnly: true
          readOnly: true
        id:
          description: Unique identifier for the customer.
          type: integer
          readOnly: true
        username:
          description: The username the account logs in with.
          type: string
          readOnly: true
        email:
          description: The email address the account logs in with. May not be the billing email.
          type: string
          format: email
          readOnly: true
        pending_email:
          description: A new email address waiting to be confirmed through the link sent to it, or null.
          type: string
          format: email
          readOnly: true
          nullable: true
        first_name:
          description: First name.
          type: string
          readOnly: true
        last_name:
          description: Last name.
          type: string
          readOnly: true
        display_name:
          description: Display name.
          type: string
          readOnly: true
        avatar_url:
          description: Avatar URL.
          type: string
          format: uri
          readOnly: true
        date_registered:
          description: When the customer registered. Null when there is none.
          type: object
          properties:
            iso:
              description: The date in ISO 8601 format, with the site's UTC offset.
              type: string
              format: date-time
              readOnly: true
            label:
              description: The date in the site's date and time format, for display.
              type: string
              readOnly: true
          readOnly: true
          nullable: true
        currency:
          description: The store currency, which total_spent is in.
          type: object
          properties:
            currency_code:
              description: Currency code.
              type: string
              readOnly: true
            currency_symbol:
              description: Currency symbol.
              type: string
              readOnly: true
            currency_symbol_pos:
              description: The currency symbol position to which the currency needs to return for the prices.
              type: string
              readOnly: true
            currency_minor_unit:
              description: Currency minor unit.
              type: integer
              readOnly: true
            currency_decimal_separator:
              description: Currency decimal separator.
              type: string
              readOnly: true
            currency_thousand_separator:
              description: Currency thousand separator.
              type: string
              readOnly: true
            currency_prefix:
              description: Currency prefix.
              type: string
              readOnly: true
            currency_suffix:
              description: Currency suffix.
              type: string
              readOnly: true
          readOnly: true
        stats:
          description: What the customer has bought.
          type: object
          properties:
            orders_count:
              description: Number of orders.
              type: integer
              readOnly: true
            total_spent:
              description: Total the customer has spent. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
            is_paying_customer:
              description: Whether the customer has paid for an order.
              type: boolean
              readOnly: true
          readOnly: true
        billing:
          description: Billing address. Null when there is none.
          type: object
          properties:
            first_name:
              description: First name.
              type: string
              readOnly: true
            last_name:
              description: Last name.
              type: string
              readOnly: true
            company:
              description: Company name.
              type: string
              readOnly: true
            address_1:
              description: Address line 1.
              type: string
              readOnly: true
            address_2:
              description: Address line 2.
              type: string
              readOnly: true
            city:
              description: City.
              type: string
              readOnly: true
            state:
              description: State/Province.
              type: string
              readOnly: true
            postcode:
              description: Postcode/ZIP.
              type: string
              readOnly: true
            country:
              description: Country code.
              type: string
              readOnly: true
            email:
              description: Email address.
              type: string
              readOnly: true
            phone:
              description: Phone number.
              type: string
              readOnly: true
            formatted:
              description: The address on one line, for display.
              type: string
              readOnly: true
          readOnly: true
          nullable: true
        shipping:
          description: Shipping address. Also null when the store doesn't ship, or only ships to the billing address. Null when there is none.
          type: object
          properties:
            first_name:
              description: First name.
              type: string
              readOnly: true
            last_name:
              description: Last name.
              type: string
              readOnly: true
            company:
              description: Company name.
              type: string
              readOnly: true
            address_1:
              description: Address line 1.
              type: string
              readOnly: true
            address_2:
              description: Address line 2.
              type: string
              readOnly: true
            city:
              description: City.
              type: string
              readOnly: true
            state:
              description: State/Province.
              type: string
              readOnly: true
            postcode:
              description: Postcode/ZIP.
              type: string
              readOnly: true
            country:
              description: Country code.
              type: string
              readOnly: true
            phone:
              description: Phone number.
              type: string
              readOnly: true
            formatted:
              description: The address on one line, for display.
              type: string
              readOnly: true
          readOnly: true
          nullable: true
        tax:
          description: How tax applies to the customer.
          type: object
          properties:
            is_vat_exempt:
              description: Whether the customer is exempt from VAT.
              type: boolean
              readOnly: true
            is_outside_base:
              description: Whether the customer is outside the store's base location.
              type: boolean
              readOnly: true
          readOnly: true
        recent_orders:
          description: 'The customer''s most recent orders, newest first: 5 by default (`cocart_customer_recent_orders_limit`). An empty list when there are none.'
          type: array
          items:
            type: object
            properties:
              id:
                description: Order ID.
                type: integer
                readOnly: true
              number:
                description: Order number.
                type: string
                readOnly: true
              status:
                description: Order status.
                type: object
                properties:
                  code:
                    description: Status code, not translated and without the "wc-" prefix, e.g. on-hold. Use this in code.
                    type: string
                    readOnly: true
                  label:
                    description: Status label, translated, for display.
                    type: string
                    readOnly: true
                readOnly: true
              date_created:
                description: When the order was placed. Null when there is none.
                type: object
                properties:
                  iso:
                    description: The date in ISO 8601 format, with the site's UTC offset.
                    type: string
                    format: date-time
                    readOnly: true
                  label:
                    description: The date in the site's date and time format, for display.
                    type: string
                    readOnly: true
                readOnly: true
                nullable: true
              total:
                description: Order total, in the order's currency. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
                type: string
                readOnly: true
              href:
                description: Link to the order.
                type: string
                format: uri
                readOnly: true
          readOnly: true
        meta:
          description: The customer's meta the store allows (`cocart_customer_allowed_meta_keys`). Keyed by meta key, with the first value of each as stored. Only keys the store allows, narrowed by `meta_keys`. An empty object when there are none.
          type: object
          additionalProperties: true
          readOnly: true
        extensions:
          description: Other plugins' data on the customer, keyed by plugin. An empty object when there is none.
          type: object
          properties:
            email_verification:
              description: Whether the customer has confirmed their account email address, which links their past orders to the account.
              type: object
              properties:
                verified:
                  description: True once the account email address is confirmed.
                  type: boolean
                  readOnly: true
              readOnly: true
          readOnly: true
    ErrorResponse:
      type: object
      description: 'An error: nothing was changed. The shape is WordPress''s.'
      required:
      - code
      - message
      - data
      properties:
        code:
          type: string
          description: 'A stable code to branch on: `cocart_` and snake case, or WordPress''s own `rest_` codes for arguments it refuses.'
        message:
          type: string
          description: For the customer, as plain text.
        data:
          type: object
          required:
          - status
          additionalProperties: true
          properties:
            status:
              type: integer
              description: The HTTP status.
            field:
              type: string
              description: The first field at fault, as a path such as `billing.postcode`.
            fields:
              type: object
              additionalProperties:
                type: string
              description: Every field at fault, by path, with its message.
            reason:
              type: string
              description: The underlying plugin's own reason, when there is one.
    OrderWithdrawal:
      description: What asking to withdraw from an order did.
      type: object
      properties:
        object:
          description: 'The kind of document: "withdrawal_request".'
          type: string
          enum:
          - withdrawal_request
          readOnly: true
        result:
          description: What the request did. Only in responses to requests that change something.
          type: object
          properties:
            code:
              description: Result code to branch on, not translated.
              type: string
              readOnly: true
            message:
              description: Message for the customer.
              type: string
              readOnly: true
          readOnly: true
        email:
          description: The email address the acknowledgement was sent to.
          type: string
          format: email
          readOnly: true
security:
- {}
- basicAuth: []
- bearerAuth: []
