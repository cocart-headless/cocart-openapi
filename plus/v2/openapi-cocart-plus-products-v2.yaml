openapi: 3.0.3
info:
  title: CoCart Plus - Products API v2
  version: 2.0.0
  description: |
    CoCart Plus extends the CoCart REST API v2 with a product shipping rates
    endpoint for calculating shipping costs for a product before it is added
    to the cart.

    Requires CoCart Starter v5.0+ to be installed and active.

    **Choices sent on CoCart Starter routes**

    Some extension data describes a choice the customer makes. The choice is sent to
    CoCart Starter's cart routes, which aren't part of this spec:

    - Subscription plans (`subscription_schemes`): send the option's `value` as
      `convert_to_sub` to `POST /cart/add-item` (`"0"` for one-time; without it
      the default option applies). To switch a cart item, send `namespace`
      `update-item-schema`, the `item_key` and `convert_to_sub` to
      `POST /cart/update`. Each option's `rest_url` is that request, ready-made.
    - Gifting (WooCommerce Subscriptions gifting): send `recipient_email` to
      `POST /cart/add-item`.
    - WooCommerce Warranty: send the option's `key` (or its index) as
      `item_data[warranty]` to `POST /cart/add-item`.
  termsOfService: https://cocartapi.com/terms-of-conditions-polar/
  contact:
    email: support@cocartapi.com
  license:
    name: GNU General Public License v3.0
    url: http://www.gnu.org/licenses/gpl-3.0.html
externalDocs:
  description: Find out more about CoCart API
  url: https://docs.cocartapi.com
servers:
- url: '{protocol}://{host}/wp-json/cocart/v2'
  description: API v2
  variables:
    protocol:
      enum:
      - http
      - https
      default: https
    host:
      default: example-store.com
      description: Your store domain
tags:
- name: products
  description: Operations for product shipping calculations
paths:
  /products/{id}/shipping-rates:
    get:
      tags:
      - products
      summary: Get a product's shipping rates
      description: 'Calculates the shipping rates a product would have, without a cart: the `product`, the `quantity`, the store `currency`, whether the item is already `in_cart`, and the `packages`, each with its `id` (WooCommerce''s package ID, `"0"` for the first), `destination` and `rates`. Amounts follow `formatted`. Sending a `cart_key` is refused.'
      parameters:
      - name: id
        in: path
        required: true
        description: Unique identifier for the product or variation ID.
        schema:
          type: string
      - name: quantity
        in: query
        required: false
        description: Quantity of this item to add to the cart.
        schema:
          type: string
          default: '1'
      - name: variation
        in: query
        required: false
        description: Variable attributes that identify the variation of the item.
        schema:
          type: object
          items:
            type: object
            properties:
              attribute:
                description: Variation attribute name.
                type: string
              value:
                description: Variation attribute value.
                type: string
      - name: item_data
        in: query
        required: false
        description: Additional item data passed to make item unique.
        schema:
          type: object
      - name: formatted
        in: query
        required: false
        description: True if you want to return the price values formatted.
        schema:
          default: false
          type: boolean
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductShippingRates'
              example:
                object: shipping_rates
                product:
                  id: 2216
                  parent_id: 0
                  name: Shippable Test Product
                  type: simple
                quantity: 1
                currency:
                  currency_code: USD
                  currency_symbol: $
                  currency_symbol_pos: currency_prefix
                  currency_minor_unit: 2
                  currency_decimal_separator: .
                  currency_thousand_separator: ','
                  currency_prefix: $
                  currency_suffix: ''
                in_cart: false
                packages:
                - id: '0'
                  destination: 123 Test Street, 75001 PARIS, France
                  rates:
                  - id: flat_rate:3182
                    method_id: flat_rate
                    instance_id: 3182
                    label: Flat rate
                    cost: '1000'
                    tax: '150'
                    meta_data:
                    - key: items
                      value: Shippable Test Product × 1
        '400':
          description: 'Bad request: `cocart_calculate_product_shipping_external_types_denied`, `cocart_calculate_product_shipping_grouped_types_denied`, `cocart_calculate_product_shipping_rates_cart_access_denied`, `cocart_calculate_product_shipping_rates_failed`, `cocart_no_variation_found`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cocart_calculate_product_shipping_external_types_denied:
                  summary: cocart_calculate_product_shipping_external_types_denied
                  value:
                    code: cocart_calculate_product_shipping_external_types_denied
                    message: This product is external, therefore it cannot be calculated for shipping rates.
                    data:
                      status: 400
                cocart_calculate_product_shipping_grouped_types_denied:
                  summary: cocart_calculate_product_shipping_grouped_types_denied
                  value:
                    code: cocart_calculate_product_shipping_grouped_types_denied
                    message: This product is a group of products, therefore it cannot be calculated for shipping rates.
                    data:
                      status: 400
                cocart_calculate_product_shipping_rates_cart_access_denied:
                  summary: cocart_calculate_product_shipping_rates_cart_access_denied
                  value:
                    code: cocart_calculate_product_shipping_rates_cart_access_denied
                    message: Shipping rates for a product are calculated without a cart. Leave out the cart key.
                    data:
                      status: 400
                cocart_calculate_product_shipping_rates_failed:
                  summary: cocart_calculate_product_shipping_rates_failed
                  value:
                    code: cocart_calculate_product_shipping_rates_failed
                    message: Shipping rates could not be calculated for this product.
                    data:
                      status: 400
                cocart_no_variation_found:
                  summary: cocart_no_variation_found
                  value:
                    code: cocart_no_variation_found
                    message: No matching variation found.
                    data:
                      status: 400
        '404':
          description: 'Not found: `cocart_invalid_product`, `cocart_unknown_product_id`, `cocart_variation_invalid_id`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cocart_invalid_product:
                  summary: cocart_invalid_product
                  value:
                    code: cocart_invalid_product
                    message: This product is invalid.
                    data:
                      status: 404
                cocart_unknown_product_id:
                  summary: cocart_unknown_product_id
                  value:
                    code: cocart_unknown_product_id
                    message: Product does not exist! Check that you have submitted a product ID or SKU ID correctly for a product that exists.
                    data:
                      status: 404
                cocart_variation_invalid_id:
                  summary: cocart_variation_invalid_id
                  value:
                    code: cocart_variation_invalid_id
                    message: Invalid variation ID.
                    data:
                      status: 404
        '500':
          description: 'Server error: `cocart_not_loaded`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cocart_not_loaded:
                  summary: cocart_not_loaded
                  value:
                    code: cocart_not_loaded
                    message: Either the core of CoCart is not active or a specific class required does not exist.
                    data:
                      status: 500
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        Basic authentication with username and password.

        Since CoCart v4.9.0, if an `X-HTTP-Method-Override` header is present, it is honored
        when determining the request method during authentication (e.g. credentials sent in a
        JSON body are still detected when the original method is tunneled through POST).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer token authentication (JWT). Optional for products endpoints.
  schemas:
    ErrorResponse:
      type: object
      description: 'An error: nothing was changed. The shape is WordPress''s.'
      required:
      - code
      - message
      - data
      properties:
        code:
          type: string
          description: 'A stable code to branch on: `cocart_` and snake case, or WordPress''s own `rest_` codes for arguments it refuses.'
        message:
          type: string
          description: For the customer, as plain text.
        data:
          type: object
          required:
          - status
          additionalProperties: true
          properties:
            status:
              type: integer
              description: The HTTP status.
            field:
              type: string
              description: The first field at fault, as a path such as `billing.postcode`.
            fields:
              type: object
              additionalProperties:
                type: string
              description: Every field at fault, by path, with its message.
            reason:
              type: string
              description: The underlying plugin's own reason, when there is one.
    ProductExtensions:
      type: object
      description: What each supported plugin adds under a product's `extensions` on CoCart Starter's product routes, keyed by what the data is.
      additionalProperties: true
      properties:
        subscription_data:
          description: Subscription data (if any) for the product.
          type: object
          properties:
            billing_period:
              description: Subscription billing period details.
              type: object
              properties:
                interval:
                  description: Subscription billing interval.
                  readOnly: true
                  oneOf:
                  - type: string
                  - type: integer
                period:
                  description: Subscription billing period.
                  type: string
                  readOnly: true
                length:
                  description: Subscription billing length.
                  readOnly: true
                  oneOf:
                  - type: string
                  - type: integer
                trial_period:
                  description: Subscription trial period.
                  type: string
                  readOnly: true
                trial_length:
                  description: Subscription trial length.
                  readOnly: true
                  oneOf:
                  - type: string
                  - type: integer
                trial_expiration_date:
                  description: 'When the free trial ends: GMT date (Y-m-d H:i:s) for a subscription started now, or 0 when there is no trial.'
                  readOnly: true
                  oneOf:
                  - type: string
                  - type: integer
                expiration_date:
                  description: 'When the subscription ends: GMT date (Y-m-d H:i:s) for a subscription started now, or 0 when it never expires.'
                  readOnly: true
                  oneOf:
                  - type: string
                  - type: integer
              readOnly: true
            sign_up_fee:
              description: Subscription sign up fee.
              type: string
              readOnly: true
            pay_now:
              description: Subscription amount to pay now.
              type: string
              readOnly: true
            needs_one_time_shipping:
              description: Does the subscription only require shipping once?
              type: boolean
              readOnly: true
            price_string:
              description: The subscription price string.
              type: string
              readOnly: true
            first_renewal:
              description: The first renewal date and time of the subscription.
              type: object
              properties:
                date:
                  description: 'First renewal: GMT date (Y-m-d H:i:s) for a subscription started now, or 0 when there is no renewal.'
                  readOnly: true
                  oneOf:
                  - type: string
                  - type: integer
                timestamp:
                  description: First renewal Unix timestamp.
                  type: integer
                  readOnly: true
                html:
                  description: First renewal date as a human-readable string.
                  type: string
                  readOnly: true
              readOnly: true
          readOnly: true
        points_and_rewards:
          description: Points earning and redemption data for the product.
          type: object
          properties:
            points_earned:
              description: Number of points earned when purchasing this product.
              type: integer
              readOnly: true
            max_discount:
              description: Maximum discount redeemable on this product in the smallest currency unit. Empty string when no limit is set.
              type: string
              readOnly: true
          readOnly: true
        gifting:
          description: Gifting configuration for this product.
          type: object
          properties:
            giftable:
              description: Whether this product can be purchased as a gift for a recipient (send `recipient_email` to `POST /cart/add-item`).
              type: boolean
              readOnly: true
          readOnly: true
        subscription_schemes:
          description: 'Purchase options for this product: one-time and/or subscription plans. Listed only when there is a choice.'
          type: array
          items:
            type: object
            properties:
              price:
                description: Scheme price.
                type: string
                readOnly: true
              period:
                description: Scheme billing period label.
                type: string
                readOnly: true
              value:
                description: 'Scheme key: send it as `convert_to_sub` to `POST /cart/add-item` to add the product with this option ("0" for one-time). Without `convert_to_sub` the default option applies.'
                type: string
                readOnly: true
              rest_url:
                description: Ready-made request to add the product with this option (`POST`).
                type: string
                readOnly: true
          readOnly: true
        composite_data:
          description: Composite product form configuration.
          type: object
          properties:
            layout:
              description: Composite layout mode.
              type: string
              readOnly: true
            components:
              description: Component definitions for form rendering.
              type: array
              items:
                type: object
                properties:
                  id:
                    description: Component ID.
                    type: string
                    readOnly: true
                  title:
                    description: Component title.
                    type: string
                    readOnly: true
                  optional:
                    description: Whether this component is optional.
                    type: boolean
                    readOnly: true
                  quantity_min:
                    description: Minimum quantity for this component.
                    type: integer
                    readOnly: true
                  quantity_max:
                    description: Maximum quantity for this component, or null if unlimited.
                    type: integer
                    readOnly: true
                    nullable: true
                  priced_individually:
                    description: Whether this component is priced individually.
                    type: boolean
                    readOnly: true
                  discount:
                    description: Discount applied to this component, or null if none.
                    type: number
                    readOnly: true
                    nullable: true
                  default_option_id:
                    description: Default product ID pre-selected for this component.
                    type: integer
                    readOnly: true
                  options_style:
                    description: Display style for component options.
                    type: string
                    readOnly: true
              readOnly: true
          readOnly: true
        bundle_data:
          description: Bundle product form configuration.
          type: object
          properties:
            layout:
              description: Bundle layout mode.
              type: string
              readOnly: true
            items:
              description: Bundled item definitions for form rendering.
              type: array
              items:
                type: object
                properties:
                  id:
                    description: Bundled product ID.
                    type: integer
                    readOnly: true
                  optional:
                    description: Whether this bundled item is optional.
                    type: boolean
                    readOnly: true
                  quantity:
                    description: Quantity constraints for this bundled item.
                    type: object
                    properties:
                      value:
                        description: Default quantity.
                        type: integer
                        readOnly: true
                      minimum:
                        description: Minimum quantity.
                        type: integer
                        readOnly: true
                      maximum:
                        description: Maximum quantity, or null if unlimited.
                        type: integer
                        readOnly: true
                        nullable: true
                    readOnly: true
                  priced_individually:
                    description: Whether this bundled item is priced individually.
                    type: boolean
                    readOnly: true
                  discount:
                    description: Discount applied to this bundled item, or null if none.
                    type: number
                    readOnly: true
                    nullable: true
              readOnly: true
          readOnly: true
        accommodation_booking_data:
          description: Accommodation booking constraints for the product.
          type: object
          properties:
            min_nights:
              description: Minimum number of nights required for the booking.
              type: integer
              readOnly: true
            max_nights:
              description: Maximum number of nights allowed for the booking.
              type: integer
              readOnly: true
            check_in_time:
              description: Check-in time in HH:MM format.
              type: string
              readOnly: true
            check_out_time:
              description: Check-out time in HH:MM format.
              type: string
              readOnly: true
          readOnly: true
        booking_data:
          description: Bookable product configuration.
          type: object
          properties:
            duration_type:
              description: Whether the booking duration is fixed or set by the customer.
              type: string
              readOnly: true
            duration_unit:
              description: Unit of time used for the booking duration.
              type: string
              readOnly: true
            duration:
              description: Number of duration units for the booking.
              type: integer
              readOnly: true
            has_persons:
              description: Whether the booking supports person counts.
              type: boolean
              readOnly: true
            min_persons:
              description: Minimum number of persons required for the booking.
              type: integer
              readOnly: true
            max_persons:
              description: Maximum number of persons allowed for the booking.
              type: integer
              readOnly: true
            has_resources:
              description: Whether the booking has selectable resources.
              type: boolean
              readOnly: true
            resource_label:
              description: Label displayed for the resource selector.
              type: string
              readOnly: true
            booking_location:
              description: Location details for the booking.
              type: string
              readOnly: true
          readOnly: true
        msrp_data:
          description: Manufacturer's suggested retail price data for the product.
          type: object
          properties:
            msrp_price:
              type: string
              description: MSRP in the smallest currency unit (simple products only).
              readOnly: true
            msrp_price_min:
              type: string
              description: Lowest MSRP across variations in the smallest currency unit (variable products only).
              readOnly: true
            msrp_price_max:
              type: string
              description: Highest MSRP across variations in the smallest currency unit (variable products only).
              readOnly: true
          readOnly: true
        quantity_rules:
          description: Quantity purchase rules for the product.
          type: object
          properties:
            minimum:
              description: Minimum quantity required to purchase. Zero means no minimum.
              type: integer
              readOnly: true
            maximum:
              description: Maximum quantity allowed to purchase, or null if unlimited.
              type: integer
              readOnly: true
              nullable: true
            group_of:
              description: Quantity must be purchased in multiples of this value. Zero means no restriction.
              type: integer
              readOnly: true
            combine_variations:
              description: Whether quantities across all variations are combined when checking rules (variable products only).
              type: boolean
              readOnly: true
          readOnly: true
        condition:
          description: Product condition information.
          type: object
          properties:
            slug:
              description: Condition slug identifier.
              type: string
              readOnly: true
            label:
              description: Human-readable condition label.
              type: string
              readOnly: true
            schema_condition:
              description: Schema.org OfferItemCondition value.
              type: string
              readOnly: true
            custom_label:
              description: Custom condition label text, when condition is "other" or "new-other".
              type: string
              readOnly: true
          readOnly: true
        discount:
          description: Active discount information for this product.
          type: object
          properties:
            original_price:
              description: Original price before the discount rule is applied.
              type: string
              readOnly: true
            saved_amount:
              description: Amount saved by the active discount rule.
              type: string
              readOnly: true
          readOnly: true
        addons:
          description: Add-on field definitions configured for this product.
          type: array
          items:
            type: object
            properties:
              id:
                description: Unique add-on field identifier.
                type: integer
                readOnly: true
              name:
                description: Add-on field label shown to the customer.
                type: string
                readOnly: true
              type:
                description: Field type (custom_text, custom_textarea, multiple_choice, checkbox, select, datepicker, file_upload, input_multiplier, custom_price).
                type: string
                readOnly: true
              description:
                description: Optional field description shown below the label.
                type: string
                readOnly: true
              required:
                description: Whether the field must be filled before adding to cart.
                type: boolean
                readOnly: true
              position:
                description: Display order position (zero-based).
                type: integer
                readOnly: true
              display:
                description: Sub-display style for multiple_choice fields (select, radiobutton, images).
                type: string
                readOnly: true
              adjust_price:
                description: Whether this field adds a price adjustment to the product price.
                type: boolean
                readOnly: true
              price:
                description: Base price adjustment when adjust_price is true (options override this for choice-based types). For percentage_based, the percentage of the product price, e.g. "10" for 10%, not an amount.
                type: string
                readOnly: true
              price_type:
                description: 'Price type: flat_fee, quantity_based, or percentage_based.'
                type: string
                readOnly: true
              restrictions:
                description: Whether min/max restrictions are enabled for this field.
                type: boolean
                readOnly: true
              min:
                description: Minimum value (character count for text fields, quantity for multiplier, price for custom_price).
                type: number
                readOnly: true
              max:
                description: Maximum value (same units as min).
                type: number
                readOnly: true
              limit_file_types:
                description: Whether file type restrictions are enabled (file_upload fields only).
                type: boolean
                readOnly: true
              allowed_file_types:
                description: Allowed file extensions when limit_file_types is true (e.g. ["jpg","pdf"]).
                type: array
                items:
                  type: string
                readOnly: true
              options:
                description: Selectable options for choice-based field types.
                type: array
                items:
                  type: object
                  properties:
                    label:
                      description: Option label.
                      type: string
                      readOnly: true
                    price:
                      description: Price adjustment for this option. For percentage_based, the percentage of the product price, e.g. "10" for 10%, not an amount.
                      type: string
                      readOnly: true
                    price_type:
                      description: Price type for this option.
                      type: string
                      readOnly: true
                    image:
                      description: Image URL for swatch display (multiple_choice with images display).
                      type: string
                      readOnly: true
                readOnly: true
          readOnly: true
        warranty:
          description: Warranty configuration for this product.
          type: object
          properties:
            type:
              description: 'Warranty type: included or addon.'
              type: string
              readOnly: true
            label:
              description: Warranty field label shown to the customer.
              type: string
              readOnly: true
            options:
              description: Selectable warranty tiers.
              type: array
              items:
                type: object
                properties:
                  key:
                    description: Key to send as `item_data[warranty]` to `POST /cart/add-item` to choose this warranty (the numeric index works too).
                    type: string
                    readOnly: true
                  duration:
                    description: Human-readable warranty duration.
                    type: string
                    readOnly: true
                  cost:
                    description: Additional cost for this warranty tier.
                    type: string
                    readOnly: true
              readOnly: true
          readOnly: true
        vendor:
          description: Vendor store information for the product.
          type: object
          properties:
            id:
              description: Unique vendor identifier.
              type: integer
              readOnly: true
            store_name:
              description: Vendor store display name.
              type: string
              readOnly: true
            store_url:
              description: URL to the vendor store page.
              type: string
              format: uri
              readOnly: true
            avatar:
              description: URL to the vendor avatar image.
              type: string
              format: uri
              readOnly: true
            rating:
              description: Vendor rating summary.
              type: object
              properties:
                average:
                  description: Average vendor rating across all products.
                  type: string
                  readOnly: true
                count:
                  description: Total number of reviews for the vendor.
                  type: integer
                  readOnly: true
              readOnly: true
          readOnly: true
    ProductShippingRates:
      description: The shipping rates a product would have.
      type: object
      properties:
        object:
          description: 'The kind of document: "shipping_rates".'
          type: string
          enum:
          - shipping_rates
          readOnly: true
        product:
          description: The product the rates are for.
          type: object
          properties:
            id:
              description: Product or variation ID.
              type: integer
              readOnly: true
            parent_id:
              description: Parent product ID, or 0.
              type: integer
              readOnly: true
            name:
              description: Product name.
              type: string
              readOnly: true
            type:
              description: Product type.
              type: string
              readOnly: true
          readOnly: true
        quantity:
          description: The quantity the rates are for.
          type: number
          readOnly: true
        currency:
          description: The store currency, which the costs are in.
          type: object
          properties:
            currency_code:
              description: Currency code.
              type: string
              readOnly: true
            currency_symbol:
              description: Currency symbol.
              type: string
              readOnly: true
            currency_symbol_pos:
              description: The currency symbol position to which the currency needs to return for the prices.
              type: string
              readOnly: true
            currency_minor_unit:
              description: Currency minor unit.
              type: integer
              readOnly: true
            currency_decimal_separator:
              description: Currency decimal separator.
              type: string
              readOnly: true
            currency_thousand_separator:
              description: Currency thousand separator.
              type: string
              readOnly: true
            currency_prefix:
              description: Currency prefix.
              type: string
              readOnly: true
            currency_suffix:
              description: Currency suffix.
              type: string
              readOnly: true
          readOnly: true
        in_cart:
          description: Whether this item, with these options, is already in the cart. Null without a cart session.
          type: boolean
          readOnly: true
          nullable: true
        packages:
          description: The shipping packages with rates on offer.
          type: array
          items:
            type: object
            properties:
              id:
                description: 'Package ID, as checkout gives it and the cart gives it in `index`: "0" for the first package.'
                type: string
                readOnly: true
              destination:
                description: Where the package goes, on one line.
                type: string
                readOnly: true
              rates:
                description: The rates on offer.
                type: array
                items:
                  type: object
                  properties:
                    id:
                      description: Rate ID.
                      type: string
                      readOnly: true
