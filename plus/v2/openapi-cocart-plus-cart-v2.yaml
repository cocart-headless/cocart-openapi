  /cart/apply-coupon:
    post:
      tags:
      - coupons
      summary: Apply a coupon
      description: Applies a coupon to the cart. Returns the cart, as `GET /cart` gives it, with what happened in `notices`. A coupon already applied is the cart with an `info` notice. A coupon WooCommerce refuses, unknown, limited to other email addresses or used up by a guest, is `400 cocart_coupon_not_applied` with the reason and the `coupon` code in `data`.
      parameters:
      - $ref: '#/components/parameters/CartKey'
      - $ref: '#/components/parameters/Formatted'
      - $ref: '#/components/parameters/Thumb'
      - $ref: '#/components/parameters/DefaultCart'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  description: Coupon code to apply to the cart.
                  type: string
                email:
                  description: Customers email address.
                  type: string
                  format: email
              required:
              - code
      responses:
        '200':
          description: OK.
          headers:
            Country:
              $ref: '#/components/headers/GeoCountry'
            Country-Code:
              $ref: '#/components/headers/GeoCountryCode'
            Region:
              $ref: '#/components/headers/GeoRegion'
            Timezone:
              $ref: '#/components/headers/GeoTimezone'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
              example:
