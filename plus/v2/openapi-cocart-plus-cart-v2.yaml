openapi: 3.0.3
info:
  title: CoCart Plus - Cart API v2
  version: 2.0.0
  description: |
    CoCart Plus extends the CoCart REST API v2 with additional cart endpoints for
    the mini cart, coupons, fees, removing all items and setting shipping methods.

    Requires CoCart Starter v5.0+ to be installed and active.

    When the geolocation feature is enabled, responses include `Country`,
    `Country-Code`, `Region` and `Timezone` headers.
    When rate limiting is enabled, responses include `RateLimit-Limit`,
    `RateLimit-Remaining` and `RateLimit-Reset` headers (plus `RateLimit-Retry-After`
    on 429 responses). They are listed in `Access-Control-Expose-Headers`, so a frontend on another origin can read them.

    Cart responses belong to one cart, so they are kept out of shared caches (CDNs, a host's nginx
    microcache): `Cache-Control: no-cache, no-store, must-revalidate, max-age=0,
    private`, `Pragma: no-cache`, `X-Accel-Expires: 0` (consumed by nginx) and
    `Vary: Cart-Key, CoCart-API-Cart-Key, Authorization`.

    **Choices sent on CoCart Starter routes**

    Some extension data describes a choice the customer makes. The choice is sent to
    CoCart Starter's cart routes, which aren't part of this spec:

    - Subscription plans (`subscription_schemes`): send the option's `value` as
      `convert_to_sub` to `POST /cart/add-item` (`"0"` for one-time; without it
      the default option applies). To switch a cart item, send `namespace`
      `update-item-schema`, the `item_key` and `convert_to_sub` to
      `POST /cart/update`. Each option's `rest_url` is that request, ready-made.
    - Gifting (WooCommerce Subscriptions gifting): send `recipient_email` to
      `POST /cart/add-item`.
    - WooCommerce Warranty: send the option's `key` (or its index) as
      `item_data[warranty]` to `POST /cart/add-item`.
  termsOfService: https://cocartapi.com/terms-of-conditions-polar/
  contact:
    email: support@cocartapi.com
  license:
    name: GNU General Public License v3.0
    url: http://www.gnu.org/licenses/gpl-3.0.html
externalDocs:
  description: Find out more about CoCart API
  url: https://docs.cocartapi.com
servers:
- url: '{protocol}://{host}/wp-json/cocart/v2'
  description: API v2
  variables:
    protocol:
      enum:
      - http
      - https
      default: https
    host:
      default: example-store.com
      description: Your store domain
tags:
- name: mini-cart
  description: Operations for a lightweight mini cart response
- name: coupons
  description: Operations for managing coupons applied to the cart
- name: fees
  description: Operations for managing cart fees
- name: cart-items
  description: Operations for managing cart items
- name: shipping
  description: Operations for managing shipping on the cart
paths:
  /cart/mini:
    get:
      tags:
      - mini-cart
      summary: Get mini cart
      description: |
        Returns a lightweight version of the cart scoped to only the fields needed
        to render a mini cart: items, item count, currency and subtotal.
      parameters:
      - $ref: '#/components/parameters/CartKey'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Thumb'
      - $ref: '#/components/parameters/DefaultCart'
      - $ref: '#/components/parameters/Formatted'
      responses:
        '200':
          description: Mini cart retrieved successfully.
          headers:
            Country:
              $ref: '#/components/headers/GeoCountry'
            Country-Code:
              $ref: '#/components/headers/GeoCountryCode'
            Region:
              $ref: '#/components/headers/GeoRegion'
            Timezone:
              $ref: '#/components/headers/GeoTimezone'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiniCart'
              example:
                cart_hash: e629fa6598d732768f7c726b4b621285
                cart_key: cb7a23af96a3f23af3c28a8b4b8c6d5e
                currency:
                  currency_code: USD
                  currency_symbol: $
                  currency_symbol_pos: left
                  currency_minor_unit: 2
                  currency_decimal_separator: .
                  currency_thousand_separator: ','
                  currency_prefix: $
                  currency_suffix: ''
                item_count: 2
                items:
                - item_key: 6364d3f0f495b6ab9dcf8d3b5c6e0b01
                  id: 123
                  name: Premium Quality T-Shirt
                  price: '1800'
                  quantity: 2
                  variation: {}
                  cart_item_data: {}
                  featured_image: https://example-store.com/wp-content/uploads/2024/03/tshirt.jpg
                subtotal: '3600'
        '403':
          description: Forbidden - the minimum required version of CoCart is not installed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: cocart_minimum_version_required
                message: You do not have the minimum required version of CoCart installed to use this endpoint.
                data:
                  status: 403
        "404":
          description: The requested cart key has no cart session (`cocart_invalid_cart`), for example because the cart expired. Send the request again without a cart key to start a new cart.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: cocart_invalid_cart
                message: The cart requested is invalid.
                data:
                  status: 404
  /cart/coupons:
    get:
      tags:
      - coupons
      summary: Get applied coupons
      description: |
        Returns the coupons applied to the cart with the discount totals for each coupon.
      parameters:
      - $ref: '#/components/parameters/CartKey'
      responses:
        '200':
          description: Applied coupons retrieved successfully.
          headers:
            Country:
              $ref: '#/components/headers/GeoCountry'
            Country-Code:
              $ref: '#/components/headers/GeoCountryCode'
            Region:
              $ref: '#/components/headers/GeoRegion'
            Timezone:
              $ref: '#/components/headers/GeoTimezone'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppliedCouponDetailed'
              example:
              - coupon: summer10
                label: 'Coupon: summer10'
                discount_type: percent
                totals:
                  discount: '360'
                  discount_tax: '0'
        '404':
          description: Not found - coupons are not enabled or no coupons are applied. Also `cocart_invalid_cart` when the requested cart key has no cart session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_enabled:
                  summary: Coupons not enabled
                  value:
                    code: cocart_coupons_not_enabled
                    message: Coupons are not enabled for this store!
                    data:
                      status: 404
                none_applied:
                  summary: No coupons applied
                  value:
                    code: cocart_cart_no_coupons_applied
                    message: No coupons are applied to the cart!
                    data:
                      status: 404
                cocart_invalid_cart:
                  summary: Cart key with no cart session
                  value:
                    code: cocart_invalid_cart
                    message: The cart requested is invalid.
                    data:
                      status: 404
    delete:
      tags:
      - coupons
      summary: Remove all coupons
      description: |
        Removes all coupons applied to the cart and returns the updated cart.
      parameters:
      - $ref: '#/components/parameters/CartKey'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Thumb'
      - $ref: '#/components/parameters/DefaultCart'
      - $ref: '#/components/parameters/Formatted'
      responses:
        '200':
          description: All coupons removed. Returns the updated cart.
          headers:
            Country:
              $ref: '#/components/headers/GeoCountry'
            Country-Code:
              $ref: '#/components/headers/GeoCountryCode'
            Region:
              $ref: '#/components/headers/GeoRegion'
            Timezone:
              $ref: '#/components/headers/GeoTimezone'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartV2'
        '404':
          description: Not found - coupons are not enabled for this store. Also `cocart_invalid_cart` when the requested cart key has no cart session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cocart_coupons_not_enabled:
                  value:
                    code: cocart_coupons_not_enabled
                    message: Coupons are not enabled for this store!
                    data:
                      status: 404
                cocart_invalid_cart:
                  summary: Cart key with no cart session
                  value:
                    code: cocart_invalid_cart
                    message: The cart requested is invalid.
                    data:
                      status: 404
  /cart/coupons/validate:
    get:
      tags:
      - coupons
      summary: Validate applied coupons
      description: |
        Checks all coupons applied to the cart to see if they are still valid.
        Invalid or expired coupons are removed from the cart. Coupons with email
        restrictions are checked against the customers billing email. The updated
        cart is returned with notices describing the validation results.
      parameters:
      - $ref: '#/components/parameters/CartKey'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Thumb'
      - $ref: '#/components/parameters/DefaultCart'
      - $ref: '#/components/parameters/Formatted'
      - name: email
        in: query
        description: Customers billing email address used to check coupons restricted to certain email addresses.
        schema:
          type: string
          format: email
        required: false
      responses:
        '200':
          description: Coupons validated. Returns the updated cart with validation notices.
          headers:
            Country:
              $ref: '#/components/headers/GeoCountry'
            Country-Code:
              $ref: '#/components/headers/GeoCountryCode'
            Region:
              $ref: '#/components/headers/GeoRegion'
            Timezone:
              $ref: '#/components/headers/GeoTimezone'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartV2'
        '404':
          description: Not found - coupons are not enabled for this store. Also `cocart_invalid_cart` when the requested cart key has no cart session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cocart_coupons_not_enabled:
                  value:
                    code: cocart_coupons_not_enabled
                    message: Coupons are not enabled for this store!
                    data:
                      status: 404
                cocart_invalid_cart:
                  summary: Cart key with no cart session
                  value:
                    code: cocart_invalid_cart
                    message: The cart requested is invalid.
                    data:
                      status: 404
  /cart/apply-coupon:
    post:
      tags:
      - coupons
      summary: Apply coupon to cart
      description: |
        Applies a coupon code to the cart and returns the updated cart. If the coupon
        is already applied, the cart is returned with an informational notice.
        Coupons with email restrictions are checked against the customers billing
        email when provided.
      parameters:
      - $ref: '#/components/parameters/CartKey'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Thumb'
      - $ref: '#/components/parameters/DefaultCart'
      - $ref: '#/components/parameters/Formatted'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  description: Coupon code to apply to the cart.
                  type: string
                email:
                  description: Customers email address used to check coupons restricted to certain email addresses.
                  type: string
                  format: email
              required:
              - code
            example:
              code: summer10
      responses:
        '200':
          description: Coupon applied. Returns the updated cart.
          headers:
            Country:
              $ref: '#/components/headers/GeoCountry'
            Country-Code:
              $ref: '#/components/headers/GeoCountryCode'
            Region:
              $ref: '#/components/headers/GeoRegion'
            Timezone:
              $ref: '#/components/headers/GeoTimezone'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartV2'
        '404':
          description: Not found - coupons not enabled, no code provided, cart empty or coupon does not exist. Also `cocart_invalid_cart` when the requested cart key has no cart session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                coupons_not_enabled:
                  summary: Coupons are not enabled for this store
                  value:
                    code: cocart_coupons_not_enabled
                    message: Coupons are not enabled for this store!
                    data:
                      status: 404
                code_required:
                  summary: No coupon code provided
                  value:
                    code: cocart_coupon_code_required
                    message: No coupon code provided!
                    data:
                      status: 404
                not_exist:
                  summary: Coupon does not exist
                  value:
                    code: cocart_coupon_not_exist
                    message: Coupon "summer10" does not exist!
                    data:
                      status: 404
                cannot_add:
                  summary: Cart is empty
                  value:
                    code: cocart_coupon_cannot_add
                    message: Coupon cannot be applied to cart with no items.
                    data:
                      status: 404
                cocart_invalid_cart:
                  summary: Cart key with no cart session
                  value:
                    code: cocart_invalid_cart
                    message: The cart requested is invalid.
                    data:
                      status: 404
  /cart/coupons/{code}:
    delete:
      tags:
      - coupons
      summary: Remove coupon by code
      description: |
        Removes a single coupon from the cart by its coupon code and returns the updated cart.
      parameters:
      - name: code
        in: path
        description: |
          The coupon code to remove from the cart. Any code that can be applied
          (spaces, `%`, `.`, accented letters...) except one containing `/`;
          URL-encode it in the path (e.g. `summer%20sale`). To remove a code
          containing `/`, use `DELETE /cart/coupons` (removes all coupons).
        required: true
        schema:
          type: string
          pattern: ^[^/]+$
      - $ref: '#/components/parameters/CartKey'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Thumb'
      - $ref: '#/components/parameters/DefaultCart'
      - $ref: '#/components/parameters/Formatted'
      responses:
        '200':
          description: Coupon removed. Returns the updated cart.
          headers:
            Country:
              $ref: '#/components/headers/GeoCountry'
            Country-Code:
              $ref: '#/components/headers/GeoCountryCode'
            Region:
              $ref: '#/components/headers/GeoRegion'
            Timezone:
              $ref: '#/components/headers/GeoTimezone'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartV2'
        '404':
          description: Not found - coupons are not enabled, no code provided, or the coupon is not applied to the cart. Also `cocart_invalid_cart` when the requested cart key has no cart session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                coupons_not_enabled:
                  summary: Coupons are not enabled for this store
                  value:
                    code: cocart_coupons_not_enabled
                    message: Coupons are not enabled for this store!
                    data:
                      status: 404
                code_required:
                  summary: No coupon code provided
                  value:
                    code: cocart_coupon_required
                    message: No coupon code provided!
                    data:
                      status: 404
                not_applied:
                  summary: Coupon is not applied to the cart
                  value:
                    code: cocart_cart_coupon_invalid_code
                    message: Coupon does not exist in the cart.
                    data:
                      status: 404
                cocart_invalid_cart:
                  summary: Cart key with no cart session
                  value:
                    code: cocart_invalid_cart
                    message: The cart requested is invalid.
                    data:
                      status: 404
  /cart/add-fee:
    post:
      tags:
      - fees
      summary: Add fee to cart
      description: |
        Adds a fee to the cart. The fee is stored in session and applied when cart
        totals are calculated. Returns the updated cart. If the same fee was already
        added, the cart is returned with an informational notice.
      parameters:
      - $ref: '#/components/parameters/CartKey'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Thumb'
      - $ref: '#/components/parameters/DefaultCart'
      - $ref: '#/components/parameters/Formatted'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: Name of the fee.
                  type: string
                amount:
                  description: Amount for the fee as a decimal string (e.g. "10.00"). Use a negative amount for a discount.
                  type: string
                taxable:
                  description: Determines if the fee is taxable.
                  type: boolean
                  default: false
                tax_class:
                  description: The tax class the fee applies to.
                  type: string
              required:
              - name
              - amount
            example:
              name: Handling Fee
              amount: '10.00'
              taxable: true
      responses:
        '200':
          description: Fee added. Returns the updated cart.
          headers:
            Country:
              $ref: '#/components/headers/GeoCountry'
            Country-Code:
              $ref: '#/components/headers/GeoCountryCode'
            Region:
              $ref: '#/components/headers/GeoRegion'
            Timezone:
              $ref: '#/components/headers/GeoTimezone'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartV2'
        '404':
          description: Not found - fee name or amount missing, or cart is empty. Also `cocart_invalid_cart` when the requested cart key has no cart session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_name:
                  summary: Fee name missing
                  value:
                    code: cocart_fee_missing_name
                    message: Name of fee is missing!
                    data:
                      status: 404
                missing_amount:
                  summary: Fee amount missing
                  value:
                    code: cocart_fee_missing_amount
                    message: Fee amount is missing!
                    data:
                      status: 404
                cannot_add:
                  summary: Cart is empty
                  value:
                    code: cocart_fee_cannot_add
                    message: Fee cannot be applied to cart with no items.
                    data:
                      status: 404
                cocart_invalid_cart:
                  summary: Cart key with no cart session
                  value:
                    code: cocart_invalid_cart
                    message: The cart requested is invalid.
                    data:
                      status: 404
  /cart/remove-fees:
    post:
      tags:
      - fees
      summary: Remove all fees
      description: |
        Removes all fees from the cart and returns the updated cart.
      parameters:
      - $ref: '#/components/parameters/CartKey'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Thumb'
      - $ref: '#/components/parameters/DefaultCart'
      - $ref: '#/components/parameters/Formatted'
      responses:
        '200':
          description: All fees removed. Returns the updated cart.
          headers:
            Country:
              $ref: '#/components/headers/GeoCountry'
            Country-Code:
              $ref: '#/components/headers/GeoCountryCode'
            Region:
              $ref: '#/components/headers/GeoRegion'
            Timezone:
              $ref: '#/components/headers/GeoTimezone'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartV2'
        "404":
          description: The requested cart key has no cart session (`cocart_invalid_cart`), for example because the cart expired. Send the request again without a cart key to start a new cart.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: cocart_invalid_cart
                message: The cart requested is invalid.
                data:
                  status: 404
  /cart/items:
    delete:
      tags:
      - cart-items
      summary: Remove all items
      description: |
        Removes all items from the cart and returns the updated (empty) cart.
      parameters:
      - $ref: '#/components/parameters/CartKey'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Thumb'
      - $ref: '#/components/parameters/DefaultCart'
      - $ref: '#/components/parameters/Formatted'
      - $ref: '#/components/parameters/IfNoneMatch'
      - $ref: '#/components/parameters/SkipCache'
      responses:
        '200':
          description: All items removed. Returns the updated cart.
          headers:
            ETag:
              $ref: '#/components/headers/ETagHeader'
            CoCart-Cache:
              $ref: '#/components/headers/CoCartCacheHeader'
            Country:
              $ref: '#/components/headers/GeoCountry'
            Country-Code:
              $ref: '#/components/headers/GeoCountryCode'
            Region:
              $ref: '#/components/headers/GeoRegion'
            Timezone:
              $ref: '#/components/headers/GeoTimezone'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartV2'
        '304':
          description: Not Modified - cart unchanged since the ETag provided in If-None-Match.
          headers:
            ETag:
              $ref: '#/components/headers/ETagHeader'
            CoCart-Cache:
              $ref: '#/components/headers/CoCartCacheHeader'
        "404":
          description: The requested cart key has no cart session (`cocart_invalid_cart`), for example because the cart expired. Send the request again without a cart key to start a new cart.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: cocart_invalid_cart
                message: The cart requested is invalid.
                data:
                  status: 404
  /cart/set-shipping-method:
    post:
      tags:
      - shipping
      summary: Set shipping method
      description: |
        Sets the chosen shipping method for a shipping package (or all packages when
        no package ID is provided) and returns the updated cart with recalculated totals.
      parameters:
      - $ref: '#/components/parameters/CartKey'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Thumb'
      - $ref: '#/components/parameters/DefaultCart'
      - $ref: '#/components/parameters/Formatted'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rate_id:
                  description: The chosen rate ID for the package (e.g. "flat_rate:1").
                  type: string
                package_id:
                  description: The ID of the package being shipped. Leave blank to apply to all packages.
                  oneOf:
                  - type: integer
                    nullable: true
                  - type: string
                    nullable: true
              required:
              - rate_id
            example:
              rate_id: flat_rate:1
              package_id: 0
      responses:
        '200':
          description: Shipping method set. Returns the updated cart.
          headers:
            Country:
              $ref: '#/components/headers/GeoCountry'
            Country-Code:
              $ref: '#/components/headers/GeoCountryCode'
            Region:
              $ref: '#/components/headers/GeoRegion'
            Timezone:
              $ref: '#/components/headers/GeoTimezone'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartV2'
        '404':
          description: Not found - shipping is disabled, no rate ID provided, or shipping hasn't been calculated yet for the cart. Also `cocart_invalid_cart` when the requested cart key has no cart session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                shipping_disabled:
                  summary: Shipping is disabled for this store
                  value:
                    code: cocart_shipping_disabled
                    message: Shipping is disabled.
                    data:
                      status: 404
                missing_rate_id:
                  summary: No rate ID provided
                  value:
                    code: cocart_missing_rate_id
                    message: Invalid Rate ID.
                    data:
                      status: 404
                not_calculated:
                  summary: Applying to all packages, but shipping hasn't been calculated yet
                  value:
                    code: cocart_shipping_not_calculated
                    message: Customer has not calculated shipping.
                    data:
                      status: 404
                cocart_invalid_cart:
                  summary: Cart key with no cart session
                  value:
                    code: cocart_invalid_cart
                    message: The cart requested is invalid.
                    data:
                      status: 404
components:
  headers:
    ETagHeader:
      description: |
        Weak ETag cache validation token. Format: W/"<md5hash>". Use in If-None-Match on subsequent requests for conditional requests.
      schema:
        type: string
        pattern: ^W/"[a-f0-9]{32}"$
        example: W/"d41d8cd98f00b204e9800998ecf8427e"
    CoCartCacheHeader:
      description: |
        ETag cache status: HIT (304 returned), MISS (fresh response), SKIP (_skip_cache used).
      schema:
        type: string
        enum:
        - HIT
        - MISS
        - SKIP
        example: MISS
    GeoCountry:
      description: The geolocated country name of the customer. Only sent when the geolocation feature is enabled.
      schema:
        type: string
        example: United States
    GeoCountryCode:
      description: The geolocated two-letter country code of the customer. Only sent when the geolocation feature is enabled.
      schema:
        type: string
        example: US
    GeoRegion:
      description: The geolocated region of the customer. Only sent when the geolocation feature is enabled.
      schema:
        type: string
        example: California
    GeoTimezone:
      description: The geolocated timezone of the customer. Only sent when the geolocation feature is enabled.
      schema:
        type: string
        example: America/Los_Angeles
    RateLimitLimit:
      description: The maximum number of requests allowed in the current rate limit window. Only sent when rate limiting is enabled. Exposed to cross-origin requests.
      schema:
        type: integer
        example: 25
    RateLimitRemaining:
      description: The number of requests remaining in the current rate limit window. Only sent when rate limiting is enabled. Exposed to cross-origin requests.
      schema:
        type: integer
        example: 24
    RateLimitReset:
      description: Unix timestamp when the current rate limit window resets. Only sent when rate limiting is enabled. Exposed to cross-origin requests.
      schema:
        type: integer
        example: 1767225600
  parameters:
    CartKey:
      name: cart_key
      in: query
      description: Unique identifier for the cart/customer.
      required: false
      schema:
        type: string
    Fields:
      name: fields
      in: query
      description: Specify each parent field you want to request separated by (,) in the response before the data is fetched.
      required: false
      schema:
        type: string
    Thumb:
      name: thumb
      in: query
      description: True if you want to return the URL of the featured product image for each item in the cart.
      required: false
      schema:
        type: boolean
        default: true
    DefaultCart:
      name: default
      in: query
      description: Return the default cart data if set to true.
      required: false
      schema:
        type: boolean
        default: false
    Formatted:
      name: formatted
      in: query
      description: Returns price values as a formatted string (e.g. "$18.00") when true. Defaults to false, returning raw numeric values (e.g. 1800).
      required: false
      schema:
        type: boolean
        default: false
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: |
        Conditional request header. Send previous ETag value; server returns 304 Not Modified if resource unchanged.
      required: false
      schema:
        type: string
        example: W/"d41d8cd98f00b204e9800998ecf8427e"
    SkipCache:
      name: _skip_cache
      in: query
      description: |
        Set to true or 1 to bypass ETag checking. Forces full response with CoCart-Cache: SKIP header.
      required: false
      schema:
        type: string
        enum:
        - 'true'
        - '1'
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        Basic authentication with username and password.

        Since CoCart v4.9.0, if an `X-HTTP-Method-Override` header is present, it is honored
        when determining the request method during authentication (e.g. credentials sent in a
        JSON body are still detected when the original method is tunneled through POST).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer token authentication (JWT). Optional for cart endpoints.
        When provided by customers, enables enhanced functionality like persistent carts and user-specific data.
  schemas:
    MiniCart:
      type: object
      description: Lightweight cart object scoped to the fields needed to render a mini cart.
      properties:
        cart_hash:
          type: string
          nullable: true
          description: A unique hash key of the cart contents.
        cart_key:
          type: string
          description: The cart key identifying the cart in session.
        currency:
          $ref: '#/components/schemas/Currency'
        item_count:
          type: integer
          description: The number of items in the cart.
        items:
          type: array
          description: The items in the cart.
          items:
            $ref: '#/components/schemas/MiniCartItem'
        subtotal:
          type: string
          description: The cart subtotal. Raw numeric string (e.g. "3600") by default; formatted string (e.g. "$36.00") when `formatted=true`.
    MiniCartItem:
      type: object
      properties:
        item_key:
          type: string
          description: Unique identifier for the item within the cart.
        id:
          type: integer
          description: Product ID.
        name:
          type: string
          description: Product name.
        price:
          type: string
          description: Product price. Raw numeric string (e.g. "1800") by default; formatted string (e.g. "$18.00") when `formatted=true`.
        quantity:
          type: number
          description: Quantity of the item in the cart.
        variation:
          description: Variation attributes for the item.
          oneOf:
          - type: object
            additionalProperties:
              type: string
          - type: array
            items:
              type: string
        cart_item_data:
          type: object
          description: Additional cart item data.
          additionalProperties: true
        featured_image:
          type: string
          format: uri
          description: Product featured image URL.
    AppliedCouponDetailed:
      type: object
      description: A coupon applied to the cart with its discount totals.
      properties:
        coupon:
          type: string
          description: Coupon code.
        label:
          type: string
          description: Human-readable coupon label.
        discount_type:
          type: string
          description: Type of discount applied (e.g. percent, fixed_cart, fixed_product).
        totals:
          type: object
          properties:
            discount:
              type: string
              description: Total discounted by this coupon as a raw numeric string (e.g. "360").
            discount_tax:
              type: string
              description: Total discounted tax by this coupon as a raw numeric string.
    CartV2:
      type: object
      description: Complete cart object with enhanced v2 structure. CoCart Plus adds the `meta` property.
      properties:
        cart_hash:
          type: string
          description: Unique cart hash.
        cart_key:
          type: string
          description: Unique cart key for the customer.
        currency:
          $ref: '#/components/schemas/Currency'
        customer:
          $ref: '#/components/schemas/Customer'
        items:
          type: array
          description: Items in the cart.
          items:
            $ref: '#/components/schemas/CartItem'
        item_count:
          type: integer
          description: Total number of items in cart.
        items_weight:
          type: number
          description: Total weight of all items.
        coupons:
          type: array
          description: Applied coupons.
          items:
            $ref: '#/components/schemas/AppliedCoupon'
        needs_payment:
          type: boolean
          description: Whether the cart needs payment.
        needs_shipping:
          type: boolean
          description: Whether the cart needs shipping.
        shipping:
          $ref: '#/components/schemas/Shipping'
        fees:
          description: Fees added to the cart, keyed by fee ID. `{}` when there are none.
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CartFee"
        taxes:
          type: array
          description: Cart taxes.
          items:
            $ref: '#/components/schemas/CartTax'
        totals:
          $ref: '#/components/schemas/CartTotals'
        removed_items:
          type: array
          description: Recently removed items that can be restored.
          items:
            $ref: '#/components/schemas/RemovedItem'
        cross_sells:
          type: array
          description: Cross-sell products.
          items:
            $ref: '#/components/schemas/CrossSellItem'
        notices:
          type: object
          description: Cart notices and messages.
          additionalProperties: true
        meta:
          type: object
          description: Cart meta data stored in session. Added by CoCart Plus.
          additionalProperties: true
        extensions:
          $ref: '#/components/schemas/CartExtensions'
    CartExtensions:
      description: Data added to the cart by extensions (`cocart_cart_extensions`). `{}` when there is none. CoCart Plus adds the keys below, each only when its plugin is active and it applies; other plugins can add their own.
      type: object
      properties:
        points_and_rewards:
          description: 'Points and Rewards for the cart. Plugin: WooCommerce Points and Rewards.'
          type: object
          properties:
            points_balance:
              description: Points balance of the customer.
              type: integer
            points_to_earn:
              description: Points the cart earns.
              type: integer
            redemption_coupon:
              description: Points redemption coupon applied, or empty.
              type: string
        recurring_totals:
          description: 'Recurring totals for each subscription in the cart, keyed by its item key. Plugins: WooCommerce Subscriptions, Milo Subscriptions.'
          type: object
          additionalProperties:
            type: object
            properties:
              coupons:
                description: Coupons applied to the recurring cart (not Milo Subscriptions).
                type: array
                items:
                  $ref: '#/components/schemas/AppliedCoupon'
              shipping:
                description: Shipping of the recurring cart (not Milo Subscriptions).
                allOf:
                - $ref: '#/components/schemas/Shipping'
              fees:
                description: Fees of the recurring cart, keyed by fee ID (not Milo Subscriptions).
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/CartFee'
              taxes:
                description: Taxes of the recurring cart (not Milo Subscriptions).
                type: array
                items:
                  $ref: '#/components/schemas/CartTax'
              totals:
                description: Recurring totals.
                type: object
                properties:
                  period:
                    description: Billing period, e.g. "/ month".
                    type: string
                  subtotal:
                    description: Recurring subtotal, in minor units (formatted for display with `formatted=true`).
                    type: string
                  total:
                    description: Recurring total, in minor units (formatted for display with `formatted=true`).
                    type: string
                  label:
                    description: Recurring total as WooCommerce displays it (not Milo Subscriptions).
                    type: string
                  first_renewal:
                    description: First renewal.
                    type: object
                    properties:
                      date:
                        description: GMT date (Y-m-d H:i:s), or 0 when there is no renewal.
                        oneOf:
                        - type: string
                        - type: integer
                      formatted_date:
                        description: Date formatted for display.
                        type: string
                      labelled:
                        description: First renewal, ready to display.
                        type: string
      additionalProperties: true
    CartItem:
      type: object
      properties:
        item_key:
          type: string
          description: Unique identifier for the item within the cart.
        id:
          type: integer
          description: Product ID.
        name:
          type: string
          description: Product name.
        title:
          type: string
          description: Product title.
        price:
          type: string
          description: Current product price. Raw numeric value (e.g. "1800") by default; formatted string (e.g. "$18.00") when the `formatted` query parameter is true.
        quantity:
          type: object
          description: Quantity information for this item.
          properties:
            value:
              type: number
              description: Current quantity of the item in the cart.
            minimum:
              type: number
              description: The minimum purchase amount required.
            maximum:
              type: number
              description: The maximum purchase amount allowed. If -1 the item has an unlimited purchase amount.
            multiple_of:
              type: number
              description: The quantity must be a multiple of this value.
            editable:
              type: boolean
              description: Whether the quantity of the item is editable.
        totals:
          type: object
          description: Item totals. All values are raw numeric strings (e.g. "3600") by default; formatted strings (e.g. "$36.00") when `formatted=true`.
          properties:
            subtotal:
              type: string
              description: Line subtotal (before discounts).
            subtotal_tax:
              type: string
              description: Line subtotal tax.
            total:
              type: string
              description: Line total (after discounts).
            tax:
              type: string
              description: Line total tax.
        slug:
          type: string
          description: Product slug.
        meta:
          type: object
          description: Item metadata.
          properties:
            product_type:
              type: string
              description: Product type.
            sku:
              type: string
              description: Product SKU.
            dimensions:
              type: object
              description: Product dimensions.
              properties:
                length:
                  type: string
                  description: Product length.
                width:
                  type: string
                  description: Product width.
                height:
                  type: string
                  description: Product height.
                unit:
                  type: string
                  description: Dimension unit.
            weight:
              type: string
              description: Product weight.
            variation:
              description: Chosen attributes (for variations).
              oneOf:
              - type: object
                additionalProperties:
                  type: string
              - type: array
                items:
                  type: string
          additionalProperties: true
        backorders:
          type: string
          description: Backorder status.
        cart_item_data:
          type: object
          description: Custom cart item data.
          additionalProperties: true
        featured_image:
          type: string
          description: Product featured image URL.
        extensions:
          $ref: '#/components/schemas/CartItemExtensions'
    CartItemExtensions:
      description: Data added to a cart item by extensions (`cocart_cart_item_extensions`). `{}` when there is none. CoCart Plus adds the keys below, each only when its plugin is active and it applies to the item; other plugins can add their own.
      type: object
      properties:
        accommodation_booking_data:
          description: 'Accommodation booking check-in and check-out information for the cart item. Plugin: WooCommerce Accommodation Bookings.'
          type: object
          properties:
            check_in:
              description: Check-in date and time.
              type: string
            check_out:
              description: Check-out date and time.
              type: string
        addons:
          description: 'Add-on selections made by the customer for this cart item. Plugin: WooCommerce Product Add-Ons.'
          type: array
          items:
            type: object
            properties:
              field_label:
                description: The add-on field label.
                type: string
              field_type:
                description: The add-on field type (e.g. custom_text, multiple_choice, file_upload).
                type: string
              value:
                description: The selected or entered value, pre-formatted for display.
                type: string
              price:
                description: Price contribution of this selection.
                type: string
              price_type:
                description: 'Price type: flat_fee, quantity_based, or percentage_based.'
                type: string
        adp:
          description: 'Discount applied to this cart item by Advanced Dynamic Pricing. Plugin: Advanced Dynamic Pricing for WooCommerce.'
          type: object
          properties:
            original_price:
              description: Original per-unit price before discount.
              type: string
            saved_amount:
              description: Amount saved on this line by the matched rule(s).
              type: string
            is_free_item:
              description: Whether this item was added free by a Buy X Get Y rule.
              type: boolean
            rules:
              description: Names of the pricing rules that matched this cart item.
              type: array
              items:
                type: string
        booking_data:
          description: 'Booking configuration for the cart item. Plugin: WooCommerce Bookings.'
          type: object
          properties:
            start_date:
              description: Booking start date and time.
              type: string
            end_date:
              description: Booking end date and time.
              type: string
            all_day:
              description: Whether the booking spans the full day.
              type: boolean
            resource_id:
              description: Resource ID assigned to the booking.
              type: integer
            persons:
              description: Person counts per type for the booking.
              type: array
              items:
                type: integer
            cost:
              description: Calculated booking cost in the smallest currency unit.
              type: string
        bundle_data:
          description: 'Bundle configuration for the cart item. Plugin: WooCommerce Product Bundles.'
          type: object
          properties:
            items:
              description: Normalised bundle stamp keyed by bundled item ID.
              type: object
              additionalProperties:
                type: object
                properties:
                  id:
                    description: Selected product or variation ID.
                    type: integer
                  quantity:
                    description: Quantity information.
                    type: object
                    properties:
                      value:
                        description: Quantity value.
                        type: integer
                      minimum:
                        description: Minimum quantity.
                        type: integer
                      maximum:
                        description: Maximum quantity.
                        type: integer
                  variation:
                    description: Selected variation attributes.
                    type: object
                    additionalProperties:
                      type: string
                  discount:
                    description: Discount applied to this item, or null if none.
                    type: number
                    nullable: true
                  optional_selected:
                    description: Whether the customer included this optional item.
                    type: boolean
            child_items:
              description: Summary of bundled child items nested under this container.
              type: array
              items:
                type: object
                properties:
                  item_key:
                    description: Cart item key of the child item.
                    type: string
                  bundled_item_id:
                    description: Internal bundle definition ID for this child.
                    type: integer
                  id:
                    description: Product or variation ID.
                    type: integer
                  name:
                    description: Product name.
                    type: string
                  quantity:
                    description: Quantity information.
                    type: object
                    properties:
                      value:
                        description: Quantity value.
                        type: integer
                      minimum:
                        description: Minimum quantity.
                        type: integer
                      maximum:
                        description: Maximum quantity.
                        type: integer
                  price:
                    description: Unit price in the smallest currency unit.
                    type: string
                  variation:
                    description: Selected variation attributes.
                    type: object
                    additionalProperties:
                      type: string
            child_item_keys:
              description: Cart item keys of the bundled child items.
              type: array
              items:
                type: string
        composite_data:
          description: 'Composite product configuration for the cart item. Plugin: WooCommerce Composite Products.'
          type: object
          properties:
            components:
              description: Component configuration indexed by component ID.
              type: object
              additionalProperties:
                type: object
                properties:
                  id:
                    description: Selected product or variation ID for this component.
                    type: integer
                  quantity:
                    description: Quantity information for this component.
                    type: object
                    properties:
                      value:
                        description: Quantity selected for this component.
                        type: integer
                      minimum:
                        description: Minimum quantity allowed for this component.
                        type: integer
                      maximum:
                        description: Maximum quantity allowed for this component, or null if unlimited.
                        type: integer
                        nullable: true
                  variation:
                    description: Selected variation attributes for this component.
                    type: object
                    additionalProperties:
                      type: string
                  discount:
                    description: Discount applied to this component, or null if none.
                    type: number
                    nullable: true
                  optional:
                    description: Whether this component is optional.
                    type: boolean
                  priced_individually:
                    description: Whether this component is priced individually.
                    type: boolean
                  shipped_individually:
                    description: Whether this component is shipped individually.
                    type: boolean
                  title:
                    description: Component title.
                    type: string
            child_item_keys:
              description: Cart item keys of the composited child items.
              type: array
              items:
                type: string
        discount:
          description: 'Discount applied to this cart item. Plugin: Discount Rules for WooCommerce.'
          type: object
          properties:
            original_price:
              description: Original per-unit price before discount.
              type: string
            saved_amount:
              description: Amount saved on this line by the active rule.
              type: string
            is_free_item:
              description: Whether this item was added free by a Buy X Get Y rule.
              type: boolean
        gift_recipient:
          description: 'Gift recipient for this subscription cart item, set with `recipient_email` on `POST /cart/add-item`. Plugin: WooCommerce Subscriptions gifting.'
          type: object
          properties:
            email:
              description: Email address of the gift recipient.
              type: string
              format: email
        subscription_data:
          description: 'Subscription data (if any) for the item in the cart. Plugins: WooCommerce Subscriptions, Milo Subscriptions.'
          type: object
          properties:
            billing_period:
              description: Subscription billing period.
              type: object
              properties:
                interval:
                  description: Subscription billing interval.
                  oneOf:
                  - type: string
                  - type: integer
                period:
                  description: Subscription billing period.
                  type: string
                length:
                  description: Subscription billing length.
                  oneOf:
                  - type: string
                  - type: integer
                trial_period:
                  description: Subscription billing trial period.
                  type: string
                trial_length:
                  description: Subscription billing trial length.
                  oneOf:
                  - type: string
                  - type: integer
                trial_expiration_date:
                  description: 'When the free trial ends: GMT date (Y-m-d H:i:s) for a subscription started now, or 0 when there is no trial.'
                  oneOf:
                  - type: string
                  - type: integer
                expiration_date:
                  description: 'When the subscription ends: GMT date (Y-m-d H:i:s) for a subscription started now, or 0 when it never expires.'
                  oneOf:
                  - type: string
                  - type: integer
            sign_up_fee:
              description: Subscription sign up fee.
              type: string
            pay_now:
              description: Subscription amount to pay now.
              type: string
            needs_one_time_shipping:
              description: Does the subscription only require shipping once?
              type: boolean
            price_string:
              description: The price of the subscription.
              type: string
            first_renewal:
              description: The subscriptions date and time of the first renewal.
              type: object
              properties:
                date:
                  description: 'First renewal: GMT date (Y-m-d H:i:s) for a subscription started now, or 0 when there is no renewal.'
                  oneOf:
                  - type: string
                  - type: integer
                timestamp:
                  description: First renewal timestamp.
                  type: integer
                html:
                  description: First renewal string.
                  type: string
        subscription_schemes:
          description: 'Purchase options for this cart item: one-time and/or subscription plans, with the current one selected. Listed only when there is a choice. Plugin: All Products for WooCommerce Subscriptions.'
          type: array
          items:
            type: object
            properties:
              price:
                description: Scheme price.
                type: string
              period:
                description: Scheme billing period label.
                type: string
              value:
                description: 'Scheme key: send it as `convert_to_sub` with `namespace` `update-item-schema` and the `item_key` to `POST /cart/update` to switch the item to this option ("0" for one-time).'
                type: string
              selected:
                description: Whether this scheme is currently selected.
                type: boolean
              rest_url:
                description: Ready-made request to switch the item to this option (`POST`).
                type: string
        warranty:
          description: 'Warranty selected for this cart item. Plugin: WooCommerce Warranty.'
          type: object
          properties:
            label:
              description: Warranty label.
              type: string
            type:
              description: 'Warranty type: included or addon.'
              type: string
            duration:
              description: Human-readable warranty duration.
              type: string
            cost:
              description: Additional cost for this warranty.
              type: string
      additionalProperties: true
    Currency:
      type: object
      properties:
        currency_code:
          type: string
          description: Currency code.
        currency_symbol:
          type: string
          description: Currency symbol.
        currency_symbol_pos:
          type: string
          description: Currency symbol position.
        currency_minor_unit:
          type: integer
          description: Currency minor unit.
        currency_decimal_separator:
          type: string
          description: Currency decimal separator.
        currency_thousand_separator:
          type: string
          description: Currency thousand separator.
        currency_prefix:
          type: string
          description: Currency prefix.
        currency_suffix:
          type: string
          description: Currency suffix.
    Customer:
      type: object
      properties:
        billing_address:
          $ref: '#/components/schemas/BillingAddress'
        shipping_address:
          $ref: '#/components/schemas/ShippingAddress'
    BillingAddress:
      type: object
      properties:
        billing_first_name:
          type: string
        billing_last_name:
          type: string
        billing_company:
          type: string
        billing_country:
          type: string
        billing_address_1:
          type: string
        billing_address_2:
          type: string
        billing_postcode:
          type: string
        billing_city:
          type: string
        billing_state:
          type: string
        billing_phone:
          type: string
        billing_email:
          type: string
    ShippingAddress:
      type: object
      properties:
        shipping_first_name:
          type: string
        shipping_last_name:
          type: string
        shipping_company:
          type: string
        shipping_country:
          type: string
        shipping_address_1:
          type: string
        shipping_address_2:
          type: string
        shipping_postcode:
          type: string
        shipping_city:
          type: string
        shipping_state:
          type: string
    Shipping:
      type: object
      properties:
        total_packages:
          type: integer
          description: Number of shipping packages.
        show_package_details:
          type: boolean
          description: Whether to show package details.
        has_calculated_shipping:
          type: boolean
          description: Whether shipping has been calculated.
        packages:
          type: object
          description: Shipping packages.
          additionalProperties:
            $ref: '#/components/schemas/ShippingPackage'
    ShippingPackage:
      type: object
      properties:
        package_name:
          type: string
          description: Package name.
        rates:
          type: object
          description: Available shipping rates.
          additionalProperties:
            $ref: '#/components/schemas/ShippingRate'
        package_details:
          type: string
          description: Package details.
        index:
          type: integer
          description: Package index.
        chosen_method:
          type: string
          description: Chosen shipping method.
        formatted_destination:
          type: string
          description: Formatted destination address.
    ShippingRate:
      type: object
      properties:
        key:
          type: string
        method_id:
          type: string
        instance_id:
          type: integer
        label:
          type: string
        cost:
          type: string
          description: The rate cost. In minor units (e.g. `"1800"` for 18.00), or formatted (e.g. `"$18.00"`) when requested with `formatted`.
        html:
          type: string
        taxes:
          type: string
          description: The rate tax cost, all of its taxes added together. In minor units (e.g. `"1800"` for 18.00), or formatted (e.g. `"$18.00"`) when requested with `formatted`.
        chosen_method:
          type: boolean
    CartTotals:
      type: object
      description: All monetary values are raw numeric strings (e.g. "1800") by default. Pass `formatted=true` to receive formatted strings (e.g. "$18.00").
      properties:
        subtotal:
          type: string
          description: Cart subtotal.
        subtotal_tax:
          type: string
          description: Cart subtotal tax.
        shipping_total:
          type: string
          description: Shipping total.
        shipping_tax:
          type: string
          description: Shipping tax.
        shipping_taxes:
          type: array
          items:
            type: number
        discount_total:
          type: string
          description: Discount total.
        discount_tax:
          type: string
          description: Discount tax.
        cart_contents_total:
          type: string
          description: Cart contents total.
        cart_contents_tax:
          type: string
          description: Cart contents tax.
        cart_contents_taxes:
          type: array
          items:
            type: number
        fee_total:
          type: string
          description: Fee total.
        fee_tax:
          type: string
          description: Fee tax.
        fee_taxes:
          type: array
          items:
            type: number
        total:
          type: string
          description: Cart total.
        total_tax:
          type: string
          description: Total tax.
    CartFee:
      type: object
      description: A fee added to the cart.
      properties:
        name:
          type: string
          description: Fee name.
        fee:
          type: string
          description: Fee amount, including tax when the store displays prices including tax. In minor units (e.g. `"1800"` for 18.00), or formatted (e.g. `"$18.00"`) when requested with `formatted`.
    CartTax:
      type: object
      description: |
        Tax entry. Structure depends on the WooCommerce tax display setting:
        - Non-itemized: `{ label, total }` — a single combined tax line.
        - Itemized: `{ name, price }` — one entry per tax rate.
      properties:
        label:
          type: string
          description: Tax label (non-itemized mode).
        total:
          type: string
          description: Combined tax total as raw numeric string, e.g. "1310" (non-itemized mode). Formatted string when `formatted=true`.
        name:
          type: string
          description: Tax rate name (itemized mode).
        price:
          type: string
          description: Tax amount as raw numeric string (itemized mode). Formatted string when `formatted=true`.
    AppliedCoupon:
      type: object
      properties:
        coupon:
          type: string
          description: Coupon code.
        label:
          type: string
          description: Human-readable coupon label.
        discount_type:
          type: string
          description: Type of discount applied (e.g. percent, fixed_cart, fixed_product).
        saving:
          type: string
          description: Amount saved by this coupon, as a negative amount (e.g. `-180`, in the currency's minor units).
        saving_html:
          type: string
          description: Amount saved by this coupon, formatted for display without a sign (e.g. `$1.80`). `saving` carries the negative sign.
    RemovedItem:
      type: object
      properties:
        key:
          type: string
        product_id:
          type: integer
        quantity:
          type: integer
        name:
          type: string
    CrossSellItem:
      type: object
      properties:
        id:
          type: integer
        product_name:
          type: string
        product_title:
          type: string
        price:
          type: string
          description: Current price. Raw numeric string (e.g. "1800") by default; formatted string (e.g. "$18.00") when `formatted=true`.
        regular_price:
          type: string
          description: Regular price. Raw numeric string by default; formatted when `formatted=true`.
        sale_price:
          type: string
          description: Sale price if on sale, otherwise empty string. Raw numeric string by default; formatted when `formatted=true`.
        product_image:
          type: string
    ErrorResponse:
      type: object
      description: Standard error response structure.
      properties:
        code:
          type: string
          description: Machine-readable error code.
          example: cocart_invalid_parameter
        message:
          type: string
          description: Human-readable error message.
          example: Invalid parameter provided.
        data:
          type: object
          description: Additional error data.
          properties:
            status:
              type: integer
              description: HTTP status code.
              example: 400
          additionalProperties: true
security:
- {}
- basicAuth: []
- bearerAuth: []
