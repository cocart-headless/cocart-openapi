components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        Basic authentication with username and password.

        Since CoCart v4.9.0, if an `X-HTTP-Method-Override` header is present, it is honored
        when determining the request method during authentication (e.g. credentials sent in a
        JSON body are still detected when the original method is tunneled through POST).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer token authentication (JWT). Optional for cart endpoints.
        When provided by customers, enables enhanced functionality like persistent carts and user-specific data.
  headers:
    ETagHeader:
      description: |
        Weak ETag cache validation token. Format: W/"<md5hash>". Use in If-None-Match on subsequent requests for conditional requests.
      schema:
        type: string
        pattern: ^W/"[a-f0-9]{32}"$
        example: W/"d41d8cd98f00b204e9800998ecf8427e"
    CoCartCacheHeader:
      description: |
        ETag cache status: HIT (304 returned), MISS (fresh response), SKIP (_skip_cache used).
      schema:
        type: string
        enum:
        - HIT
        - MISS
        - SKIP
        example: MISS
    GeoCountry:
      description: The geolocated country name of the customer. Only sent when the geolocation feature is enabled.
      schema:
        type: string
        example: United States
    GeoCountryCode:
      description: The geolocated two-letter country code of the customer. Only sent when the geolocation feature is enabled.
      schema:
        type: string
        example: US
    GeoRegion:
      description: The geolocated region of the customer. Only sent when the geolocation feature is enabled.
      schema:
        type: string
        example: California
    GeoTimezone:
      description: The geolocated timezone of the customer. Only sent when the geolocation feature is enabled.
      schema:
        type: string
        example: America/Los_Angeles
    RateLimitLimit:
      description: The maximum number of requests allowed in the current rate limit window. Only sent when rate limiting is enabled. Exposed to cross-origin requests.
      schema:
        type: integer
        example: 25
    RateLimitRemaining:
      description: The number of requests remaining in the current rate limit window. Only sent when rate limiting is enabled. Exposed to cross-origin requests.
      schema:
        type: integer
        example: 24
    RateLimitReset:
      description: Unix timestamp when the current rate limit window resets. Only sent when rate limiting is enabled. Exposed to cross-origin requests.
      schema:
        type: integer
        example: 1767225600
  parameters:
    CartKey:
      name: cart_key
      in: query
      description: Unique identifier for the cart/customer.
      required: false
      schema:
        type: string
    Thumb:
      name: thumb
      in: query
      description: True if you want to return the URL of the featured product image for each item in the cart.
      required: false
      schema:
        type: boolean
        default: true
    DefaultCart:
      name: default
      in: query
      description: Return the default cart data if set to true.
      required: false
      schema:
        type: boolean
        default: false
    Formatted:
      name: formatted
      in: query
      description: Returns price values as a formatted string (e.g. "$18.00") when true. Defaults to false, returning raw numeric values (e.g. 1800).
      required: false
      schema:
        type: boolean
        default: false
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: |
        Conditional request header. Send previous ETag value; server returns 304 Not Modified if resource unchanged.
      required: false
      schema:
        type: string
        example: W/"d41d8cd98f00b204e9800998ecf8427e"
    SkipCache:
      name: _skip_cache
      in: query
      description: |
        Set to true or 1 to bypass ETag checking. Forces full response with CoCart-Cache: SKIP header.
      required: false
      schema:
        type: string
        enum:
        - 'true'
        - '1'
  schemas:
    Cart:
      description: 'The cart, as `GET /cart` gives it, with what CoCart Plus adds: its `meta`, and each coupon''s `discount_type`. Fees, shipping packages and their rates are keyed by ID.'
      type: object
      properties:
        cart_hash:
          description: A Unique hash key of the carts contents.
          type: string
          readOnly: true
        cart_key:
          description: The cart key identifying the cart in session.
          type: string
          readOnly: true
        currency:
          description: The store currency information.
          type: object
          properties:
            currency_code:
              description: The currency code (in ISO format) for returned prices.
              type: string
              readOnly: true
            currency_symbol:
              description: The currency symbol for the currency which can be used to format returned prices.
              type: string
              readOnly: true
            currency_symbol_pos:
              description: The currency symbol position to which the currency needs to return for the prices.
              type: string
              readOnly: true
            currency_minor_unit:
              description: The currency minor unit (number of digits after the decimal separator) for returned prices.
              type: integer
              readOnly: true
            currency_decimal_separator:
              description: The decimal separator for the currency which can be used to format returned prices.
              type: string
              readOnly: true
            currency_thousand_separator:
              description: The thousand separator for the currency which can be used to format returned prices.
              type: string
              readOnly: true
            currency_prefix:
              description: The price prefix for the currency which can be used to format returned prices.
              type: string
              readOnly: true
            currency_suffix:
              description: The price prefix for the currency which can be used to format returned prices.
              type: string
              readOnly: true
          readOnly: true
        customer:
          description: The customer information.
          type: object
          properties:
            billing_address:
              description: Customers billing address.
              type: object
              properties:
                billing_first_name:
                  description: Customers billing first name.
                  type: string
                  readOnly: true
                billing_last_name:
                  description: Customers billing last name.
                  type: string
                  readOnly: true
                billing_company:
                  description: Customers billing company name.
                  type: string
                  readOnly: true
                billing_country:
                  description: Customers billing country.
                  type: string
                  readOnly: true
                billing_address_1:
                  description: Customers billing address line one.
                  type: string
                  readOnly: true
                billing_address_2:
                  description: Customers billing address line two.
                  type: string
                  readOnly: true
                billing_city:
                  description: Customers billing address city.
                  type: string
                  readOnly: true
                billing_state:
                  description: Customers billing state.
                  type: string
                  readOnly: true
                billing_postcode:
                  description: Customers billing postcode or zip code.
                  type: string
                  readOnly: true
                billing_phone:
                  description: Customers billing phone.
                  type: string
                  readOnly: true
                billing_email:
                  description: Customers billing email address.
                  type: string
                  readOnly: true
              readOnly: true
            shipping_address:
              description: Customers shipping address.
              type: object
              properties:
                shipping_first_name:
                  description: Customers shipping first name.
                  type: string
                  readOnly: true
                shipping_last_name:
                  description: Customers shipping last name.
                  type: string
                  readOnly: true
                shipping_company:
                  description: Customers shipping company name.
                  type: string
                  readOnly: true
                shipping_country:
                  description: Customers shipping country.
                  type: string
                  readOnly: true
                shipping_address_1:
                  description: Customers shipping address line one.
                  type: string
                  readOnly: true
                shipping_address_2:
                  description: Customers shipping address line two.
                  type: string
                  readOnly: true
                shipping_city:
                  description: Customers shipping address city.
                  type: string
                  readOnly: true
                shipping_state:
                  description: Customers shipping state.
                  type: string
                  readOnly: true
                shipping_postcode:
                  description: Customers shipping postcode or zip code.
                  type: string
                  readOnly: true
                shipping_phone:
                  description: Customer's shipping phone.
                  type: string
                  readOnly: true
              readOnly: true
          readOnly: true
        items:
          description: The list of items in the cart.
          type: array
          items:
            type: object
            properties:
              item_key:
                description: Unique ID of the item in the cart.
                type: string
                readOnly: true
              id:
                description: Product ID or Variation ID of the item in the cart.
                type: integer
                readOnly: true
              name:
                description: The name of the item in the cart.
                type: string
                readOnly: true
              title:
                description: The title of the item in the cart.
                type: string
                readOnly: true
              variation:
                description: The variation attributes of the item in the cart (if item is a variation of a variable product).
                type: object
              price:
                description: The price of the item in the cart.
                type: string
                readOnly: true
              regular_price:
                description: The regular price of the item in the cart, before any sale discount. Empty if the item is not on sale.
                type: string
                readOnly: true
              on_sale:
                description: Whether the item in the cart is currently on sale.
                type: boolean
                readOnly: true
              quantity:
                description: The quantity of the item in the cart and minimum and maximum purchase capability.
                type: object
                properties:
                  value:
                    description: The quantity of the item in the cart.
                    type: number
                    readOnly: true
                  minimum:
                    description: The minimum purchase amount required.
                    type: number
                    readOnly: true
                  maximum:
                    description: The maximum purchase amount allowed. If -1 the item has an unlimited purchase amount.
                    type: number
                    readOnly: true
                  multiple_of:
                    description: The quantity must be a multiple of this value.
                    type: number
                    readOnly: true
                  editable:
                    description: Whether the quantity of the item is editable.
                    type: boolean
                    readOnly: true
                readOnly: true
              totals:
                description: The totals of the item in the cart.
                type: object
                properties:
                  subtotal:
                    description: The subtotal of the item in the cart.
                    type: string
                    readOnly: true
                  subtotal_tax:
                    description: The subtotal tax of the item in the cart.
                    type: string
                    readOnly: true
                  total:
                    description: The total of the item in the cart.
                    type: string
                    readOnly: true
                  tax:
                    description: The total tax of the item in the cart.
                    type: string
                    readOnly: true
                readOnly: true
              slug:
                description: The product slug of the item in the cart.
                type: string
                readOnly: true
              meta:
                description: The meta data of the item in the cart.
                type: object
                properties:
                  product_type:
                    description: The product type of the item in the cart.
                    type: string
                    readOnly: true
                  sku:
                    description: The SKU of the item in the cart.
                    type: string
                    readOnly: true
                  dimensions:
                    description: The dimensions of the item in the cart.
                    type: object
                    properties:
                      length:
                        description: The length of the item in the cart.
                        type: string
                        readOnly: true
                      width:
                        description: The width of the item in the cart.
                        type: string
                        readOnly: true
                      height:
                        description: The height of the item in the cart.
                        type: string
                        readOnly: true
                      unit:
                        description: The unit measurement of the item in the cart.
                        type: string
                        readOnly: true
                  weight:
                    description: The weight of the item in the cart.
                    type: string
                    readOnly: true
                readOnly: true
              backorders:
                description: The price of the item in the cart.
                type: string
                readOnly: true
              cart_item_data:
                description: Custom item data applied to the item in the cart (if any).
                type: object
                additionalProperties: true
              featured_image:
                description: The featured image of the item in the cart.
                type: string
                readOnly: true
              extensions:
                $ref: '#/components/schemas/CartItemExtensions'
          readOnly: true
        item_count:
          description: The number of items in the cart.
          type: integer
          readOnly: true
        items_weight:
          description: The total weight of all items in the cart.
          type: string
          readOnly: true
        coupons:
          description: Coupons added to the cart.
          type: array
          items:
            type: object
            properties:
              coupon:
                description: The coupon code.
                type: string
                readOnly: true
              label:
                description: The coupon label.
                type: string
                readOnly: true
              saving:
                description: The amount discounted from the cart.
                type: string
                readOnly: true
              saving_html:
                description: The amount discounted from the cart (HTML formatted).
                type: string
                readOnly: true
              discount_type:
                description: The coupon's discount type, e.g. "percent" or "fixed_cart".
                type: string
                readOnly: true
          readOnly: true
        needs_payment:
          description: True if the cart needs payment. False for carts with only free products and no shipping costs.
          type: boolean
          readOnly: true
        needs_shipping:
          description: True if the cart needs shipping and requires the showing of shipping costs.
          type: boolean
          readOnly: true
        shipping:
          description: The shipping packages available to the customer. An empty list (`[]`) when the cart needs no shipping.
          oneOf:
          - type: object
            properties:
              total_packages:
                description: The number of shipping packages available calculated on the shipping address.
                type: integer
                readOnly: true
              show_package_details:
                description: True if the cart meets the criteria for showing items in the cart assigned to package.
                type: boolean
                readOnly: true
              has_calculated_shipping:
                description: True if the cart meets the criteria for showing shipping packages and rates have been calculated.
                type: boolean
                readOnly: true
              packages:
                description: 'The packages returned after calculating shipping. Keyed by package: `default` for the first, then WooCommerce''s package ID.'
                type: object
                additionalProperties:
                  description: The default package.
                  type: object
                  properties:
                    package_name:
                      description: The package name.
                      type: string
                      readOnly: true
                    rates:
                      description: The packages returned after calculating shipping. Keyed by rate ID.
                      type: object
                      properties:
                        '[a-z0-9]':
                          type: object
                          properties:
                            key:
                              description: The rate key.
                              type: string
                              readOnly: true
                            method_id:
                              description: The method ID.
                              type: string
                              readOnly: true
                            instance_id:
                              description: The instance ID.
                              type: integer
                              readOnly: true
                            label:
                              description: The rate label.
                              type: string
                              readOnly: true
                            cost:
                              description: The rate cost.
                              type: string
                              readOnly: true
                            html:
                              description: The rate label and cost formatted.
                              type: string
                              readOnly: true
                            taxes:
                              description: The rate tax cost, all of its taxes added together.
                              type: string
                              readOnly: true
                            chosen_method:
                              description: The chosen method.
                              type: boolean
                              readOnly: true
                            meta_data:
                              description: The rate meta data.
                              type: object
                              properties:
                                items:
                                  description: The items the shipping rate has calculated based on.
                                  type: string
                                  readOnly: true
                              readOnly: true
                      additionalProperties:
                        type: object
                        properties:
                          key:
                            description: Rate ID, e.g. "flat_rate:1".
                            type: string
                            readOnly: true
                          method_id:
                            description: Shipping method ID, e.g. "flat_rate".
                            type: string
                            readOnly: true
                          instance_id:
                            description: Shipping method instance ID.
                            type: integer
                            readOnly: true
                          label:
                            description: Rate label.
                            type: string
                            readOnly: true
                          cost:
                            description: Cost, in minor units, or formatted for display with `formatted`.
                            type: string
                            readOnly: true
                          html:
                            description: The rate as WooCommerce labels it, with its cost, as plain text.
                            type: string
                            readOnly: true
                          taxes:
                            description: The rate's taxes added together, in minor units, or formatted with `formatted`.
                            type: string
                            readOnly: true
                          chosen_method:
                            description: Whether this rate is the one chosen for the package.
                            type: boolean
                            readOnly: true
                          meta_data:
                            description: The rate's meta, keyed by meta key.
                            type: object
                            additionalProperties: true
                            readOnly: true
                      readOnly: true
                    package_details:
                      description: The package details if any.
                      type: string
                      readOnly: true
                    index:
                      description: The package index.
                      readOnly: true
                      oneOf:
                      - type: integer
                      - type: string
                    chosen_method:
                      description: The chosen method set from the available rates.
                      type: string
                      readOnly: true
                    formatted_destination:
                      description: The destination the package.
                      type: string
                      readOnly: true
                  readOnly: true
                readOnly: true
            readOnly: true
          - type: array
            maxItems: 0
            items: {}
            readOnly: true
        fees:
          description: The cart fees. Keyed by fee ID.
          type: object
          additionalProperties:
            type: object
            properties:
              name:
                description: The fee name.
                type: string
                readOnly: true
              fee:
                description: The fee value.
                type: string
                readOnly: true
          readOnly: true
        taxes:
          description: The cart taxes. Always a list, one entry per tax rate when the store tax display setting is itemized, or a single synthetic entry keyed "total" when it is not.
          type: array
          items:
            type: object
            properties:
              key:
                description: The tax rate code, or "total" when the store tax display setting is not itemized.
                type: string
                readOnly: true
              name:
                description: The tax name.
                type: string
                readOnly: true
              price:
                description: The tax price.
                type: string
                readOnly: true
          readOnly: true
        totals:
          description: The store currency information.
          type: object
          properties:
            subtotal:
              description: The subtotal of all items, shipping (if any) and fees (if any) before coupons applied (if any) to the cart.
              type: string
              readOnly: true
            subtotal_tax:
              description: The subtotal tax of all items, shipping (if any) and fees (if any) before coupons applied (if any) to the cart.
              type: string
              readOnly: true
            fee_total:
              description: The fee total.
              type: string
              readOnly: true
            fee_tax:
              description: The fee tax.
              type: string
              readOnly: true
            discount_total:
              description: The discount total.
              type: string
              readOnly: true
            discount_tax:
              description: The discount tax.
              type: string
              readOnly: true
            shipping_total:
              description: The shipping total of the selected packages.
              type: string
              readOnly: true
            shipping_tax:
              description: The shipping tax.
              type: string
              readOnly: true
            total:
              description: The total of everything in the cart.
              type: string
              readOnly: true
            total_tax:
              description: The total tax.
              type: string
              readOnly: true
          readOnly: true
        removed_items:
          description: Items that have been removed from the cart.
          type: array
          items:
            type: object
            properties:
              item_key:
                description: Unique ID of the item.
                type: string
                readOnly: true
              id:
                description: Product ID or Variation ID of the item.
                type: integer
                readOnly: true
              name:
                description: The name of the item.
                type: string
                readOnly: true
              title:
                description: The title of the item.
                type: string
                readOnly: true
              variation:
                description: The variation attributes of the item (if item is a variation of a variable product).
                type: object
              price:
                description: The price of the item.
                type: string
                readOnly: true
              quantity:
                description: The quantity of the item.
                type: number
                readOnly: true
              totals:
                description: The totals of the item.
                type: object
                properties:
                  subtotal:
                    description: The subtotal of the item.
                    type: number
                    readOnly: true
                  subtotal_tax:
                    description: The subtotal tax of the item.
                    type: number
                    readOnly: true
                  total:
                    description: The total of the item.
                    type: number
                    readOnly: true
                  total_tax:
                    description: The total tax of the item.
                    type: number
                    readOnly: true
                readOnly: true
              slug:
                description: The product slug of the item in the cart.
                type: string
                readOnly: true
              meta:
                description: The meta data of the item in the cart.
                type: object
                properties:
                  product_type:
                    description: The product type of the item.
                    type: string
                    readOnly: true
                  sku:
                    description: The SKU of the item.
                    type: string
                    readOnly: true
                  dimensions:
                    description: The dimensions of the item.
                    type: object
                    properties:
                      length:
                        description: The length of the item.
                        type: string
                        readOnly: true
                      width:
                        description: The width of the item.
                        type: string
                        readOnly: true
                      height:
                        description: The height of the item.
                        type: string
                        readOnly: true
                      unit:
                        description: The unit measurement of the item.
                        type: string
                        readOnly: true
                  weight:
                    description: The weight of the item.
                    type: string
                    readOnly: true
                readOnly: true
              backorders:
                description: The price of the item in the cart.
                type: string
                readOnly: true
              cart_item_data:
                description: Custom item data applied to the item (if any).
                type: object
              featured_image:
                description: The featured image of the item in the cart.
                type: string
                readOnly: true
          readOnly: true
        cross_sells:
          description: Items you may be interested in adding to the cart.
          type: array
          properties:
            id:
              description: Product ID or Variation ID of the cross-sell product.
              type: integer
              readOnly: true
            name:
              description: The name of the cross-sell product.
              type: string
              readOnly: true
            title:
              description: The title of the cross-sell product.
              type: string
              readOnly: true
            slug:
              description: The slug of the cross-sell product.
              type: string
              readOnly: true
            price:
              description: The price of the cross-sell product.
              type: string
              readOnly: true
            regular_price:
              description: The regular price of the cross-sell product.
              type: string
              readOnly: true
            sale_price:
              description: The sale price of the cross-sell product.
              type: string
              readOnly: true
            image:
              description: The image of the cross-sell product.
              type: string
              readOnly: true
            average_rating:
              description: The average rating of the cross-sell product.
              type: string
              readOnly: true
            on_sale:
              description: The sale status of the cross-sell product.
              type: boolean
              readOnly: true
            type:
              description: The product type of the cross-sell product.
              type: string
              readOnly: true
          items:
            type: object
          readOnly: true
        notices:
          description: The cart notices.
          type: object
          properties:
            success:
              description: Notices for successful actions.
              type: array
              items:
                type: string
              readOnly: true
            info:
              description: Notices for informational actions.
              type: array
              items:
                type: string
              readOnly: true
            error:
              description: Notices for error actions.
              type: array
              items:
                type: string
              readOnly: true
          additionalProperties:
            type: array
            items:
              type: string
          readOnly: true
        meta:
          description: Meta saved on the cart with `update-cart-meta`, keyed by meta key. An empty object when there is none.
          type: object
          additionalProperties: true
          readOnly: true
        extensions:
          $ref: '#/components/schemas/CartExtensions'
    CartCoupons:
      description: The coupons applied to the cart, as the cart lists them.
      type: object
      additionalProperties: false
      properties:
        coupons:
          description: Coupons added to the cart.
          type: array
          items:
            type: object
            properties:
              coupon:
                description: The coupon code.
                type: string
                readOnly: true
              label:
                description: The coupon label.
                type: string
                readOnly: true
              saving:
                description: The amount discounted from the cart.
                type: string
                readOnly: true
              saving_html:
                description: The amount discounted from the cart (HTML formatted).
                type: string
                readOnly: true
              discount_type:
                description: The coupon's discount type, e.g. "percent" or "fixed_cart".
                type: string
                readOnly: true
          readOnly: true
    CartExtensions:
      type: object
      properties:
        recurring_totals:
          description: Recurring totals for each billing schedule in the cart.
          type: array
          items:
            type: object
            properties:
              key:
                description: 'The billing schedule: WooCommerce Subscriptions'' recurring cart key, or Milo Subscriptions'' interval and period, e.g. "1_month".'
                type: string
                readOnly: true
              item_key:
                description: Key of the first cart item on this schedule.
                type: string
                readOnly: true
              coupons:
                description: Coupons applied to the recurring cart, as the cart lists its coupons (not Milo Subscriptions).
                type: array
                items:
                  type: object
                  properties:
                    coupon:
                      description: Coupon code.
                      type: string
                    label:
                      description: Coupon label.
                      type: string
                    discount_type:
                      description: Discount type, e.g. "percent".
                      type: string
                    saving:
                      description: What the coupon saves.
                      type: string
                    saving_html:
                      description: What the coupon saves, as WooCommerce shows it.
                      type: string
                readOnly: true
              shipping:
                description: Shipping of the recurring cart (not Milo Subscriptions).
                type: object
                readOnly: true
              fees:
                description: Fees of the recurring cart, keyed by fee ID (not Milo Subscriptions).
                type: object
                readOnly: true
              taxes:
                description: Taxes of the recurring cart, one line per tax or one for all, as the cart gives them (not Milo Subscriptions).
                type: array
                items:
                  type: object
                  properties:
                    key:
                      description: Tax rate code, or "total" for all taxes together.
                      type: string
                    name:
                      description: Tax label.
                      type: string
                    price:
                      description: Tax amount, in minor units, or formatted with `formatted`.
                      type: string
                readOnly: true
              totals:
                description: Recurring totals.
                type: object
                properties:
                  period:
                    description: Billing period, e.g. "/ month".
                    type: string
                    readOnly: true
                  subtotal:
                    description: Recurring subtotal, in minor units (formatted for display with `formatted=true`).
                    type: string
                    readOnly: true
                  total:
                    description: Recurring total, in minor units (formatted for display with `formatted=true`).
                    type: string
                    readOnly: true
                  label:
                    description: Recurring total as WooCommerce displays it (not Milo Subscriptions).
                    type: string
                    readOnly: true
                  first_renewal:
                    description: First renewal.
                    type: object
                    properties:
                      date:
                        description: GMT date (Y-m-d H:i:s), or 0 when there is no renewal.
                        readOnly: true
                        oneOf:
                        - type: string
                        - type: integer
                      formatted_date:
                        description: Date formatted for display.
                        type: string
                        readOnly: true
                      labelled:
                        description: First renewal, ready to display.
                        type: string
                        readOnly: true
                    readOnly: true
                readOnly: true
          readOnly: true
        points_and_rewards:
          description: Points and Rewards for the cart.
          type: object
          properties:
            points_balance:
              description: Points balance of the customer.
              type: integer
              readOnly: true
            points_to_earn:
              description: Points the cart earns.
              type: integer
              readOnly: true
            redemption_coupon:
              description: Points redemption coupon applied, or empty.
              type: string
              readOnly: true
          readOnly: true
      readOnly: true
    CartItemExtensions:
      type: object
      properties:
        event_ticket:
          description: EventKoi event ticket data (if any) for the item in the cart.
          type: object
          properties:
            ticket_name:
              description: The name of the event ticket.
              type: string
              readOnly: true
            ticket_id:
              description: The EventKoi ticket ID.
              type: integer
              readOnly: true
            event_id:
              description: The EventKoi event ID.
              type: integer
              readOnly: true
            event_title:
              description: The title of the event.
              type: string
              readOnly: true
            instance_timestamp:
              description: The event instance timestamp for recurring events.
              type: integer
              readOnly: true
          readOnly: true
        subscription_data:
          description: Subscription data (if any) for the item in the cart.
          type: object
          properties:
            billing_period:
              description: Subscription billing period.
              type: object
              properties:
                interval:
                  description: Subscription billing interval.
                  readOnly: true
                  oneOf:
                  - type: string
                  - type: integer
                period:
                  description: Subscription billing period.
                  type: string
                  readOnly: true
                length:
                  description: Subscription billing length.
                  readOnly: true
                  oneOf:
                  - type: string
                  - type: integer
                trial_period:
                  description: Subscription billing trial period.
                  type: string
                  readOnly: true
                trial_length:
                  description: Subscription billing trial length.
                  readOnly: true
                  oneOf:
                  - type: string
                  - type: integer
                trial_expiration_date:
                  description: 'When the free trial ends: GMT date (Y-m-d H:i:s) for a subscription started now, or 0 when there is no trial.'
                  readOnly: true
                  oneOf:
                  - type: string
                  - type: integer
                expiration_date:
                  description: 'When the subscription ends: GMT date (Y-m-d H:i:s) for a subscription started now, or 0 when it never expires.'
                  readOnly: true
                  oneOf:
                  - type: string
                  - type: integer
              readOnly: true
            sign_up_fee:
              description: Subscription sign up fee.
              type: string
              readOnly: true
            pay_now:
              description: Subscription amount to pay now.
              type: string
              readOnly: true
            needs_one_time_shipping:
              description: Does the subscription only require shipping once?
              type: boolean
              readOnly: true
            price_string:
              description: The price of the subscription.
              type: string
              readOnly: true
            first_renewal:
              description: The subscriptions date and time of the first renewal.
              type: object
              properties:
                date:
                  description: 'First renewal: GMT date (Y-m-d H:i:s) for a subscription started now, or 0 when there is no renewal.'
                  readOnly: true
                  oneOf:
                  - type: string
                  - type: integer
                timestamp:
                  description: First renewal timestamp.
                  type: integer
                  readOnly: true
                html:
                  description: First renewal string.
                  type: string
                  readOnly: true
              readOnly: true
          readOnly: true
        gift_recipient:
          description: Gift recipient for this subscription cart item, set with `recipient_email` on `POST /cart/add-item`.
          type: object
          properties:
            email:
              description: Email address of the gift recipient.
              type: string
              format: email
              readOnly: true
          readOnly: true
        subscription_schemes:
          description: 'Purchase options for this cart item: one-time and/or subscription plans, with the current one selected. Listed only when there is a choice.'
          type: array
          items:
            type: object
            properties:
              price:
                description: Scheme price.
                type: string
                readOnly: true
              period:
                description: Scheme billing period label.
                type: string
                readOnly: true
              value:
                description: 'Scheme key: send it as `convert_to_sub` with `namespace` `update-item-schema` and the `item_key` to `POST /cart/update` to switch the item to this option ("0" for one-time).'
                type: string
                readOnly: true
              selected:
                description: Whether this scheme is currently selected.
                type: boolean
                readOnly: true
              rest_url:
                description: Ready-made request to switch the item to this option (`POST`).
                type: string
                readOnly: true
          readOnly: true
        composite_data:
          description: Composite product configuration for the cart item.
          type: object
          properties:
            components:
              description: The configuration of each component, one entry per component.
              type: array
              items:
                type: object
                properties:
                  component_id:
                    description: Component ID, as the product's `composite_data.components` gives it in `id`.
                    type: string
                    readOnly: true
                  id:
                    description: Selected product or variation ID for this component.
                    type: integer
                    readOnly: true
                  quantity:
                    description: Quantity information for this component.
                    type: object
                    properties:
                      value:
                        description: Quantity selected for this component.
                        type: integer
                        readOnly: true
                      minimum:
                        description: Minimum quantity allowed for this component.
                        type: integer
                        readOnly: true
                      maximum:
                        description: Maximum quantity allowed for this component, or null if unlimited.
                        type: integer
                        readOnly: true
                        nullable: true
                    readOnly: true
                  variation:
                    description: Selected variation attributes for this component.
                    type: object
                    additionalProperties:
                      type: string
                    readOnly: true
                  discount:
                    description: Discount applied to this component, or null if none.
                    type: number
                    readOnly: true
                    nullable: true
                  optional:
                    description: Whether this component is optional.
                    type: boolean
                    readOnly: true
                  priced_individually:
                    description: Whether this component is priced individually.
                    type: boolean
                    readOnly: true
                  shipped_individually:
                    description: Whether this component is shipped individually.
                    type: boolean
                    readOnly: true
                  title:
                    description: Component title.
                    type: string
                    readOnly: true
              readOnly: true
            child_item_keys:
              description: Cart item keys of the composited child items.
              type: array
              items:
                type: string
              readOnly: true
          readOnly: true
        bundle_data:
          description: Bundle configuration for the cart item.
          type: object
          properties:
            items:
              description: The bundle's items as configured, one entry per bundled item.
              type: array
              items:
                type: object
                properties:
                  bundled_item_id:
                    description: 'Bundled item ID: the item in the bundle''s definition, as `child_items` gives it.'
                    type: integer
                    readOnly: true
                  id:
                    description: Selected product or variation ID.
                    type: integer
                    readOnly: true
                  quantity:
                    description: Quantity information.
                    type: object
                    properties:
                      value:
                        description: Quantity value.
                        type: integer
                        readOnly: true
                      minimum:
                        description: Minimum quantity.
                        type: integer
                        readOnly: true
                      maximum:
                        description: Maximum quantity.
                        type: integer
                        readOnly: true
                    readOnly: true
                  variation:
                    description: Selected variation attributes.
                    type: object
                    additionalProperties:
                      type: string
                    readOnly: true
                  discount:
                    description: Discount applied to this item, or null if none.
                    type: number
                    readOnly: true
                    nullable: true
                  optional_selected:
                    description: Whether the customer included this optional item.
                    type: boolean
                    readOnly: true
              readOnly: true
            child_items:
              description: Summary of bundled child items nested under this container.
              type: array
              items:
                type: object
                properties:
                  item_key:
                    description: Cart item key of the child item.
                    type: string
                    readOnly: true
                  bundled_item_id:
                    description: Internal bundle definition ID for this child.
                    type: integer
                    readOnly: true
                  id:
                    description: Product or variation ID.
                    type: integer
                    readOnly: true
                  name:
                    description: Product name.
                    type: string
                    readOnly: true
                  quantity:
                    description: Quantity information.
                    type: object
                    properties:
                      value:
                        description: Quantity value.
                        type: integer
                        readOnly: true
                      minimum:
                        description: Minimum quantity.
                        type: integer
                        readOnly: true
                      maximum:
                        description: Maximum quantity.
                        type: integer
                        readOnly: true
                    readOnly: true
                  price:
                    description: Unit price in the smallest currency unit.
                    type: string
                    readOnly: true
                  variation:
                    description: Selected variation attributes.
                    type: object
                    additionalProperties:
                      type: string
                    readOnly: true
              readOnly: true
            child_item_keys:
              description: Cart item keys of the bundled child items.
              type: array
              items:
                type: string
              readOnly: true
          readOnly: true
        accommodation_booking_data:
          description: Accommodation booking check-in and check-out information for the cart item.
          type: object
          properties:
            check_in:
              description: Check-in date and time.
              type: string
              readOnly: true
            check_out:
              description: Check-out date and time.
              type: string
              readOnly: true
          readOnly: true
        booking_data:
          description: Booking configuration for the cart item.
          type: object
          properties:
            start_date:
              description: Booking start date and time.
              type: string
              readOnly: true
            end_date:
              description: Booking end date and time.
              type: string
              readOnly: true
            all_day:
              description: Whether the booking spans the full day.
              type: boolean
              readOnly: true
            resource_id:
              description: Resource ID assigned to the booking.
              type: integer
              readOnly: true
            persons:
              description: Person counts per type for the booking.
              type: array
              items:
                type: integer
              readOnly: true
            cost:
              description: Calculated booking cost in the smallest currency unit.
              type: string
              readOnly: true
          readOnly: true
        discount:
          description: Discount applied to this cart item by Advanced Dynamic Pricing.
          type: object
          properties:
            original_price:
              description: Original per-unit price before discount.
              type: string
              readOnly: true
            saved_amount:
              description: Amount saved on this line by the matched rule(s).
              type: string
              readOnly: true
            is_free_item:
              description: Whether this item was added free by a Buy X Get Y rule.
              type: boolean
              readOnly: true
            rules:
              description: Names of the pricing rules that matched this cart item.
              type: array
              items:
                type: string
              readOnly: true
          readOnly: true
        addons:
          description: Add-on selections made by the customer for this cart item.
          type: array
          items:
            type: object
            properties:
              field_label:
                description: The add-on field label.
                type: string
                readOnly: true
              field_type:
                description: The add-on field type (e.g. custom_text, multiple_choice, file_upload).
                type: string
                readOnly: true
              value:
                description: The selected or entered value, pre-formatted for display.
                type: string
                readOnly: true
              price:
                description: Price contribution of this selection. For percentage_based, the percentage of the product price, e.g. "10" for 10%, not an amount.
                type: string
                readOnly: true
              price_type:
                description: 'Price type: flat_fee, quantity_based, or percentage_based.'
                type: string
                readOnly: true
          readOnly: true
        warranty:
          description: Warranty selected for this cart item.
          type: object
          properties:
            label:
              description: Warranty label.
              type: string
              readOnly: true
            type:
              description: 'Warranty type: included or addon.'
              type: string
              readOnly: true
            duration:
              description: Human-readable warranty duration.
              type: string
              readOnly: true
            cost:
              description: Additional cost for this warranty.
              type: string
              readOnly: true
          readOnly: true
    ErrorResponse:
      type: object
      description: 'An error: nothing was changed. The shape is WordPress''s.'
      required:
      - code
      - message
      - data
      properties:
        code:
          type: string
          description: 'A stable code to branch on: `cocart_` and snake case, or WordPress''s own `rest_` codes for arguments it refuses.'
        message:
          type: string
          description: For the customer, as plain text.
        data:
          type: object
          required:
          - status
          additionalProperties: true
          properties:
            status:
              type: integer
              description: The HTTP status.
            field:
              type: string
              description: The first field at fault, as a path such as `billing.postcode`.
            fields:
              type: object
              additionalProperties:
                type: string
              description: Every field at fault, by path, with its message.
            reason:
              type: string
              description: The underlying plugin's own reason, when there is one.
    MiniCart:
      description: A part of the cart, with the cart's paths.
      type: object
      properties:
        cart_hash:
          description: A unique hash key of the cart contents.
          type: string
          readOnly: true
          nullable: true
        cart_key:
          description: The cart key identifying the cart in session.
          type: string
          readOnly: true
        currency:
          description: The store currency information.
          type: object
          properties:
            currency_code:
              description: The currency code (in ISO format) for returned prices.
              type: string
              readOnly: true
            currency_symbol:
              description: The currency symbol for the currency which can be used to format returned prices.
              type: string
              readOnly: true
            currency_symbol_pos:
              description: The currency symbol position to which the currency needs to return for the prices.
              type: string
              readOnly: true
            currency_minor_unit:
              description: The currency minor unit (number of digits after the decimal separator) for returned prices.
              type: integer
              readOnly: true
            currency_decimal_separator:
              description: The decimal separator for the currency which can be used to format returned prices.
              type: string
              readOnly: true
            currency_thousand_separator:
              description: The thousand separator for the currency which can be used to format returned prices.
              type: string
              readOnly: true
            currency_prefix:
              description: The price prefix for the currency which can be used to format returned prices.
              type: string
              readOnly: true
            currency_suffix:
              description: The price prefix for the currency which can be used to format returned prices.
              type: string
              readOnly: true
          readOnly: true
        item_count:
          description: The number of items in the cart.
          type: integer
          readOnly: true
        items:
          description: The items in the cart.
          type: array
          items:
            type: object
            properties:
              item_key:
                description: Unique identifier for the item within the cart.
                type: string
                readOnly: true
              id:
                description: Product ID.
                type: integer
                readOnly: true
              name:
                description: Product name.
                type: string
                readOnly: true
              price:
                description: Product price.
                readOnly: true
                oneOf:
                - type: string
                - type: object
              quantity:
                description: Quantity of the item in the cart, as the cart gives it.
                type: object
                properties:
                  value:
                    description: Quantity.
                    type: number
                    readOnly: true
                readOnly: true
              variation:
                description: Variation attributes for the item, keyed by attribute.
                type: object
                readOnly: true
              cart_item_data:
                description: Additional cart item data, keyed as the plugin that added it keys it.
                type: object
                additionalProperties: true
                readOnly: true
              featured_image:
                description: Product featured image URL.
                type: string
                format: uri
                readOnly: true
          readOnly: true
        totals:
          description: 'The cart''s totals, as the cart gives them: only the subtotal.'
          type: object
          properties:
            subtotal:
              description: The cart subtotal.
              type: string
              readOnly: true
          readOnly: true
        notices:
          description: Notices for the customer, keyed by type, as the cart gives them.
          type: object
          readOnly: true
security:
- {}
- basicAuth: []
- bearerAuth: []
