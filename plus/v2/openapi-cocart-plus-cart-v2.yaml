                    billing_country: FR
                    billing_address_1: 123 Test Street
                    billing_address_2: ''
                    billing_postcode: '75001'
                    billing_city: Paris
                    billing_state: ''
                    billing_phone: 0123456789
                    billing_email: jane.doe@example.com
                  shipping_address:
                    shipping_first_name: Jane
                    shipping_last_name: Doe
                    shipping_company: ''
                    shipping_country: FR
                    shipping_address_1: 123 Test Street
                    shipping_address_2: ''
                    shipping_postcode: '75001'
                    shipping_city: Paris
                    shipping_state: ''
                    shipping_phone: 0123456789
                items:
                - item_key: 69d1fc78dbda242c43ad6590368912d4
                  id: 1865
                  name: Test Product
                  title: Test Product
                  variation: {}
                  price: '1000'
                  regular_price: ''
                  on_sale: false
                  quantity:
                    value: 1
                    minimum: 1
                    maximum: 9999
                    multiple_of: 1
                    editable: true
                  totals:
                    subtotal: '1000'
                    subtotal_tax: '0'
                    total: '500'
                    tax: '0'
                  slug: test-product
                  meta:
                    product_type: simple
                    sku: ''
                    dimensions:
                      length: ''
                      width: ''
                      height: ''
                      unit: in
                    weight: '0.0'
                  backorders: ''
                  cart_item_data: {}
                  featured_image: ''
                  extensions: {}
                item_count: 1
