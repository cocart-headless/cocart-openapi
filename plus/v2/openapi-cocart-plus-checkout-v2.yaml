components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        Basic authentication with username and password.

        Since CoCart v4.9.0, if an `X-HTTP-Method-Override` header is present, it is honored
        when determining the request method during authentication (e.g. credentials sent in a
        JSON body are still detected when the original method is tunneled through POST).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer token authentication (JWT). Optional for cart and checkout endpoints.
        When provided by customers, enables enhanced functionality like persistent carts and user-specific data.
  schemas:
    AddressDetails:
      description: An address, in parts and on one line.
      type: object
      properties:
        address:
          description: Complete address details.
          type: object
          properties:
            address_1:
              description: Street address line 1.
              type: string
            address_2:
              description: Street address line 2.
              type: string
            city:
              description: City.
              type: string
            state:
              description: State/Province.
              type: string
            postcode:
              description: Postal/ZIP code.
              type: string
            country:
              description: ISO country code.
              type: string
            formatted:
              description: The address on one line, for display.
              type: string
        provider:
          description: Provider information.
          type: object
          properties:
            id:
              type: string
            name:
              type: string
    AddressSearch:
      description: Addresses matching a search.
      type: object
      properties:
        suggestions:
          description: Array of address suggestions.
          type: array
          items:
            type: object
            properties:
              id:
                description: Unique identifier for the address.
                type: string
              label:
                description: Display label for the address.
                type: string
              matched_substrings:
                description: Matched text ranges for highlighting.
                type: array
                items:
                  type: object
                  properties:
                    offset:
                      type: integer
                    length:
                      type: integer
        query:
          description: The text searched for.
          type: string
        provider:
          description: Provider information.
          type: object
          properties:
            id:
              type: string
            name:
              type: string
        search_country:
          description: Country used for search.
          type: string
    Checkout:
      description: The checkout, like a receipt.
      type: object
      properties:
        object:
          description: 'The kind of document: "checkout".'
          type: string
          enum:
          - checkout
          readOnly: true
        result:
          description: What the request did. Only in responses to requests that change something.
          type: object
          properties:
            code:
              description: Result code to branch on, not translated.
              type: string
              enum:
              - checkout_updated
              - checkout_partly_updated
              readOnly: true
            message:
              description: Message for the customer.
              type: string
              readOnly: true
            not_applied:
              description: With checkout_partly_updated, what the request asked for that wasn't applied, and why. The rest was applied.
              type: array
              items:
                type: object
                properties:
                  field:
                    description: The request parameter that wasn't applied.
                    type: string
                    enum:
                    - coupon_code
                    - payment_method
                    - shipping_method
                    readOnly: true
                  code:
                    description: Why, as the error code the request alone would have given.
                    type: string
                    readOnly: true
                  message:
                    description: Why, for the customer.
                    type: string
                    readOnly: true
              readOnly: true
          readOnly: true
        cart_key:
          description: Unique identifier for the cart session.
          type: string
          readOnly: true
        cart_hash:
          description: Hash of the cart contents.
          type: string
          readOnly: true
        currency:
          description: The checkout currency.
          type: object
          properties:
            currency_code:
              description: Currency code.
              type: string
              readOnly: true
            currency_symbol:
