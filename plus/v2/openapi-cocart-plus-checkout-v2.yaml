    post:
      tags:
      - checkout
      summary: Place the order
      description: 'Places the order and takes payment. Returns the order, with what the payment did in `result`: `order_placed`, `action_required` (e.g. 3D Secure, with what to confirm in `action`), `payment_pending` or `payment_failed` (with the reason in `result.error`; a declined card is not an error). A refused request changes nothing, except `409 cocart_checkout_total_mismatch`, which keeps the address sent so `GET /checkout` can show the new total. Send a random `checkout_id` to find out later how the checkout ended with `GET /checkout/status`. Only one request at a time can take payment for a cart; another is `409 cocart_payment_in_progress`.'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                billing_address:
                  description: Billing address data. Optional when PUT /checkout already saved it.
                  type: object
                  additionalProperties: true
                shipping_address:
                  description: Shipping address data.
                  type: object
                  additionalProperties: true
                use_different_billing:
                  description: Whether to use a different billing address. If false, billing address will be copied from shipping address.
                  type: boolean
                  default: true
                payment_method:
                  description: Payment method ID. Optional when PUT /checkout already saved it. Required when the cart needs paying for.
                  type: string
                shipping_method:
                  description: Shipping method ID.
                  type: string
                currency:
                  description: Currency code for the order (e.g., USD, EUR, GBP). If not provided, the store default currency will be used.
                  type: string
                payment_data:
                  description: Data to pass through to the payment method.
                  type: array
                  items:
                    type: object
                    properties:
                      key:
                        type: string
                      value:
                        oneOf:
                        - type: string
                        - type: boolean
                        - type: integer
                create_account:
                  description: Whether to create a customer account (for guest checkout).
                  type: boolean
                  default: false
                customer_password:
                  description: Password for new customer account.
                  type: string
                customer_note:
                  description: Order notes from customer.
                  type: string
                checkout_id:
                  description: A random ID the client makes for this checkout, so it can ask GET /checkout/status how it ended if the response is lost.
                  type: string
                  pattern: ^[A-Za-z0-9_-]{16,64}$
                formatted:
                  description: True if you want to return the price values formatted.
                  default: false
                  type: boolean
                meta_keys:
                  description: Only these keys in each `meta`, e.g. meta_keys=gift_message,_configuration. Narrows the keys the store allows; it can never add one. Default every allowed key.
                  type: array
                  items:
                    type: string
