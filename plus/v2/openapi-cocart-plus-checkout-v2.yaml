              format: date-time
              readOnly: true
            label:
              description: The date in the site's date and time format, for display.
              type: string
              readOnly: true
          readOnly: true
          nullable: true
        currency:
          description: The order's currency. Every amount in the order is in it.
          type: object
          properties:
            currency_code:
              description: Currency code.
              type: string
              readOnly: true
            currency_symbol:
              description: Currency symbol.
              type: string
              readOnly: true
            currency_symbol_pos:
              description: The currency symbol position to which the currency needs to return for the prices.
              type: string
              readOnly: true
            currency_minor_unit:
              description: Currency minor unit.
              type: integer
              readOnly: true
            currency_decimal_separator:
              description: Currency decimal separator.
              type: string
              readOnly: true
            currency_thousand_separator:
              description: Currency thousand separator.
              type: string
              readOnly: true
            currency_prefix:
              description: Currency prefix.
              type: string
              readOnly: true
            currency_suffix:
              description: Currency suffix.
              type: string
              readOnly: true
          readOnly: true
        item_count:
          description: Number of items, less the ones refunded.
          type: integer
          readOnly: true
        items:
          description: The order's lines. Amounts exclude tax, with the tax beside them.
          type: array
          items:
            type: object
            properties:
              id:
                description: Order item ID.
                type: integer
                readOnly: true
              name:
                description: Name, as it was ordered.
                type: string
                readOnly: true
              quantity:
                description: Quantity ordered.
                type: integer
                readOnly: true
              price:
                description: Price of one, before discounts, excluding tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
                type: string
                readOnly: true
              totals:
                description: The line's totals.
                type: object
                properties:
                  subtotal:
                    description: Line subtotal, before discounts, excluding tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
                    type: string
                    readOnly: true
                  subtotal_tax:
                    description: Tax on the line subtotal. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
                    type: string
                    readOnly: true
                  total:
                    description: Line total, after discounts, excluding tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
                    type: string
                    readOnly: true
                  tax:
                    description: Tax on the line total. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
                    type: string
                    readOnly: true
                readOnly: true
              refunded_quantity:
                description: Quantity refunded.
                type: integer
                readOnly: true
              sku:
                description: Product SKU.
                type: string
                readOnly: true
              details:
                description: What to print under the item, e.g. its size or an engraving, in order. An empty list when there is none.
                type: array
