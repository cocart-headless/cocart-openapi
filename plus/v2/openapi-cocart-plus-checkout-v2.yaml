                  readOnly: true
                points_redeemed:
                  description: Number of points the customer redeemed as a discount on this order.
                  type: integer
                  readOnly: true
              readOnly: true
            subscription_schemes:
              description: The subscription plan each order line was bought on, with All Products for Subscriptions. Left out when no line was bought on a plan.
              type: array
              items:
                type: object
                properties:
                  item_id:
                    description: Order line item ID.
                    type: integer
                    readOnly: true
                  product_id:
                    description: Product ID for the line item.
                    type: integer
                    readOnly: true
                  scheme_key:
                    description: The subscription scheme key active at the time of purchase.
                    type: string
                    readOnly: true
              readOnly: true
            shipment_tracking:
              description: List of shipment tracking entries for the order.
              type: array
              items:
                type: object
                properties:
                  tracking_id:
                    description: Unique tracking entry identifier.
                    type: string
                    readOnly: true
                  tracking_provider:
                    description: Shipping provider display name.
                    type: string
                    readOnly: true
                  tracking_number:
                    description: Shipment tracking number.
                    type: string
                    readOnly: true
                  tracking_link:
                    description: URL to track the shipment on the carrier website.
                    type: string
                    format: uri
                    readOnly: true
                  date_shipped:
                    description: Date the order was shipped.
                    type: string
                    readOnly: true
              readOnly: true
            shipping_labels:
              description: List of purchased shipping labels for the order.
              type: array
              items:
                type: object
                properties:
                  label_id:
                    description: Unique label identifier from the shipping carrier API.
                    type: string
                    readOnly: true
                  carrier:
                    description: Carrier identifier (e.g. usps, fedex, ups).
                    type: string
                    readOnly: true
                  service_name:
                    description: Human-readable shipping service name.
                    type: string
                    readOnly: true
                  tracking_number:
                    description: Shipment tracking number.
                    type: string
                    readOnly: true
                  tracking_url:
                    description: URL to track the shipment on the carrier website.
                    type: string
                    format: uri
                    readOnly: true
                  status:
                    description: Label purchase status.
                    type: string
                    readOnly: true
                  created_date:
                    description: Date the label was purchased.
                    type: string
                    readOnly: true
                  is_return:
                    description: Whether this label is for a return shipment.
                    type: boolean
                    readOnly: true
                  is_refunded:
                    description: Whether this label has been refunded.
                    type: boolean
                    readOnly: true
                  package_name:
                    description: Name of the package type used for this label.
                    type: string
                    readOnly: true
                  product_names:
                    description: Names of the products included in this shipment.
                    type: array
                    items:
                      type: string
                    readOnly: true
              readOnly: true
          readOnly: true
    OrderPayment:
      description: An order, with what taking payment did in `result` and the payment details in `payment`.
      type: object
      properties:
        object:
          description: 'The kind of document: "order".'
          type: string
          enum:
          - order
          readOnly: true
        result:
          description: What the request did. Only in responses to requests that change something.
          type: object
          properties:
            code:
              description: Result code to branch on, not translated.
              type: string
              enum:
              - order_placed
              - action_required
              - payment_pending
              - payment_failed
              readOnly: true
            message:
              description: Message for the customer.
              type: string
              readOnly: true
            action:
              description: What the customer must do to finish the payment, e.g. confirm it with 3D Secure. Null when there is nothing to do.
              type: object
              properties:
                type:
                  description: Action type, set by the gateway integration, e.g. stripe_confirm_payment or gateway_redirect_required.
                  type: string
                  readOnly: true
                data:
                  description: What the action needs, set by the gateway integration, e.g. `redirect` or `client_secret`.
                  type: object
                  additionalProperties: true
                  readOnly: true
              readOnly: true
              nullable: true
            redirect_url:
              description: Where to send the customer once the payment is done, e.g. the order-received page. Null when there is none.
              type: string
              format: uri
              readOnly: true
              nullable: true
            error:
              description: Why the payment failed. Null unless the code is payment_failed.
              type: object
              properties:
                code:
                  description: Stable reason, e.g. card_declined or insufficient_funds.
                  type: string
                  readOnly: true
                gateway_code:
                  description: The gateway's own code. Null when the gateway gave none.
                  type: string
                  readOnly: true
                  nullable: true
                gateway_message:
                  description: The gateway's own message. Null when the gateway gave none.
                  type: string
                  readOnly: true
                  nullable: true
              readOnly: true
              nullable: true
          readOnly: true
        id:
          description: Order ID.
          type: integer
          readOnly: true
        number:
          description: Order number, for display. Can differ from the ID.
          type: string
          readOnly: true
        key:
          description: Order key, needed to view or pay for the order as a guest. Null for a guest who looked the order up by email.
          type: string
          readOnly: true
          nullable: true
        status:
          description: Order status.
          type: object
          properties:
            code:
              description: Status code, not translated and without the "wc-" prefix, e.g. on-hold. Use this in code.
              type: string
              readOnly: true
            label:
              description: Status label, translated, for display.
              type: string
              readOnly: true
          readOnly: true
        date_created:
          description: When the order was placed. Null when there is none.
          type: object
          properties:
            iso:
              description: The date in ISO 8601 format, with the site's UTC offset.
              type: string
              format: date-time
              readOnly: true
            label:
              description: The date in the site's date and time format, for display.
              type: string
              readOnly: true
          readOnly: true
          nullable: true
        currency:
          description: The order's currency. Every amount in the order is in it.
          type: object
          properties:
            currency_code:
              description: Currency code.
              type: string
              readOnly: true
            currency_symbol:
              description: Currency symbol.
              type: string
              readOnly: true
            currency_symbol_pos:
              description: The currency symbol position to which the currency needs to return for the prices.
              type: string
              readOnly: true
            currency_minor_unit:
              description: Currency minor unit.
              type: integer
              readOnly: true
            currency_decimal_separator:
              description: Currency decimal separator.
              type: string
              readOnly: true
            currency_thousand_separator:
              description: Currency thousand separator.
              type: string
              readOnly: true
            currency_prefix:
              description: Currency prefix.
              type: string
              readOnly: true
            currency_suffix:
              description: Currency suffix.
              type: string
              readOnly: true
          readOnly: true
        item_count:
          description: Number of items, less the ones refunded.
          type: integer
          readOnly: true
        items:
          description: The order's lines. Amounts exclude tax, with the tax beside them.
          type: array
          items:
            type: object
            properties:
              id:
                description: Order item ID.
                type: integer
                readOnly: true
              name:
                description: Name, as it was ordered.
                type: string
                readOnly: true
              quantity:
                description: Quantity ordered.
                type: integer
                readOnly: true
              price:
                description: Price of one, before discounts, excluding tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
                type: string
                readOnly: true
              totals:
                description: The line's totals.
                type: object
                properties:
                  subtotal:
                    description: Line subtotal, before discounts, excluding tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
                    type: string
                    readOnly: true
                  subtotal_tax:
                    description: Tax on the line subtotal. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
                    type: string
                    readOnly: true
                  total:
                    description: Line total, after discounts, excluding tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
                    type: string
                    readOnly: true
                  tax:
                    description: Tax on the line total. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
                    type: string
                    readOnly: true
                readOnly: true
              refunded_quantity:
                description: Quantity refunded.
                type: integer
                readOnly: true
              sku:
                description: Product SKU.
                type: string
                readOnly: true
              details:
                description: What to print under the item, e.g. its size or an engraving, in order. An empty list when there is none.
                type: array
                items:
                  type: object
                  properties:
                    label:
                      description: Label for display, e.g. "Size".
                      type: string
                      readOnly: true
                    value:
                      description: Value for display, e.g. "L".
                      type: string
                      readOnly: true
                readOnly: true
              meta:
                description: The item's raw meta the store allows (`cocart_order_items_allowed_meta_keys`), keyed by meta key, for code. Show `details` to the customer. Keyed by meta key, with the first value of each as stored. Only keys the store allows, narrowed by `meta_keys`. An empty object when there are none.
                type: object
                additionalProperties: true
                readOnly: true
              purchase_note:
                description: Purchase note, as plain text, once the order is processing or completed.
                type: string
                readOnly: true
              product:
                description: The product the line is for. Null for a line that isn't for a product, such as a fee.
                type: object
                properties:
                  id:
                    description: Product ID.
                    type: integer
                    readOnly: true
                  variation_id:
                    description: Variation ID, or 0.
                    type: integer
                    readOnly: true
                  type:
                    description: Product type. Empty when the product no longer exists.
                    type: string
                    readOnly: true
                  exists:
                    description: False when the product or variation has since been deleted.
                    type: boolean
                    readOnly: true
                  image:
                    description: Product image URL, or empty.
                    type: string
                    readOnly: true
                  href:
                    description: Product route URL. Null when the product no longer exists.
                    type: string
                    format: uri
                    readOnly: true
                    nullable: true
                readOnly: true
                nullable: true
          readOnly: true
        totals:
          description: The order's totals, with the cart's keys.
          type: object
          properties:
            subtotal:
              description: Subtotal, before discounts, excluding tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
            subtotal_tax:
              description: Tax on the subtotal. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
            discount_total:
              description: Discounts, excluding tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
            discount_tax:
              description: Tax on the discounts. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
            shipping_total:
              description: Shipping, excluding tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
            shipping_tax:
              description: Tax on shipping. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
            fee_total:
              description: Fees, excluding tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
            fee_tax:
              description: Tax on fees. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
            total_tax:
              description: Total tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
            total:
              description: 'Order total: subtotal - discount_total + shipping_total + fee_total + total_tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.'
              type: string
              readOnly: true
            refunded_total:
              description: Total refunded. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
          readOnly: true
        total_lines:
          description: The totals as a receipt prints them, in order. The lines before the total add up to it; refunds follow it.
          type: array
          items:
            type: object
            properties:
              key:
                description: 'What the line is: subtotal, discount, shipping, fee, tax, total, refund, or a key a plugin adds.'
                type: string
                readOnly: true
              label:
                description: Label for display.
                type: string
                readOnly: true
              amount:
                description: 'Amount, signed as printed: a discount or refund is negative. In minor units, e.g. "4999", or formatted for display with `formatted=true`.'
