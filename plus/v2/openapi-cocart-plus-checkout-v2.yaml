  /address/search:
    get:
      tags:
      - addresses
      summary: Search addresses
      description: Finds addresses matching what the customer typed, through the store's address provider. Returns the `suggestions`, the `query`, the `provider` and the `search_country`. Without a provider it is `404 cocart_address_search_no_provider`.
      parameters:
      - name: query
        in: query
        required: true
        description: Address search query (minimum 3 characters).
        schema:
          type: string
      - name: country
        in: query
        required: false
        description: ISO country code. If not provided, uses customer or store default.
        schema:
          type: string
      - name: type
        in: query
        required: false
        description: 'Address type: billing or shipping.'
        schema:
          type: string
          default: billing
          enum:
          - billing
          - shipping
      - name: provider
        in: query
        required: false
        description: Specific provider ID to use (optional).
        schema:
          type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressSearch'
              example:
                suggestions:
                - id: addr_1
                  label: 10 Downing Street, London
                  matched_substrings: []
                query: 10 Down
                provider:
                  id: stand_in
                  name: Stand-in
                search_country: GB
        '400':
          description: 'Bad request: `cocart_address_search_country_not_supported`, `cocart_address_search_invalid_query`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cocart_address_search_country_not_supported:
                  summary: cocart_address_search_country_not_supported
                  value:
                    code: cocart_address_search_country_not_supported
                    message: 'Address search not supported for country: …'
                    data:
                      status: 400
                cocart_address_search_invalid_query:
                  summary: cocart_address_search_invalid_query
                  value:
                    code: cocart_address_search_invalid_query
                    message: Query must be at least 3 characters.
                    data:
                      status: 400
        '404':
          description: 'Not found: `cocart_address_search_no_provider`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cocart_address_search_no_provider:
                  summary: cocart_address_search_no_provider
                  value:
                    code: cocart_address_search_no_provider
                    message: No address provider available.
                    data:
                      status: 404
        '500':
          description: 'Server error: `cocart_address_search_error`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cocart_address_search_error:
                  summary: cocart_address_search_error
                  value:
                    code: cocart_address_search_error
                    message: The address search failed. Please try again or enter the address yourself.
                    data:
                      status: 500
  /address/details:
    get:
      tags:
      - addresses
      summary: Get an address
      description: Gives the address a suggestion from `GET /address/search` stands for, in parts, with the address on one line in `formatted`.
      parameters:
      - name: address_id
        in: query
        required: true
        description: Address ID from search results.
        schema:
          type: string
      - name: provider
        in: query
        required: true
        description: Provider ID that returned this address.
        schema:
          type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressDetails'
              example:
                address:
                  address_1: 10 Downing Street
                  address_2: ''
                  city: London
                  state: ''
                  postcode: SW1A 2AA
                  country: GB
                  formatted: 10 Downing Street, London, SW1A 2AA, United Kingdom (UK)
                provider:
                  id: stand_in
                  name: Stand-in
        '400':
          description: 'Bad request: `cocart_address_details_missing_id`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cocart_address_details_missing_id:
                  summary: cocart_address_details_missing_id
                  value:
                    code: cocart_address_details_missing_id
                    message: Address ID is required.
                    data:
                      status: 400
        '404':
          description: 'Not found: `cocart_address_details_no_provider`, `cocart_address_details_not_found`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cocart_address_details_no_provider:
                  summary: cocart_address_details_no_provider
                  value:
                    code: cocart_address_details_no_provider
                    message: No address provider available.
                    data:
                      status: 404
                cocart_address_details_not_found:
                  summary: cocart_address_details_not_found
                  value:
                    code: cocart_address_details_not_found
                    message: Address not found.
                    data:
                      status: 404
        '500':
          description: 'Server error: `cocart_address_details_error`, `cocart_address_details_invalid`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cocart_address_details_error:
                  summary: cocart_address_details_error
                  value:
                    code: cocart_address_details_error
                    message: The address could not be loaded. Please try again or enter the address yourself.
                    data:
                      status: 500
                cocart_address_details_invalid:
                  summary: cocart_address_details_invalid
                  value:
                    code: cocart_address_details_invalid
                    message: 'Invalid address: missing …'
                    data:
                      status: 500
  /checkout:
    get:
      tags:
      - checkout
      summary: Get the checkout
      description: 'The checkout as it stands, like a receipt: the items, coupons, fees, `totals` and `total_lines`, the payment method chosen, the customer''s addresses, and each shipping package with its rates and the one chosen. Signed out, a guest''s cart key is needed.'
      parameters:
      - name: currency
        in: query
        required: false
        description: Currency code for the order (e.g., USD, EUR, GBP). If not provided, the store default currency will be used.
        schema:
          type: string
      - name: formatted
        in: query
        required: false
        description: True if you want to return the price values formatted.
        schema:
          default: false
          type: boolean
      - name: thumb
        in: query
        required: false
        description: Hide the URLs for each item in the cart for the featured product image if set to false.
        schema:
          default: true
          type: boolean
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
              example:
