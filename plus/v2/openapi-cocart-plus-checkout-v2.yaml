    put:
      tags:
      - checkout
      summary: Update the checkout
      description: Saves addresses, the shipping method, the payment method, a coupon or the currency, then returns the checkout with what it did first in `result`. Both addresses are checked before either is saved, and every field at fault is reported at once in `data.fields`. What couldn't be applied is listed in `result.not_applied` (`checkout_partly_updated`); when nothing could be, it is an error and nothing changes.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                billing_address:
                  description: Billing address data.
                  type: object
                  additionalProperties: true
                shipping_address:
                  description: Shipping address data.
                  type: object
                  additionalProperties: true
                use_different_billing:
                  description: Whether to use a different billing address. If false, billing address will be copied from shipping address.
                  type: boolean
                  default: true
                payment_method:
                  description: Payment method ID.
                  type: string
                shipping_method:
                  description: Shipping method ID.
                  type: string
                currency:
                  description: Currency code for the order (e.g., USD, EUR, GBP). If not provided, the store default currency will be used.
                  type: string
                coupon_code:
                  description: Coupon code to apply to the cart, or to remove with `coupon_action`.
                  type: string
                coupon_action:
                  description: Whether to apply or remove `coupon_code`.
                  type: string
                  enum:
                  - apply
                  - remove
                  default: apply
                formatted:
                  description: True if you want to return the price values formatted.
                  default: false
                  type: boolean
                thumb:
                  description: Hide the URLs for each item in the cart for the featured product image if set to false.
                  default: true
                  type: boolean
