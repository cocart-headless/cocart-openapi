        '400':
          description: 'Bad request: `cocart_order_withdrawal_email_mismatch`, `cocart_order_withdrawal_invalid_email`, `cocart_order_withdrawal_invalid_type`, `cocart_order_withdrawal_missing_additional_details`, `cocart_order_withdrawal_missing_email_confirmation`, `cocart_order_withdrawal_missing_first_name`, `cocart_order_withdrawal_missing_last_name`, `cocart_order_withdrawal_missing_order_number`.'
