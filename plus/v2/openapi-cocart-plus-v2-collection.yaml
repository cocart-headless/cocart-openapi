      properties:
        object:
          description: 'The kind of document: "customer".'
          type: string
          enum:
          - customer
          readOnly: true
        result:
          description: What the request did. Only in responses to requests that change something.
          type: object
          properties:
            code:
              description: Result code to branch on, not translated.
              type: string
              readOnly: true
            message:
              description: Message for the customer.
