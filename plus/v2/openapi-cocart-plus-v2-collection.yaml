          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cocart_invalid_or_expired_key:
                  summary: cocart_invalid_or_expired_key
                  value:
                    code: cocart_invalid_or_expired_key
                    message: This confirmation link is invalid or has expired.
                    data:
                      status: 400
        '401':
          description: 'Not signed in: `cocart_rest_authentication_required`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cocart_rest_authentication_required:
                  summary: cocart_rest_authentication_required
                  value:
                    code: cocart_rest_authentication_required
                    message: You need to be logged in to view your account.
                    data:
                      status: 401
        '403':
          description: 'Not allowed: `cocart_verification_other_account`.'
          content:
