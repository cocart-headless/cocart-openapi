  /cart/coupons/validate:
    get:
      tags:
      - coupons
      summary: Validate applied coupons
      description: Checks every applied coupon again, as WooCommerce would at checkout, and removes those no longer valid. Returns the cart, as `GET /cart` gives it, with what happened in `notices`. With no coupon applied, a notice says so.
