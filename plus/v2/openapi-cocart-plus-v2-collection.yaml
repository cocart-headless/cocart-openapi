openapi: 3.0.3
info:
  title: CoCart Plus - API v2
  version: 2.0.0
  description: |
    CoCart Plus extends the CoCart REST API v2 with additional cart endpoints (mini cart,
    coupons, fees, removing all items, setting shipping methods), product shipping rate
    calculation, customer account endpoints (including orders and subscriptions),
    customer registration, a public order withdrawal request endpoint and batch
    requests.

    Requires CoCart Starter v5.0+ to be installed and active.

    When the geolocation feature is enabled, responses include `Country`,
    `Country-Code`, `Region` and `Timezone` headers.
    When rate limiting is enabled, responses include `RateLimit-Limit`,
    `RateLimit-Remaining` and `RateLimit-Reset` headers (plus `RateLimit-Retry-After`
    on 429 responses). They are listed in `Access-Control-Expose-Headers`, so a frontend on another origin can read them.

    Cart, my account and order withdrawal responses belong to one cart, customer or order, so they are kept out of shared caches (CDNs, a host's nginx
    microcache): `Cache-Control: no-cache, no-store, must-revalidate, max-age=0,
    private`, `Pragma: no-cache`, `X-Accel-Expires: 0` (consumed by nginx) and
    `Vary: Cart-Key, CoCart-API-Cart-Key, Authorization`.

    **Choices sent on CoCart Starter routes**

    Some extension data describes a choice the customer makes. The choice is sent to
    CoCart Starter's cart routes, which aren't part of this spec:

    - Subscription plans (`subscription_schemes`): send the option's `value` as
      `convert_to_sub` to `POST /cart/add-item` (`"0"` for one-time; without it
      the default option applies). To switch a cart item, send `namespace`
      `update-item-schema`, the `item_key` and `convert_to_sub` to
      `POST /cart/update`. Each option's `rest_url` is that request, ready-made.
    - Gifting (WooCommerce Subscriptions gifting): send `recipient_email` to
      `POST /cart/add-item`.
    - WooCommerce Warranty: send the option's `key` (or its index) as
      `item_data[warranty]` to `POST /cart/add-item`.
  termsOfService: https://cocartapi.com/terms-of-conditions-polar/
  contact:
    email: support@cocartapi.com
  license:
    name: GNU General Public License v3.0
    url: http://www.gnu.org/licenses/gpl-3.0.html
externalDocs:
  description: Find out more about CoCart API
  url: https://docs.cocartapi.com
servers:
- url: '{protocol}://{host}/wp-json/cocart/v2'
  description: API v2
  variables:
    protocol:
      enum:
      - http
      - https
      default: https
    host:
      default: example-store.com
      description: Your store domain
tags:
- name: mini-cart
  description: Operations for a lightweight mini cart response
- name: coupons
  description: Operations for managing coupons applied to the cart
- name: fees
  description: Operations for managing cart fees
- name: cart-items
  description: Operations for managing cart items
- name: shipping
  description: Operations for managing shipping on the cart
- name: products
  description: Operations for product shipping calculations
- name: my-account
  description: Operations for the customer account dashboard, downloads, orders and subscriptions
- name: customers
  description: Operations for registering customers
- name: orders
  description: Operations for submitting order withdrawal requests
- name: batch
  description: Several requests in one.
paths:
  /cart/mini:
    get:
      tags:
      - mini-cart
      summary: Get the mini cart
      description: 'A part of the cart with the cart''s paths, for a mini cart: `cart_hash`, `cart_key`, `currency`, `item_count`, `items` (each quantity under `value`), `totals.subtotal` and `notices`.'
      parameters:
      - $ref: '#/components/parameters/CartKey'
      - $ref: '#/components/parameters/Formatted'
      - $ref: '#/components/parameters/Thumb'
      - $ref: '#/components/parameters/DefaultCart'
      responses:
        '200':
          description: OK.
          headers:
            Country:
              $ref: '#/components/headers/GeoCountry'
            Country-Code:
              $ref: '#/components/headers/GeoCountryCode'
            Region:
              $ref: '#/components/headers/GeoRegion'
            Timezone:
              $ref: '#/components/headers/GeoTimezone'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiniCart'
              example:
                cart_hash: 8cb2087eac70515154c18f65cc43597b
                cart_key: test_cart_key_123
                currency:
                  currency_code: USD
                  currency_symbol: $
                  currency_symbol_pos: currency_prefix
                  currency_minor_unit: 2
                  currency_decimal_separator: .
                  currency_thousand_separator: ','
                  currency_prefix: $
                  currency_suffix: ''
                item_count: 1
                items:
                - item_key: 16294e55327f1c135116d7d6b9c2ef54
                  id: 2233
                  name: Test Product
                  variation: {}
                  price: '1000'
                  quantity:
                    value: 1
                  featured_image: ''
                  cart_item_data:
                    gift_note: Happy birthday
                totals:
                  subtotal: '1000'
                notices: {}
        '500':
          description: 'Server error: `cocart_minimum_version_required`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cocart_minimum_version_required:
                  summary: cocart_minimum_version_required
                  value:
                    code: cocart_minimum_version_required
                    message: You do not have the minimum required version of … installed to use this endpoint.
                    data:
                      status: 500
  /cart/coupons:
    get:
      tags:
      - coupons
      summary: Get applied coupons
      description: 'Lists the coupons applied to the cart, as the cart lists them, in `{"coupons": [...]}`. The list is `[]` when none is applied.'
      parameters:
      - $ref: '#/components/parameters/CartKey'
      responses:
        '200':
          description: OK.
          headers:
            Country:
              $ref: '#/components/headers/GeoCountry'
            Country-Code:
              $ref: '#/components/headers/GeoCountryCode'
            Region:
              $ref: '#/components/headers/GeoRegion'
            Timezone:
              $ref: '#/components/headers/GeoTimezone'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartCoupons'
              example:
                coupons:
                - coupon: testcoupon
                  label: 'Coupon: testcoupon'
                  discount_type: fixed_cart
                  saving: '-100'
                  saving_html: $1.00
        '404':
          description: 'Not found: `cocart_coupons_not_enabled`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cocart_coupons_not_enabled:
                  summary: cocart_coupons_not_enabled
                  value:
                    code: cocart_coupons_not_enabled
                    message: Coupons are not enabled for this store.
                    data:
                      status: 404
