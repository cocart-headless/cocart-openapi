          type: object
          additionalProperties: true
          readOnly: true
        extensions:
          description: Other plugins' data on the customer, keyed by plugin. An empty object when there is none.
          type: object
          properties:
            email_verification:
              description: Whether the customer has confirmed their account email address, which links their past orders to the account.
              type: object
              properties:
                verified:
                  description: True once the account email address is confirmed.
                  type: boolean
                  readOnly: true
              readOnly: true
          readOnly: true
    Downloads:
      description: The files the customer can download. Empty when there are none.
      type: array
      items:
        type: object
        properties:
          id:
            description: The download's ID within its product.
            type: string
            readOnly: true
          name:
            description: The file's name.
            type: string
            readOnly: true
          downloads_remaining:
            description: How many downloads are left, or null when they are unlimited.
            type: integer
            readOnly: true
            nullable: true
          expires:
            description: When the download expires, or null when it never does. Null when there is none.
            type: object
            properties:
              iso:
                description: The date in ISO 8601 format, with the site's UTC offset.
                type: string
                format: date-time
                readOnly: true
              label:
                description: The date in the site's date and time format, for display.
                type: string
                readOnly: true
            readOnly: true
            nullable: true
          product:
            description: The product the file comes with.
            type: object
            properties:
              id:
                description: Product ID.
                type: integer
                readOnly: true
              name:
                description: Product name.
                type: string
                readOnly: true
            readOnly: true
          order:
            description: The order the file was bought with, or null. Null when there is none.
            type: object
            properties:
              id:
                description: ID.
                type: integer
                readOnly: true
              number:
                description: Number, for display.
                type: string
                readOnly: true
              href:
                description: Route URL.
                type: string
                format: uri
                readOnly: true
            readOnly: true
            nullable: true
          href:
            description: The link that downloads the file.
            type: string
            format: uri
            readOnly: true
      readOnly: true
    EmailChange:
      description: What confirming a new email address did.
      type: object
      properties:
        object:
          description: 'The kind of document: "email_change".'
          type: string
          enum:
          - email_change
          readOnly: true
        result:
          description: What the request did. Only in responses to requests that change something.
          type: object
          properties:
            code:
              description: Result code to branch on, not translated.
              type: string
              readOnly: true
            message:
              description: Message for the customer.
              type: string
              readOnly: true
          readOnly: true
        email:
          description: The account's email address now.
          type: string
          format: email
          readOnly: true
    EmailVerification:
      description: What asking for an order verification email did.
      type: object
      properties:
        object:
          description: 'The kind of document: "email_verification".'
          type: string
          enum:
          - email_verification
          readOnly: true
        result:
          description: What the request did. Only in responses to requests that change something.
          type: object
          properties:
            code:
              description: Result code to branch on, not translated.
              type: string
              readOnly: true
            message:
              description: Message for the customer.
              type: string
              readOnly: true
          readOnly: true
        email:
          description: The address the email was sent to.
          type: string
          format: email
          readOnly: true
        retry_after:
          description: Seconds until another email can be asked for, 0 when one can be now.
          type: integer
          readOnly: true
    ErrorResponse:
      type: object
      description: 'An error: nothing was changed. The shape is WordPress''s.'
      required:
      - code
      - message
      - data
      properties:
        code:
          type: string
          description: 'A stable code to branch on: `cocart_` and snake case, or WordPress''s own `rest_` codes for arguments it refuses.'
        message:
          type: string
          description: For the customer, as plain text.
        data:
          type: object
          required:
          - status
          additionalProperties: true
          properties:
            status:
              type: integer
              description: The HTTP status.
            field:
              type: string
              description: The first field at fault, as a path such as `billing.postcode`.
            fields:
              type: object
              additionalProperties:
                type: string
              description: Every field at fault, by path, with its message.
            reason:
              type: string
              description: The underlying plugin's own reason, when there is one.
    MiniCart:
      description: A part of the cart, with the cart's paths.
      type: object
      properties:
        cart_hash:
          description: A unique hash key of the cart contents.
          type: string
          readOnly: true
          nullable: true
        cart_key:
          description: The cart key identifying the cart in session.
          type: string
          readOnly: true
        currency:
          description: The store currency information.
          type: object
          properties:
            currency_code:
              description: The currency code (in ISO format) for returned prices.
              type: string
              readOnly: true
            currency_symbol:
              description: The currency symbol for the currency which can be used to format returned prices.
              type: string
              readOnly: true
            currency_symbol_pos:
              description: The currency symbol position to which the currency needs to return for the prices.
              type: string
              readOnly: true
            currency_minor_unit:
              description: The currency minor unit (number of digits after the decimal separator) for returned prices.
              type: integer
              readOnly: true
            currency_decimal_separator:
              description: The decimal separator for the currency which can be used to format returned prices.
              type: string
              readOnly: true
            currency_thousand_separator:
              description: The thousand separator for the currency which can be used to format returned prices.
              type: string
              readOnly: true
            currency_prefix:
              description: The price prefix for the currency which can be used to format returned prices.
              type: string
              readOnly: true
            currency_suffix:
              description: The price prefix for the currency which can be used to format returned prices.
              type: string
              readOnly: true
          readOnly: true
        item_count:
          description: The number of items in the cart.
          type: integer
          readOnly: true
        items:
          description: The items in the cart.
          type: array
          items:
            type: object
            properties:
              item_key:
                description: Unique identifier for the item within the cart.
                type: string
                readOnly: true
              id:
                description: Product ID.
                type: integer
                readOnly: true
              name:
                description: Product name.
                type: string
                readOnly: true
              price:
                description: Product price.
                readOnly: true
                oneOf:
                - type: string
                - type: object
              quantity:
                description: Quantity of the item in the cart, as the cart gives it.
                type: object
                properties:
                  value:
                    description: Quantity.
                    type: number
                    readOnly: true
                readOnly: true
              variation:
                description: Variation attributes for the item, keyed by attribute.
                type: object
                readOnly: true
              cart_item_data:
                description: Additional cart item data, keyed as the plugin that added it keys it.
                type: object
                additionalProperties: true
                readOnly: true
              featured_image:
                description: Product featured image URL.
                type: string
                format: uri
                readOnly: true
          readOnly: true
        totals:
          description: 'The cart''s totals, as the cart gives them: only the subtotal.'
          type: object
          properties:
            subtotal:
              description: The cart subtotal.
              type: string
              readOnly: true
          readOnly: true
        notices:
          description: Notices for the customer, keyed by type, as the cart gives them.
          type: object
          readOnly: true
    Order:
      description: An order, like a receipt. The same document wherever an order is returned; a list row is a summary with the same paths, but a flat `total` in place of `totals`.
      type: object
      properties:
        object:
          description: 'The kind of document: "order".'
          type: string
          enum:
          - order
          readOnly: true
        id:
          description: Order ID.
          type: integer
          readOnly: true
        number:
          description: Order number, for display. Can differ from the ID.
          type: string
          readOnly: true
        key:
          description: Order key, needed to view or pay for the order as a guest. Null for a guest who looked the order up by email.
          type: string
          readOnly: true
          nullable: true
        status:
          description: Order status.
          type: object
          properties:
            code:
              description: Status code, not translated and without the "wc-" prefix, e.g. on-hold. Use this in code.
              type: string
              readOnly: true
            label:
              description: Status label, translated, for display.
              type: string
              readOnly: true
          readOnly: true
        date_created:
          description: When the order was placed. Null when there is none.
          type: object
          properties:
            iso:
              description: The date in ISO 8601 format, with the site's UTC offset.
              type: string
              format: date-time
              readOnly: true
            label:
              description: The date in the site's date and time format, for display.
              type: string
              readOnly: true
          readOnly: true
          nullable: true
        currency:
          description: The order's currency. Every amount in the order is in it.
          type: object
          properties:
            currency_code:
              description: Currency code.
              type: string
              readOnly: true
            currency_symbol:
              description: Currency symbol.
              type: string
              readOnly: true
            currency_symbol_pos:
              description: The currency symbol position to which the currency needs to return for the prices.
              type: string
              readOnly: true
            currency_minor_unit:
              description: Currency minor unit.
              type: integer
              readOnly: true
            currency_decimal_separator:
              description: Currency decimal separator.
              type: string
              readOnly: true
            currency_thousand_separator:
              description: Currency thousand separator.
              type: string
              readOnly: true
            currency_prefix:
              description: Currency prefix.
              type: string
              readOnly: true
            currency_suffix:
              description: Currency suffix.
              type: string
              readOnly: true
          readOnly: true
        item_count:
          description: Number of items, less the ones refunded.
          type: integer
          readOnly: true
        items:
          description: The order's lines. Amounts exclude tax, with the tax beside them.
          type: array
          items:
            type: object
            properties:
              id:
                description: Order item ID.
                type: integer
                readOnly: true
              name:
                description: Name, as it was ordered.
                type: string
                readOnly: true
              quantity:
                description: Quantity ordered.
                type: integer
                readOnly: true
              price:
                description: Price of one, before discounts, excluding tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
                type: string
                readOnly: true
              totals:
                description: The line's totals.
                type: object
                properties:
                  subtotal:
                    description: Line subtotal, before discounts, excluding tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
                    type: string
                    readOnly: true
                  subtotal_tax:
                    description: Tax on the line subtotal. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
                    type: string
                    readOnly: true
                  total:
                    description: Line total, after discounts, excluding tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
                    type: string
                    readOnly: true
                  tax:
                    description: Tax on the line total. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
                    type: string
                    readOnly: true
                readOnly: true
              refunded_quantity:
                description: Quantity refunded.
                type: integer
                readOnly: true
              sku:
                description: Product SKU.
                type: string
                readOnly: true
              details:
                description: What to print under the item, e.g. its size or an engraving, in order. An empty list when there is none.
                type: array
                items:
                  type: object
                  properties:
                    label:
                      description: Label for display, e.g. "Size".
                      type: string
                      readOnly: true
                    value:
                      description: Value for display, e.g. "L".
                      type: string
                      readOnly: true
                readOnly: true
              meta:
                description: The item's raw meta the store allows (`cocart_order_items_allowed_meta_keys`), keyed by meta key, for code. Show `details` to the customer. Keyed by meta key, with the first value of each as stored. Only keys the store allows, narrowed by `meta_keys`. An empty object when there are none.
                type: object
                additionalProperties: true
                readOnly: true
              purchase_note:
                description: Purchase note, as plain text, once the order is processing or completed.
                type: string
                readOnly: true
              product:
                description: The product the line is for. Null for a line that isn't for a product, such as a fee.
                type: object
                properties:
                  id:
                    description: Product ID.
                    type: integer
                    readOnly: true
                  variation_id:
                    description: Variation ID, or 0.
                    type: integer
                    readOnly: true
                  type:
                    description: Product type. Empty when the product no longer exists.
                    type: string
                    readOnly: true
                  exists:
                    description: False when the product or variation has since been deleted.
                    type: boolean
                    readOnly: true
                  image:
                    description: Product image URL, or empty.
                    type: string
                    readOnly: true
                  href:
                    description: Product route URL. Null when the product no longer exists.
                    type: string
                    format: uri
                    readOnly: true
                    nullable: true
                readOnly: true
                nullable: true
          readOnly: true
        totals:
          description: The order's totals, with the cart's keys.
          type: object
          properties:
            subtotal:
              description: Subtotal, before discounts, excluding tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
            subtotal_tax:
              description: Tax on the subtotal. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
            discount_total:
              description: Discounts, excluding tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
            discount_tax:
              description: Tax on the discounts. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
            shipping_total:
              description: Shipping, excluding tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
            shipping_tax:
              description: Tax on shipping. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
            fee_total:
              description: Fees, excluding tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
            fee_tax:
              description: Tax on fees. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
            total_tax:
              description: Total tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
            total:
              description: 'Order total: subtotal - discount_total + shipping_total + fee_total + total_tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.'
              type: string
              readOnly: true
            refunded_total:
              description: Total refunded. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
          readOnly: true
        total_lines:
          description: The totals as a receipt prints them, in order. The lines before the total add up to it; refunds follow it.
          type: array
          items:
            type: object
            properties:
              key:
                description: 'What the line is: subtotal, discount, shipping, fee, tax, total, refund, or a key a plugin adds.'
                type: string
                readOnly: true
              label:
                description: Label for display.
                type: string
                readOnly: true
              amount:
                description: 'Amount, signed as printed: a discount or refund is negative. In minor units, e.g. "4999", or formatted for display with `formatted=true`.'
                type: string
                readOnly: true
              detail:
                description: What is printed after the amount, e.g. the coupon codes or the shipping method. Null when there is none.
                type: string
                readOnly: true
                nullable: true
          readOnly: true
        payment:
          description: How the order was paid, or can be.
          type: object
          properties:
            method:
              description: Payment method ID.
              type: string
              readOnly: true
            title:
              description: Payment method title, for display.
              type: string
              readOnly: true
            needs_payment:
              description: Whether the order still needs paying.
              type: boolean
              readOnly: true
            date_paid:
              description: When the order was paid. Null when there is none.
              type: object
              properties:
                iso:
                  description: The date in ISO 8601 format, with the site's UTC offset.
                  type: string
                  format: date-time
                  readOnly: true
                label:
                  description: The date in the site's date and time format, for display.
                  type: string
                  readOnly: true
              readOnly: true
              nullable: true
            available_methods:
              description: Payment methods the order can be paid with while it needs payment, as `GET /checkout/payment-methods` lists them. Empty otherwise.
              type: array
              items:
                type: object
                properties:
                  id:
                    description: Payment method ID, to send as `payment_method`.
                    type: string
                    readOnly: true
                  title:
                    description: Title for display.
                    type: string
                    readOnly: true
                  description:
                    description: Description for display, as plain text.
                    type: string
                    readOnly: true
                  order_button_text:
                    description: Text for the place order button, or null for the default.
                    type: string
                    readOnly: true
                    nullable: true
                  has_fields:
                    description: Whether the payment method has fields to fill in.
                    type: boolean
                    readOnly: true
                  test_mode:
                    description: Whether the payment method is in test mode.
                    type: boolean
                    readOnly: true
                  supports:
                    description: What the payment method supports.
                    type: object
                    properties:
                      tokenization:
                        description: Whether it can use saved payment methods.
                        type: boolean
                        readOnly: true
                      save_payment:
                        description: Whether the customer can save the payment method for next time. Only for a logged-in customer.
                        type: boolean
                        readOnly: true
                      refunds:
                        description: Whether it can refund.
                        type: boolean
                        readOnly: true
                      subscriptions:
                        description: Whether it can pay for subscriptions.
                        type: boolean
                        readOnly: true
                    readOnly: true
                  restricted_to_shipping_methods:
                    description: The shipping methods the payment method is limited to. Empty when it isn't limited.
                    type: array
                    items:
                      type: string
                    readOnly: true
                  saved_tokens:
                    description: The customer's saved payment methods for it. Empty for a guest.
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          description: Token ID, to send as `token_id`.
                          type: integer
                          readOnly: true
                        label:
                          description: Label for display, e.g. "Visa ending in 4242".
                          type: string
                          readOnly: true
                        type:
                          description: Token type, e.g. CC.
                          type: string
                          readOnly: true
                        is_default:
                          description: Whether it is the customer's default.
                          type: boolean
                          readOnly: true
                        expires:
                          description: Expiry as MM/YYYY, or null when it has none.
                          type: string
                          readOnly: true
                          nullable: true
                    readOnly: true
              readOnly: true
          readOnly: true
        customer:
          description: Who the order is for.
          type: object
          properties:
            id:
              description: Customer ID, or 0 for a guest.
              type: integer
              readOnly: true
            note:
              description: The note the customer left at checkout.
              type: string
              readOnly: true
            billing:
              description: Billing address. Null when there is none.
              type: object
              properties:
                first_name:
                  description: First name.
                  type: string
                  readOnly: true
                last_name:
                  description: Last name.
                  type: string
                  readOnly: true
                company:
                  description: Company name.
                  type: string
                  readOnly: true
                address_1:
                  description: Address line 1.
                  type: string
                  readOnly: true
                address_2:
                  description: Address line 2.
                  type: string
                  readOnly: true
                city:
                  description: City.
                  type: string
                  readOnly: true
                state:
                  description: State/Province.
                  type: string
                  readOnly: true
                postcode:
                  description: Postcode/ZIP.
                  type: string
                  readOnly: true
                country:
                  description: Country code.
                  type: string
                  readOnly: true
                email:
                  description: Email address.
                  type: string
                  readOnly: true
                phone:
                  description: Phone number.
                  type: string
                  readOnly: true
                formatted:
                  description: The address on one line, for display.
                  type: string
                  readOnly: true
              readOnly: true
              nullable: true
            shipping:
              description: Shipping address. Null when there is none.
              type: object
              properties:
                first_name:
                  description: First name.
                  type: string
                  readOnly: true
                last_name:
                  description: Last name.
                  type: string
                  readOnly: true
                company:
                  description: Company name.
                  type: string
                  readOnly: true
                address_1:
                  description: Address line 1.
                  type: string
                  readOnly: true
                address_2:
                  description: Address line 2.
                  type: string
                  readOnly: true
                city:
                  description: City.
                  type: string
                  readOnly: true
                state:
                  description: State/Province.
                  type: string
                  readOnly: true
                postcode:
                  description: Postcode/ZIP.
                  type: string
                  readOnly: true
                country:
                  description: Country code.
                  type: string
                  readOnly: true
                phone:
                  description: Phone number.
                  type: string
                  readOnly: true
                formatted:
                  description: The address on one line, for display.
                  type: string
                  readOnly: true
              readOnly: true
              nullable: true
          readOnly: true
        delivery:
          description: How the order is delivered.
          type: object
          properties:
            needs_shipping:
              description: Whether the order needs a shipping address.
              type: boolean
              readOnly: true
            shipping_lines:
              description: The order's shipping methods.
              type: array
              items:
                type: object
                properties:
                  title:
                    description: Shipping method title.
                    type: string
                    readOnly: true
                  total:
                    description: Shipping cost, excluding tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
                    type: string
                    readOnly: true
                  tax:
                    description: Tax on shipping. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
                    type: string
                    readOnly: true
              readOnly: true
          readOnly: true
        downloads:
          description: The files the customer can download from the order. Empty until downloads are permitted.
          type: array
          items:
            type: object
            properties:
              id:
                description: The download's ID within its product.
                type: string
                readOnly: true
              name:
                description: The file's name.
                type: string
                readOnly: true
              downloads_remaining:
                description: How many downloads are left, or null when they are unlimited.
                type: integer
                readOnly: true
                nullable: true
              expires:
                description: When the download expires, or null when it never does. Null when there is none.
                type: object
                properties:
                  iso:
                    description: The date in ISO 8601 format, with the site's UTC offset.
                    type: string
                    format: date-time
                    readOnly: true
                  label:
                    description: The date in the site's date and time format, for display.
                    type: string
                    readOnly: true
                readOnly: true
                nullable: true
              product:
                description: The product the file comes with.
                type: object
                properties:
                  id:
                    description: Product ID.
                    type: integer
                    readOnly: true
                  name:
                    description: Product name.
                    type: string
                    readOnly: true
                readOnly: true
              order:
                description: The order the file was bought with, or null. Null when there is none.
                type: object
                properties:
                  id:
                    description: ID.
                    type: integer
                    readOnly: true
                  number:
                    description: Number, for display.
                    type: string
                    readOnly: true
                  href:
                    description: Route URL.
                    type: string
                    format: uri
                    readOnly: true
                readOnly: true
                nullable: true
              href:
                description: The link that downloads the file.
                type: string
                format: uri
                readOnly: true
          readOnly: true
        notes:
          description: Notes on the order the customer can see.
          type: array
          items:
            type: object
            properties:
              date:
                description: When the note was added. Null when there is none.
                type: object
                properties:
                  iso:
                    description: The date in ISO 8601 format, with the site's UTC offset.
                    type: string
                    format: date-time
                    readOnly: true
                  label:
                    description: The date in the site's date and time format, for display.
                    type: string
                    readOnly: true
                readOnly: true
                nullable: true
              note:
                description: Note, as plain text.
                type: string
                readOnly: true
          readOnly: true
        parent_order:
          description: The parent order. Null when there is none.
          type: object
          properties:
            id:
              description: ID.
              type: integer
              readOnly: true
            number:
              description: Number, for display.
              type: string
              readOnly: true
            href:
              description: Route URL.
              type: string
              format: uri
              readOnly: true
          readOnly: true
          nullable: true
        allowed_actions:
