                $ref: '#/components/schemas/Account'
              example:
                user:
                  id: 42
                  date_registered: '2024-03-15T10:30:00Z'
                  email: john.doe@example.com
                  first_name: John
                  last_name: Doe
                  display_name: John Doe
                  addresses:
                    billing:
                      first_name: John
                      last_name: Doe
                      company: Acme Corporation
                      address_1: 123 Main Street
                      address_2: Suite 100
                      city: Beverly Hills
                      state: CA
                      postcode: '90210'
                      country: US
                      email: john.doe@example.com
                      phone: +1-555-123-4567
                    shipping:
                      first_name: John
                      last_name: Doe
                      company: ''
                      address_1: 123 Main Street
                      address_2: Suite 100
                      city: Beverly Hills
                      state: CA
                      postcode: '90210'
                      country: US
                  orders_count: 12
                  total_spent: $1,254.00
