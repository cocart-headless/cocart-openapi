      tags: *id001
      summary: Get an order's downloads
      description: The files the customer can download from one order, as `GET /my-account/downloads` lists them. Open to the order's customer, or to a guest giving the billing `email` of an order placed without an account.
      parameters:
      - name: id
        in: path
        required: true
        description: Unique identifier for the order.
        schema:
          type: integer
      - name: email
        in: query
        required: false
        description: The orders billing email address.
        schema:
          type: string
          format: email
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Downloads'
              example:
              - id: test-file
                name: Test file
                downloads_remaining: null
                expires: null
                product:
                  id: 2064
                  name: Test Product
                order:
                  id: 2065
                  number: '2065'
                  href: https://example-store.com/wp-json/cocart/v2/my-account/orders/2065
                href: https://example-store.com/?download_file=2064&order=wc_order_NB8b2XGZwDk4e&uid=6a6c26195c3682faa816966af789717c3bfa834eee6c599d667d2b3429c27cfd&key=test-file
        '400':
          description: 'Bad request: `cocart_customer_error`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cocart_customer_error:
                  summary: cocart_customer_error
                  value:
                    code: cocart_customer_error
                    message: Unable to retrieve customer.
                    data:
                      status: 400
        '401':
          description: 'Not signed in: `cocart_rest_authentication_required`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cocart_rest_authentication_required:
                  summary: cocart_rest_authentication_required
                  value:
                    code: cocart_rest_authentication_required
                    message: You need to be logged in to view an order.
                    data:
                      status: 401
        '404':
          description: 'Not found: `cocart_order_not_found`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cocart_order_not_found:
                  summary: cocart_order_not_found
                  value:
                    code: cocart_order_not_found
                    message: 'Order #1951 does not exist.'
                    data:
                      status: 404
        '429':
          description: 'Too many requests: `cocart_guest_lookup_rate_limited`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cocart_guest_lookup_rate_limited:
                  summary: cocart_guest_lookup_rate_limited
                  value:
                    code: cocart_guest_lookup_rate_limited
                    message: Too many failed attempts. Please wait a few minutes before trying again.
                    data:
                      status: 429
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        Basic authentication with username and password.

        Since CoCart v4.9.0, if an `X-HTTP-Method-Override` header is present, it is honored
        when determining the request method during authentication (e.g. credentials sent in a
        JSON body are still detected when the original method is tunneled through POST).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer token authentication (JWT). Optional for cart endpoints.
        When provided by customers, enables enhanced functionality like persistent carts and user-specific data.
  headers:
    ETagHeader:
      description: |
        Weak ETag cache validation token. Format: W/"<md5hash>". Use in If-None-Match on subsequent requests for conditional requests.
      schema:
        type: string
        pattern: ^W/"[a-f0-9]{32}"$
        example: W/"d41d8cd98f00b204e9800998ecf8427e"
    CoCartCacheHeader:
      description: |
        ETag cache status: HIT (304 returned), MISS (fresh response), SKIP (_skip_cache used).
      schema:
        type: string
        enum:
        - HIT
        - MISS
        - SKIP
        example: MISS
    GeoCountry:
      description: The geolocated country name of the customer. Only sent when the geolocation feature is enabled.
      schema:
        type: string
        example: United States
    GeoCountryCode:
      description: The geolocated two-letter country code of the customer. Only sent when the geolocation feature is enabled.
      schema:
        type: string
        example: US
    GeoRegion:
      description: The geolocated region of the customer. Only sent when the geolocation feature is enabled.
      schema:
        type: string
        example: California
    GeoTimezone:
      description: The geolocated timezone of the customer. Only sent when the geolocation feature is enabled.
      schema:
        type: string
        example: America/Los_Angeles
    RateLimitLimit:
      description: The maximum number of requests allowed in the current rate limit window. Only sent when rate limiting is enabled. Exposed to cross-origin requests.
      schema:
        type: integer
        example: 25
    RateLimitRemaining:
      description: The number of requests remaining in the current rate limit window. Only sent when rate limiting is enabled. Exposed to cross-origin requests.
      schema:
        type: integer
        example: 24
    RateLimitReset:
      description: Unix timestamp when the current rate limit window resets. Only sent when rate limiting is enabled. Exposed to cross-origin requests.
      schema:
        type: integer
        example: 1767225600
  parameters:
    CartKey:
      name: cart_key
      in: query
      description: Unique identifier for the cart/customer.
      required: false
      schema:
        type: string
    Thumb:
      name: thumb
      in: query
      description: True if you want to return the URL of the featured product image for each item in the cart.
      required: false
      schema:
        type: boolean
        default: true
    DefaultCart:
      name: default
      in: query
      description: Return the default cart data if set to true.
      required: false
      schema:
        type: boolean
        default: false
    Formatted:
      name: formatted
      in: query
      description: Returns price values as a formatted string (e.g. "$18.00") when true. Defaults to false, returning raw numeric values (e.g. 1800).
      required: false
      schema:
        type: boolean
        default: false
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: |
        Conditional request header. Send previous ETag value; server returns 304 Not Modified if resource unchanged.
      required: false
      schema:
        type: string
        example: W/"d41d8cd98f00b204e9800998ecf8427e"
    SkipCache:
      name: _skip_cache
      in: query
      description: |
        Set to true or 1 to bypass ETag checking. Forces full response with CoCart-Cache: SKIP header.
      required: false
      schema:
        type: string
        enum:
        - 'true'
        - '1'
  schemas:
    BatchResponse:
      description: The cart, when every request was to a cart route, or WordPress's batch envelope.
      oneOf:
      - allOf:
        - $ref: '#/components/schemas/Cart'
        required:
        - cart_key
      - $ref: '#/components/schemas/BatchResponses'
    BatchResponses:
      description: 'WordPress''s batch envelope: each request''s response.'
      type: object
      properties:
        failed:
          description: 'With `validation` set to `require-all-validate`: "validation" when a request failed validation, and none was run.'
          type: string
          enum:
          - validation
          readOnly: true
        responses:
          description: Each request's response. When none was run, null for each request that was valid.
          type: array
          items:
            type: object
            properties:
              body:
                description: What the route returned, or its error.
                additionalProperties: true
                readOnly: true
              status:
                description: HTTP status code of the response.
                type: integer
                readOnly: true
              headers:
                description: HTTP headers of the response.
                type: object
                additionalProperties: true
                readOnly: true
            nullable: true
          readOnly: true
      required:
      - responses
    Cart:
      description: 'The cart, as `GET /cart` gives it, with what CoCart Plus adds: its `meta`, and each coupon''s `discount_type`. Fees, shipping packages and their rates are keyed by ID.'
      type: object
      properties:
        cart_hash:
          description: A Unique hash key of the carts contents.
          type: string
          readOnly: true
        cart_key:
          description: The cart key identifying the cart in session.
          type: string
          readOnly: true
        currency:
          description: The store currency information.
          type: object
          properties:
            currency_code:
              description: The currency code (in ISO format) for returned prices.
              type: string
              readOnly: true
            currency_symbol:
              description: The currency symbol for the currency which can be used to format returned prices.
              type: string
              readOnly: true
            currency_symbol_pos:
              description: The currency symbol position to which the currency needs to return for the prices.
              type: string
              readOnly: true
            currency_minor_unit:
              description: The currency minor unit (number of digits after the decimal separator) for returned prices.
              type: integer
              readOnly: true
            currency_decimal_separator:
              description: The decimal separator for the currency which can be used to format returned prices.
              type: string
              readOnly: true
            currency_thousand_separator:
              description: The thousand separator for the currency which can be used to format returned prices.
              type: string
              readOnly: true
            currency_prefix:
              description: The price prefix for the currency which can be used to format returned prices.
              type: string
              readOnly: true
            currency_suffix:
              description: The price prefix for the currency which can be used to format returned prices.
              type: string
              readOnly: true
          readOnly: true
        customer:
          description: The customer information.
          type: object
          properties:
            billing_address:
              description: Customers billing address.
              type: object
              properties:
                billing_first_name:
                  description: Customers billing first name.
                  type: string
                  readOnly: true
                billing_last_name:
                  description: Customers billing last name.
                  type: string
                  readOnly: true
                billing_company:
                  description: Customers billing company name.
                  type: string
                  readOnly: true
                billing_country:
                  description: Customers billing country.
                  type: string
                  readOnly: true
                billing_address_1:
                  description: Customers billing address line one.
                  type: string
                  readOnly: true
                billing_address_2:
                  description: Customers billing address line two.
                  type: string
                  readOnly: true
                billing_city:
                  description: Customers billing address city.
                  type: string
                  readOnly: true
                billing_state:
                  description: Customers billing state.
                  type: string
                  readOnly: true
                billing_postcode:
                  description: Customers billing postcode or zip code.
                  type: string
                  readOnly: true
                billing_phone:
                  description: Customers billing phone.
                  type: string
                  readOnly: true
                billing_email:
                  description: Customers billing email address.
                  type: string
                  readOnly: true
              readOnly: true
            shipping_address:
              description: Customers shipping address.
              type: object
              properties:
                shipping_first_name:
                  description: Customers shipping first name.
                  type: string
                  readOnly: true
                shipping_last_name:
                  description: Customers shipping last name.
                  type: string
                  readOnly: true
                shipping_company:
                  description: Customers shipping company name.
                  type: string
                  readOnly: true
                shipping_country:
                  description: Customers shipping country.
                  type: string
                  readOnly: true
                shipping_address_1:
                  description: Customers shipping address line one.
                  type: string
                  readOnly: true
                shipping_address_2:
                  description: Customers shipping address line two.
                  type: string
                  readOnly: true
                shipping_city:
                  description: Customers shipping address city.
                  type: string
                  readOnly: true
                shipping_state:
                  description: Customers shipping state.
                  type: string
                  readOnly: true
                shipping_postcode:
                  description: Customers shipping postcode or zip code.
                  type: string
                  readOnly: true
                shipping_phone:
                  description: Customer's shipping phone.
                  type: string
                  readOnly: true
              readOnly: true
          readOnly: true
        items:
          description: The list of items in the cart.
          type: array
          items:
            type: object
            properties:
              item_key:
                description: Unique ID of the item in the cart.
                type: string
                readOnly: true
              id:
                description: Product ID or Variation ID of the item in the cart.
                type: integer
                readOnly: true
              name:
                description: The name of the item in the cart.
                type: string
                readOnly: true
              title:
                description: The title of the item in the cart.
                type: string
                readOnly: true
              variation:
                description: The variation attributes of the item in the cart (if item is a variation of a variable product).
                type: object
              price:
                description: The price of the item in the cart.
                type: string
                readOnly: true
              regular_price:
                description: The regular price of the item in the cart, before any sale discount. Empty if the item is not on sale.
                type: string
                readOnly: true
              on_sale:
                description: Whether the item in the cart is currently on sale.
                type: boolean
                readOnly: true
              quantity:
                description: The quantity of the item in the cart and minimum and maximum purchase capability.
                type: object
                properties:
                  value:
                    description: The quantity of the item in the cart.
