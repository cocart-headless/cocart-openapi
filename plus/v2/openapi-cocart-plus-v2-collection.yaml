              type: boolean
              readOnly: true
          readOnly: true
        billing:
          description: Billing address. Null when there is none.
          type: object
          properties:
            first_name:
              description: First name.
              type: string
              readOnly: true
            last_name:
              description: Last name.
              type: string
              readOnly: true
            company:
              description: Company name.
              type: string
              readOnly: true
            address_1:
              description: Address line 1.
              type: string
              readOnly: true
            address_2:
              description: Address line 2.
              type: string
              readOnly: true
            city:
              description: City.
              type: string
              readOnly: true
            state:
              description: State/Province.
              type: string
              readOnly: true
            postcode:
              description: Postcode/ZIP.
              type: string
              readOnly: true
            country:
              description: Country code.
              type: string
              readOnly: true
            email:
              description: Email address.
              type: string
              readOnly: true
            phone:
              description: Phone number.
              type: string
              readOnly: true
            formatted:
              description: The address on one line, for display.
              type: string
              readOnly: true
          readOnly: true
          nullable: true
        shipping:
          description: Shipping address. Also null when the store doesn't ship, or only ships to the billing address. Null when there is none.
          type: object
          properties:
            first_name:
              description: First name.
              type: string
              readOnly: true
            last_name:
              description: Last name.
              type: string
              readOnly: true
            company:
              description: Company name.
              type: string
              readOnly: true
            address_1:
              description: Address line 1.
              type: string
              readOnly: true
            address_2:
              description: Address line 2.
              type: string
              readOnly: true
            city:
              description: City.
              type: string
              readOnly: true
            state:
              description: State/Province.
              type: string
              readOnly: true
            postcode:
              description: Postcode/ZIP.
              type: string
              readOnly: true
            country:
              description: Country code.
              type: string
              readOnly: true
            phone:
              description: Phone number.
              type: string
              readOnly: true
            formatted:
              description: The address on one line, for display.
              type: string
              readOnly: true
          readOnly: true
          nullable: true
        tax:
          description: How tax applies to the customer.
          type: object
          properties:
            is_vat_exempt:
              description: Whether the customer is exempt from VAT.
