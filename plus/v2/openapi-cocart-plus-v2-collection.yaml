      description: The customer's orders, newest first, each a summary of the order with the same paths, but a flat `total` in place of `totals`. Filter by `status`, by date with `after` and `before`, and by `subscription_order_type`. `pagination` gives the page, the totals and links to the pages beside it; the totals are also sent as `X-WP-Total` and `X-WP-TotalPages`. Needs the customer signed in (JWT or Basic Auth); signed out it is `401 cocart_rest_authentication_required`.
      parameters:
      - name: page
        in: query
        required: false
        description: The pagination of orders to return.
        schema:
          default: 1
          type: integer
          minimum: 1
      - name: per_page
        in: query
        required: false
        description: Limit amount of orders to return per page.
        schema:
          default: 10
          type: integer
          minimum: 1
          maximum: 50
      - name: order
        in: query
        required: false
        description: Order sort attribute ascending or descending.
        schema:
          default: DESC
          type: string
          enum:
          - ASC
          - DESC
      - name: status
        in: query
        required: false
        description: Limit the list to orders with these statuses, such as processing or on-hold, with or without the "wc-" prefix. Comma-separated or an array. Default is every status.
        schema:
          type: array
          items:
            type: string
            enum:
            - pending
            - processing
            - on-hold
            - completed
            - cancelled
            - refunded
            - failed
      - name: after
        in: query
        required: false
        description: Limit the list to orders placed after this date, in ISO 8601 format. Without a time zone offset, the date is UTC.
        schema:
          type: string
          format: date-time
      - name: before
        in: query
        required: false
        description: Limit the list to orders placed before this date, in ISO 8601 format. Without a time zone offset, the date is UTC.
        schema:
          type: string
          format: date-time
      - name: subscription_order_type
        in: query
        required: false
        description: Limit the list to orders with this relationship to a subscription.
        schema:
          type: string
          enum:
          - parent
          - renewal
          - switch
          - resubscribe
      - $ref: '#/components/parameters/Formatted'
      - name: meta_keys
        in: query
        required: false
        description: Only these keys in each `meta`, e.g. meta_keys=gift_message,_configuration. Narrows the keys the store allows; it can never add one. Default every allowed key.
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK.
          headers:
            X-WP-Total:
              description: The number of items on every page.
              schema:
                type: integer
            X-WP-TotalPages:
              description: The number of pages, 0 when there is nothing to list.
              schema:
                type: integer
          content:
