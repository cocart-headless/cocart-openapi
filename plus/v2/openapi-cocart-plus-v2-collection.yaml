  /my-account/verify-order-email:
    post:
      tags:
      - my-account
      summary: Ask for an order verification email
      description: Emails a link that confirms the account's email address, so past guest orders placed with it are linked to the account. Returns `verification_sent`, or `verification_throttled` with `retry_after` in seconds. Needs WooCommerce 11.0 or later. Needs the customer signed in (JWT or Basic Auth); signed out it is `401 cocart_rest_authentication_required`.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerification'
              example:
                object: email_verification
                result:
                  code: verification_throttled
                  message: A link was sent less than a minute ago. Check your inbox, or ask again in 59 seconds.
                email: shopper@example.com
                retry_after: 59
        '401':
          description: 'Not signed in: `cocart_rest_authentication_required`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cocart_rest_authentication_required:
                  summary: cocart_rest_authentication_required
                  value:
                    code: cocart_rest_authentication_required
                    message: You need to be logged in to view your account.
                    data:
                      status: 401
        '404':
          description: 'Not found: `cocart_woocommerce_feature_unavailable`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cocart_woocommerce_feature_unavailable:
                  summary: cocart_woocommerce_feature_unavailable
                  value:
                    code: cocart_woocommerce_feature_unavailable
                    message: This feature requires WooCommerce 11.0 or higher.
                    data:
                      status: 404
        '409':
          description: 'Conflict: `cocart_email_already_verified`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cocart_email_already_verified:
                  summary: cocart_email_already_verified
                  value:
                    code: cocart_email_already_verified
                    message: Your account email address is already verified.
                    data:
                      status: 409
    get:
      tags:
      - my-account
      summary: Confirm the order verification email
      description: Confirms the account's email address from the emailed link and returns the customer, with `email_verified` in `result`. Needs the customer signed in as the link's account; another account is `403 cocart_verification_other_account`.
      parameters:
      - name: key
        in: query
        required: true
        description: The verification key emailed to confirm ownership of the account email address.
        schema:
          type: string
      - name: user_id
        in: query
        required: true
        description: The WordPress user ID the verification belongs to.
        schema:
          type: integer
      - $ref: '#/components/parameters/Formatted'
      - name: meta_keys
        in: query
        required: false
        description: Only these keys in each `meta`, e.g. meta_keys=gift_message,_configuration. Narrows the keys the store allows; it can never add one. Default every allowed key.
        schema:
          type: array
          items:
            type: string
      responses:
