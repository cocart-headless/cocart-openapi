          readOnly: true
        email:
          description: The email address the account logs in with. May not be the billing email.
          type: string
          format: email
          readOnly: true
        pending_email:
          description: A new email address waiting to be confirmed through the link sent to it, or null.
          type: string
          format: email
          readOnly: true
          nullable: true
        first_name:
          description: First name.
          type: string
          readOnly: true
        last_name:
          description: Last name.
          type: string
          readOnly: true
        display_name:
