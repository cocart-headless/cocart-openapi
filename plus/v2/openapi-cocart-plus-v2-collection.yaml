        bundle_data:
          description: Bundle configuration for the cart item.
          type: object
          properties:
            items:
              description: The bundle's items as configured, one entry per bundled item.
              type: array
              items:
                type: object
                properties:
                  bundled_item_id:
                    description: 'Bundled item ID: the item in the bundle''s definition, as `child_items` gives it.'
                    type: integer
                    readOnly: true
                  id:
                    description: Selected product or variation ID.
                    type: integer
                    readOnly: true
                  quantity:
                    description: Quantity information.
                    type: object
                    properties:
                      value:
                        description: Quantity value.
                        type: integer
                        readOnly: true
                      minimum:
                        description: Minimum quantity.
                        type: integer
                        readOnly: true
                      maximum:
                        description: Maximum quantity.
                        type: integer
                        readOnly: true
                    readOnly: true
                  variation:
                    description: Selected variation attributes.
                    type: object
                    additionalProperties:
                      type: string
                    readOnly: true
                  discount:
                    description: Discount applied to this item, or null if none.
                    type: number
                    readOnly: true
                    nullable: true
                  optional_selected:
                    description: Whether the customer included this optional item.
                    type: boolean
                    readOnly: true
              readOnly: true
            child_items:
              description: Summary of bundled child items nested under this container.
