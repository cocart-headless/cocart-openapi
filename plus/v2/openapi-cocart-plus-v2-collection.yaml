                last_name: ''
                display_name: Jane Doe
                avatar_url: https://secure.gravatar.com/avatar/a85e9ca18f34935ab9b0381b25bfad2455444112b0149270fd88e3da172fe196?s=96&d=mm&r=g
                date_registered:
                  iso: '2026-11-20T20:07:02+00:00'
                  label: November 20, 2026, 8:07 pm
                currency:
                  currency_code: USD
                  currency_symbol: $
                  currency_symbol_pos: currency_prefix
                  currency_minor_unit: 2
                  currency_decimal_separator: .
                  currency_thousand_separator: ','
                  currency_prefix: $
                  currency_suffix: ''
                stats:
                  orders_count: 1
                  total_spent: '0'
                  is_paying_customer: false
                billing: null
                shipping: null
                tax:
                  is_vat_exempt: false
                  is_outside_base: false
                recent_orders:
                - id: 2148
                  number: '2148'
                  status:
                    code: pending
                    label: Pending payment
                  date_created:
                    iso: '2026-11-20T20:07:02+00:00'
                    label: November 20, 2026, 8:07 pm
                  total: '1000'
                  href: https://example-store.com/wp-json/cocart/v2/my-account/orders/2148
                meta: {}
                extensions:
                  email_verification:
                    verified: true
        '400':
