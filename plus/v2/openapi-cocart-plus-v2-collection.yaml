              type: string
              readOnly: true
          items:
            type: object
          readOnly: true
        notices:
          description: The cart notices.
          type: object
          properties:
            success:
              description: Notices for successful actions.
              type: array
              items:
                type: string
              readOnly: true
            info:
              description: Notices for informational actions.
              type: array
              items:
                type: string
              readOnly: true
            error:
              description: Notices for error actions.
              type: array
              items:
                type: string
              readOnly: true
          additionalProperties:
            type: array
            items:
              type: string
          readOnly: true
        meta:
          description: Meta saved on the cart with `update-cart-meta`, keyed by meta key. An empty object when there is none.
