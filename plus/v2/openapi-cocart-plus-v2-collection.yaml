  /batch:
    servers:
    - url: '{protocol}://{host}/wp-json/cocart'
      description: The batch route is outside the versioned namespace.
      variables:
        protocol:
          enum:
          - http
          - https
          default: https
        host:
          default: example.com
    post:
      tags:
      - batch
      summary: Send requests in a batch
      description: 'Sends several requests in one. When every request is to a cart route, the response is the cart after them all, with each failed request as an `error` notice. Otherwise it is WordPress''s batch envelope, `{"responses": [...]}`, with each response''s body, status and headers.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                validation:
                  type: string
                  enum:
                  - require-all-validate
                  - normal
                  default: normal
                requests:
                  type: array
                  maxItems: 25
                  items:
                    type: object
                    properties:
                      method:
                        type: string
                        enum:
                        - GET
                        - POST
                        - PUT
                        - PATCH
                        - DELETE
                        default: POST
                      path:
                        type: string
                      body:
                        type: object
                        additionalProperties: true
                      headers:
                        type: object
                        additionalProperties:
                          oneOf:
                          - type: string
                          - type: array
                            items:
                              type: string
