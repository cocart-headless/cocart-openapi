                currency:
                  currency_code: USD
                  currency_symbol: $
                  currency_symbol_pos: currency_prefix
                  currency_minor_unit: 2
                  currency_decimal_separator: .
                  currency_thousand_separator: ','
                  currency_prefix: $
                  currency_suffix: ''
                customer:
                  billing_address:
                    billing_first_name: Jane
                    billing_last_name: Doe
                    billing_company: ''
                    billing_country: FR
                    billing_address_1: 123 Test Street
                    billing_address_2: ''
                    billing_postcode: '75001'
                    billing_city: Paris
                    billing_state: ''
                    billing_phone: 0123456789
