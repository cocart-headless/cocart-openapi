              type: string
              readOnly: true
            discount_total:
              description: Discounts, excluding tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
            discount_tax:
              description: Tax on the discounts. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
            shipping_total:
              description: Shipping, excluding tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
            shipping_tax:
              description: Tax on shipping. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
            fee_total:
              description: Fees, excluding tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
            fee_tax:
              description: Tax on fees. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
            total_tax:
              description: Total tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
            total:
              description: 'Order total: subtotal - discount_total + shipping_total + fee_total + total_tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.'
              type: string
              readOnly: true
            refunded_total:
              description: Total refunded. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
          readOnly: true
        total_lines:
          description: The totals as a receipt prints them, in order. The lines before the total add up to it; refunds follow it.
          type: array
          items:
            type: object
            properties:
              key:
                description: 'What the line is: subtotal, discount, shipping, fee, tax, total, refund, or a key a plugin adds.'
                type: string
                readOnly: true
              label:
                description: Label for display.
                type: string
                readOnly: true
              amount:
                description: 'Amount, signed as printed: a discount or refund is negative. In minor units, e.g. "4999", or formatted for display with `formatted=true`.'
                type: string
                readOnly: true
              detail:
                description: What is printed after the amount, e.g. the coupon codes or the shipping method. Null when there is none.
                type: string
                readOnly: true
                nullable: true
          readOnly: true
        payment:
          description: How the order was paid, or can be.
          type: object
          properties:
            method:
              description: Payment method ID.
              type: string
              readOnly: true
            title:
              description: Payment method title, for display.
              type: string
              readOnly: true
            needs_payment:
              description: Whether the order still needs paying.
              type: boolean
              readOnly: true
            date_paid:
              description: When the order was paid. Null when there is none.
              type: object
              properties:
                iso:
                  description: The date in ISO 8601 format, with the site's UTC offset.
                  type: string
                  format: date-time
                  readOnly: true
                label:
                  description: The date in the site's date and time format, for display.
                  type: string
                  readOnly: true
              readOnly: true
              nullable: true
            available_methods:
              description: Payment methods the order can be paid with while it needs payment, as `GET /checkout/payment-methods` lists them. Empty otherwise.
              type: array
              items:
                type: object
                properties:
                  id:
                    description: Payment method ID, to send as `payment_method`.
                    type: string
                    readOnly: true
                  title:
                    description: Title for display.
                    type: string
                    readOnly: true
                  description:
                    description: Description for display, as plain text.
                    type: string
                    readOnly: true
                  order_button_text:
                    description: Text for the place order button, or null for the default.
                    type: string
                    readOnly: true
                    nullable: true
                  has_fields:
                    description: Whether the payment method has fields to fill in.
                    type: boolean
                    readOnly: true
                  test_mode:
                    description: Whether the payment method is in test mode.
                    type: boolean
                    readOnly: true
                  supports:
                    description: What the payment method supports.
                    type: object
                    properties:
                      tokenization:
                        description: Whether it can use saved payment methods.
                        type: boolean
                        readOnly: true
                      save_payment:
                        description: Whether the customer can save the payment method for next time. Only for a logged-in customer.
                        type: boolean
                        readOnly: true
                      refunds:
                        description: Whether it can refund.
                        type: boolean
                        readOnly: true
                      subscriptions:
                        description: Whether it can pay for subscriptions.
                        type: boolean
                        readOnly: true
                    readOnly: true
                  restricted_to_shipping_methods:
                    description: The shipping methods the payment method is limited to. Empty when it isn't limited.
                    type: array
                    items:
                      type: string
                    readOnly: true
                  saved_tokens:
                    description: The customer's saved payment methods for it. Empty for a guest.
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          description: Token ID, to send as `token_id`.
                          type: integer
                          readOnly: true
                        label:
                          description: Label for display, e.g. "Visa ending in 4242".
                          type: string
                          readOnly: true
                        type:
                          description: Token type, e.g. CC.
                          type: string
                          readOnly: true
                        is_default:
                          description: Whether it is the customer's default.
                          type: boolean
                          readOnly: true
                        expires:
                          description: Expiry as MM/YYYY, or null when it has none.
                          type: string
                          readOnly: true
                          nullable: true
                    readOnly: true
              readOnly: true
          readOnly: true
        customer:
          description: Who the order is for.
          type: object
          properties:
            id:
              description: Customer ID, or 0 for a guest.
              type: integer
              readOnly: true
            note:
              description: The note the customer left at checkout.
              type: string
              readOnly: true
            billing:
              description: Billing address. Null when there is none.
              type: object
              properties:
                first_name:
                  description: First name.
                  type: string
                  readOnly: true
                last_name:
                  description: Last name.
                  type: string
                  readOnly: true
                company:
                  description: Company name.
                  type: string
                  readOnly: true
                address_1:
                  description: Address line 1.
                  type: string
                  readOnly: true
                address_2:
                  description: Address line 2.
                  type: string
                  readOnly: true
                city:
                  description: City.
                  type: string
                  readOnly: true
                state:
                  description: State/Province.
                  type: string
                  readOnly: true
                postcode:
                  description: Postcode/ZIP.
                  type: string
                  readOnly: true
                country:
                  description: Country code.
                  type: string
                  readOnly: true
                email:
                  description: Email address.
                  type: string
                  readOnly: true
                phone:
                  description: Phone number.
                  type: string
                  readOnly: true
                formatted:
                  description: The address on one line, for display.
                  type: string
                  readOnly: true
              readOnly: true
              nullable: true
            shipping:
              description: Shipping address. Null when there is none.
              type: object
              properties:
                first_name:
                  description: First name.
                  type: string
                  readOnly: true
                last_name:
                  description: Last name.
                  type: string
                  readOnly: true
                company:
                  description: Company name.
                  type: string
                  readOnly: true
                address_1:
                  description: Address line 1.
                  type: string
                  readOnly: true
                address_2:
                  description: Address line 2.
                  type: string
                  readOnly: true
                city:
                  description: City.
                  type: string
                  readOnly: true
                state:
                  description: State/Province.
                  type: string
                  readOnly: true
                postcode:
                  description: Postcode/ZIP.
                  type: string
                  readOnly: true
                country:
                  description: Country code.
                  type: string
                  readOnly: true
                phone:
                  description: Phone number.
                  type: string
                  readOnly: true
                formatted:
                  description: The address on one line, for display.
                  type: string
                  readOnly: true
              readOnly: true
              nullable: true
          readOnly: true
        delivery:
          description: How the order is delivered.
          type: object
          properties:
            needs_shipping:
              description: Whether the order needs a shipping address.
              type: boolean
              readOnly: true
            shipping_lines:
              description: The order's shipping methods.
              type: array
              items:
                type: object
                properties:
                  title:
                    description: Shipping method title.
                    type: string
                    readOnly: true
                  total:
                    description: Shipping cost, excluding tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
                    type: string
                    readOnly: true
                  tax:
                    description: Tax on shipping. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
                    type: string
                    readOnly: true
              readOnly: true
          readOnly: true
        downloads:
          description: The files the customer can download from the order. Empty until downloads are permitted.
          type: array
          items:
            type: object
            properties:
              id:
                description: The download's ID within its product.
                type: string
                readOnly: true
              name:
                description: The file's name.
                type: string
                readOnly: true
              downloads_remaining:
                description: How many downloads are left, or null when they are unlimited.
                type: integer
                readOnly: true
                nullable: true
              expires:
                description: When the download expires, or null when it never does. Null when there is none.
                type: object
                properties:
                  iso:
                    description: The date in ISO 8601 format, with the site's UTC offset.
                    type: string
                    format: date-time
                    readOnly: true
                  label:
                    description: The date in the site's date and time format, for display.
                    type: string
                    readOnly: true
                readOnly: true
                nullable: true
              product:
                description: The product the file comes with.
                type: object
                properties:
                  id:
                    description: Product ID.
                    type: integer
                    readOnly: true
                  name:
                    description: Product name.
                    type: string
                    readOnly: true
                readOnly: true
              order:
                description: The order the file was bought with, or null. Null when there is none.
                type: object
                properties:
                  id:
                    description: ID.
                    type: integer
                    readOnly: true
                  number:
                    description: Number, for display.
                    type: string
                    readOnly: true
                  href:
                    description: Route URL.
                    type: string
                    format: uri
                    readOnly: true
                readOnly: true
                nullable: true
              href:
                description: The link that downloads the file.
                type: string
                format: uri
                readOnly: true
          readOnly: true
        notes:
          description: Notes on the order the customer can see.
          type: array
          items:
            type: object
            properties:
              date:
                description: When the note was added. Null when there is none.
                type: object
                properties:
                  iso:
                    description: The date in ISO 8601 format, with the site's UTC offset.
                    type: string
                    format: date-time
                    readOnly: true
                  label:
                    description: The date in the site's date and time format, for display.
                    type: string
                    readOnly: true
                readOnly: true
                nullable: true
              note:
                description: Note, as plain text.
                type: string
                readOnly: true
          readOnly: true
        parent_order:
          description: The parent order. Null when there is none.
          type: object
          properties:
            id:
