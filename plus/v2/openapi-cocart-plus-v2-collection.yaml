      - $ref: '#/components/parameters/CartKey'
      - $ref: '#/components/parameters/Formatted'
      - $ref: '#/components/parameters/Thumb'
      - $ref: '#/components/parameters/DefaultCart'
      - name: email
        in: query
        required: false
        description: Customer's email address to check coupons' email restrictions and usage limits against. Defaults to the cart's billing email.
        schema:
          type: string
          format: email
      responses:
        '200':
          description: OK.
          headers:
            Country:
              $ref: '#/components/headers/GeoCountry'
            Country-Code:
              $ref: '#/components/headers/GeoCountryCode'
            Region:
