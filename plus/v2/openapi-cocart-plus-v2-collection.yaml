          format: email
          readOnly: true
    ProductExtensions:
      type: object
      description: What each supported plugin adds under a product's `extensions` on CoCart Starter's product routes, keyed by what the data is.
      additionalProperties: true
      properties:
        subscription_data:
          description: Subscription data (if any) for the product.
          type: object
          properties:
            billing_period:
              description: Subscription billing period details.
              type: object
              properties:
                interval:
                  description: Subscription billing interval.
                  readOnly: true
                  oneOf:
                  - type: string
                  - type: integer
                period:
                  description: Subscription billing period.
                  type: string
                  readOnly: true
                length:
                  description: Subscription billing length.
                  readOnly: true
                  oneOf:
                  - type: string
                  - type: integer
                trial_period:
                  description: Subscription trial period.
                  type: string
                  readOnly: true
                trial_length:
                  description: Subscription trial length.
                  readOnly: true
                  oneOf:
                  - type: string
                  - type: integer
                trial_expiration_date:
                  description: 'When the free trial ends: GMT date (Y-m-d H:i:s) for a subscription started now, or 0 when there is no trial.'
                  readOnly: true
                  oneOf:
                  - type: string
                  - type: integer
                expiration_date:
                  description: 'When the subscription ends: GMT date (Y-m-d H:i:s) for a subscription started now, or 0 when it never expires.'
                  readOnly: true
                  oneOf:
                  - type: string
                  - type: integer
              readOnly: true
            sign_up_fee:
              description: Subscription sign up fee.
              type: string
              readOnly: true
            pay_now:
              description: Subscription amount to pay now.
              type: string
              readOnly: true
            needs_one_time_shipping:
              description: Does the subscription only require shipping once?
              type: boolean
              readOnly: true
            price_string:
              description: The subscription price string.
              type: string
              readOnly: true
            first_renewal:
              description: The first renewal date and time of the subscription.
              type: object
              properties:
                date:
                  description: 'First renewal: GMT date (Y-m-d H:i:s) for a subscription started now, or 0 when there is no renewal.'
                  readOnly: true
                  oneOf:
                  - type: string
                  - type: integer
                timestamp:
                  description: First renewal Unix timestamp.
                  type: integer
                  readOnly: true
                html:
                  description: First renewal date as a human-readable string.
                  type: string
                  readOnly: true
              readOnly: true
          readOnly: true
        points_and_rewards:
          description: Points earning and redemption data for the product.
          type: object
          properties:
            points_earned:
              description: Number of points earned when purchasing this product.
              type: integer
              readOnly: true
            max_discount:
              description: Maximum discount redeemable on this product in the smallest currency unit. Empty string when no limit is set.
              type: string
              readOnly: true
          readOnly: true
        gifting:
          description: Gifting configuration for this product.
          type: object
          properties:
            giftable:
              description: Whether this product can be purchased as a gift for a recipient (send `recipient_email` to `POST /cart/add-item`).
              type: boolean
              readOnly: true
          readOnly: true
        subscription_schemes:
          description: 'Purchase options for this product: one-time and/or subscription plans. Listed only when there is a choice.'
          type: array
          items:
            type: object
            properties:
              price:
                description: Scheme price.
                type: string
                readOnly: true
              period:
                description: Scheme billing period label.
                type: string
                readOnly: true
              value:
                description: 'Scheme key: send it as `convert_to_sub` to `POST /cart/add-item` to add the product with this option ("0" for one-time). Without `convert_to_sub` the default option applies.'
                type: string
                readOnly: true
              rest_url:
                description: Ready-made request to add the product with this option (`POST`).
                type: string
                readOnly: true
          readOnly: true
        composite_data:
          description: Composite product form configuration.
          type: object
          properties:
            layout:
              description: Composite layout mode.
              type: string
              readOnly: true
            components:
              description: Component definitions for form rendering.
              type: array
              items:
                type: object
                properties:
                  id:
                    description: Component ID.
                    type: string
                    readOnly: true
                  title:
                    description: Component title.
                    type: string
                    readOnly: true
                  optional:
                    description: Whether this component is optional.
                    type: boolean
                    readOnly: true
                  quantity_min:
                    description: Minimum quantity for this component.
                    type: integer
                    readOnly: true
                  quantity_max:
                    description: Maximum quantity for this component, or null if unlimited.
                    type: integer
                    readOnly: true
                    nullable: true
                  priced_individually:
                    description: Whether this component is priced individually.
                    type: boolean
                    readOnly: true
                  discount:
                    description: Discount applied to this component, or null if none.
                    type: number
                    readOnly: true
                    nullable: true
                  default_option_id:
                    description: Default product ID pre-selected for this component.
                    type: integer
                    readOnly: true
                  options_style:
                    description: Display style for component options.
                    type: string
                    readOnly: true
              readOnly: true
          readOnly: true
        bundle_data:
          description: Bundle product form configuration.
          type: object
          properties:
            layout:
              description: Bundle layout mode.
              type: string
              readOnly: true
            items:
              description: Bundled item definitions for form rendering.
              type: array
              items:
                type: object
                properties:
                  id:
                    description: Bundled product ID.
                    type: integer
                    readOnly: true
                  optional:
                    description: Whether this bundled item is optional.
                    type: boolean
                    readOnly: true
                  quantity:
                    description: Quantity constraints for this bundled item.
                    type: object
                    properties:
                      value:
                        description: Default quantity.
                        type: integer
                        readOnly: true
                      minimum:
                        description: Minimum quantity.
                        type: integer
                        readOnly: true
                      maximum:
                        description: Maximum quantity, or null if unlimited.
                        type: integer
                        readOnly: true
                        nullable: true
                    readOnly: true
                  priced_individually:
                    description: Whether this bundled item is priced individually.
                    type: boolean
                    readOnly: true
                  discount:
                    description: Discount applied to this bundled item, or null if none.
                    type: number
                    readOnly: true
                    nullable: true
              readOnly: true
          readOnly: true
        accommodation_booking_data:
          description: Accommodation booking constraints for the product.
          type: object
          properties:
            min_nights:
              description: Minimum number of nights required for the booking.
              type: integer
              readOnly: true
            max_nights:
              description: Maximum number of nights allowed for the booking.
              type: integer
              readOnly: true
            check_in_time:
              description: Check-in time in HH:MM format.
              type: string
              readOnly: true
            check_out_time:
              description: Check-out time in HH:MM format.
              type: string
              readOnly: true
          readOnly: true
        booking_data:
          description: Bookable product configuration.
          type: object
          properties:
            duration_type:
              description: Whether the booking duration is fixed or set by the customer.
              type: string
              readOnly: true
            duration_unit:
              description: Unit of time used for the booking duration.
              type: string
              readOnly: true
            duration:
              description: Number of duration units for the booking.
              type: integer
              readOnly: true
            has_persons:
              description: Whether the booking supports person counts.
              type: boolean
              readOnly: true
            min_persons:
              description: Minimum number of persons required for the booking.
              type: integer
              readOnly: true
            max_persons:
              description: Maximum number of persons allowed for the booking.
              type: integer
              readOnly: true
            has_resources:
              description: Whether the booking has selectable resources.
              type: boolean
              readOnly: true
            resource_label:
              description: Label displayed for the resource selector.
              type: string
              readOnly: true
            booking_location:
              description: Location details for the booking.
              type: string
              readOnly: true
          readOnly: true
        msrp_data:
          description: Manufacturer's suggested retail price data for the product.
          type: object
          properties:
            msrp_price:
              type: string
              description: MSRP in the smallest currency unit (simple products only).
              readOnly: true
            msrp_price_min:
              type: string
              description: Lowest MSRP across variations in the smallest currency unit (variable products only).
              readOnly: true
            msrp_price_max:
              type: string
              description: Highest MSRP across variations in the smallest currency unit (variable products only).
              readOnly: true
          readOnly: true
        quantity_rules:
          description: Quantity purchase rules for the product.
          type: object
          properties:
            minimum:
              description: Minimum quantity required to purchase. Zero means no minimum.
              type: integer
              readOnly: true
            maximum:
              description: Maximum quantity allowed to purchase, or null if unlimited.
              type: integer
              readOnly: true
              nullable: true
            group_of:
              description: Quantity must be purchased in multiples of this value. Zero means no restriction.
              type: integer
              readOnly: true
            combine_variations:
              description: Whether quantities across all variations are combined when checking rules (variable products only).
              type: boolean
              readOnly: true
          readOnly: true
        condition:
          description: Product condition information.
          type: object
          properties:
            slug:
              description: Condition slug identifier.
              type: string
              readOnly: true
            label:
              description: Human-readable condition label.
              type: string
              readOnly: true
            schema_condition:
              description: Schema.org OfferItemCondition value.
              type: string
              readOnly: true
            custom_label:
              description: Custom condition label text, when condition is "other" or "new-other".
              type: string
              readOnly: true
          readOnly: true
        discount:
          description: Active discount information for this product.
          type: object
          properties:
            original_price:
              description: Original price before the discount rule is applied.
              type: string
              readOnly: true
            saved_amount:
              description: Amount saved by the active discount rule.
              type: string
              readOnly: true
          readOnly: true
        addons:
          description: Add-on field definitions configured for this product.
          type: array
          items:
            type: object
            properties:
              id:
                description: Unique add-on field identifier.
                type: integer
                readOnly: true
              name:
                description: Add-on field label shown to the customer.
                type: string
                readOnly: true
              type:
                description: Field type (custom_text, custom_textarea, multiple_choice, checkbox, select, datepicker, file_upload, input_multiplier, custom_price).
                type: string
                readOnly: true
              description:
                description: Optional field description shown below the label.
                type: string
                readOnly: true
              required:
                description: Whether the field must be filled before adding to cart.
                type: boolean
                readOnly: true
              position:
                description: Display order position (zero-based).
                type: integer
                readOnly: true
              display:
                description: Sub-display style for multiple_choice fields (select, radiobutton, images).
                type: string
                readOnly: true
              adjust_price:
                description: Whether this field adds a price adjustment to the product price.
                type: boolean
                readOnly: true
              price:
                description: Base price adjustment when adjust_price is true (options override this for choice-based types). For percentage_based, the percentage of the product price, e.g. "10" for 10%, not an amount.
                type: string
                readOnly: true
              price_type:
                description: 'Price type: flat_fee, quantity_based, or percentage_based.'
                type: string
                readOnly: true
              restrictions:
                description: Whether min/max restrictions are enabled for this field.
                type: boolean
                readOnly: true
              min:
                description: Minimum value (character count for text fields, quantity for multiplier, price for custom_price).
                type: number
                readOnly: true
              max:
                description: Maximum value (same units as min).
                type: number
                readOnly: true
              limit_file_types:
                description: Whether file type restrictions are enabled (file_upload fields only).
                type: boolean
                readOnly: true
              allowed_file_types:
                description: Allowed file extensions when limit_file_types is true (e.g. ["jpg","pdf"]).
                type: array
                items:
                  type: string
                readOnly: true
              options:
                description: Selectable options for choice-based field types.
                type: array
                items:
                  type: object
                  properties:
                    label:
                      description: Option label.
                      type: string
                      readOnly: true
                    price:
                      description: Price adjustment for this option. For percentage_based, the percentage of the product price, e.g. "10" for 10%, not an amount.
                      type: string
                      readOnly: true
                    price_type:
                      description: Price type for this option.
                      type: string
                      readOnly: true
                    image:
                      description: Image URL for swatch display (multiple_choice with images display).
                      type: string
                      readOnly: true
                readOnly: true
          readOnly: true
        warranty:
          description: Warranty configuration for this product.
          type: object
          properties:
            type:
              description: 'Warranty type: included or addon.'
              type: string
              readOnly: true
            label:
              description: Warranty field label shown to the customer.
              type: string
              readOnly: true
            options:
              description: Selectable warranty tiers.
              type: array
              items:
                type: object
                properties:
                  key:
                    description: Key to send as `item_data[warranty]` to `POST /cart/add-item` to choose this warranty (the numeric index works too).
                    type: string
                    readOnly: true
                  duration:
                    description: Human-readable warranty duration.
                    type: string
                    readOnly: true
                  cost:
                    description: Additional cost for this warranty tier.
                    type: string
                    readOnly: true
              readOnly: true
          readOnly: true
        vendor:
          description: Vendor store information for the product.
          type: object
          properties:
            id:
              description: Unique vendor identifier.
              type: integer
              readOnly: true
            store_name:
              description: Vendor store display name.
              type: string
              readOnly: true
            store_url:
              description: URL to the vendor store page.
              type: string
              format: uri
              readOnly: true
            avatar:
              description: URL to the vendor avatar image.
              type: string
              format: uri
              readOnly: true
            rating:
              description: Vendor rating summary.
              type: object
              properties:
                average:
                  description: Average vendor rating across all products.
                  type: string
                  readOnly: true
                count:
                  description: Total number of reviews for the vendor.
                  type: integer
                  readOnly: true
              readOnly: true
          readOnly: true
    ProductShippingRates:
      description: The shipping rates a product would have.
      type: object
      properties:
        object:
          description: 'The kind of document: "shipping_rates".'
          type: string
          enum:
          - shipping_rates
          readOnly: true
        product:
          description: The product the rates are for.
          type: object
          properties:
            id:
              description: Product or variation ID.
              type: integer
              readOnly: true
            parent_id:
              description: Parent product ID, or 0.
              type: integer
              readOnly: true
            name:
              description: Product name.
              type: string
              readOnly: true
            type:
              description: Product type.
              type: string
              readOnly: true
          readOnly: true
        quantity:
          description: The quantity the rates are for.
          type: number
          readOnly: true
        currency:
          description: The store currency, which the costs are in.
          type: object
          properties:
            currency_code:
              description: Currency code.
              type: string
              readOnly: true
            currency_symbol:
              description: Currency symbol.
              type: string
              readOnly: true
            currency_symbol_pos:
              description: The currency symbol position to which the currency needs to return for the prices.
              type: string
              readOnly: true
            currency_minor_unit:
              description: Currency minor unit.
              type: integer
              readOnly: true
            currency_decimal_separator:
              description: Currency decimal separator.
              type: string
              readOnly: true
            currency_thousand_separator:
              description: Currency thousand separator.
              type: string
              readOnly: true
            currency_prefix:
              description: Currency prefix.
              type: string
              readOnly: true
            currency_suffix:
              description: Currency suffix.
              type: string
              readOnly: true
          readOnly: true
        in_cart:
          description: Whether this item, with these options, is already in the cart. Null without a cart session.
          type: boolean
          readOnly: true
          nullable: true
        packages:
          description: The shipping packages with rates on offer.
          type: array
          items:
            type: object
            properties:
              id:
                description: 'Package ID, as checkout gives it and the cart gives it in `index`: "0" for the first package.'
                type: string
                readOnly: true
              destination:
                description: Where the package goes, on one line.
                type: string
                readOnly: true
              rates:
                description: The rates on offer.
                type: array
                items:
                  type: object
                  properties:
                    id:
                      description: Rate ID.
                      type: string
                      readOnly: true
                    method_id:
                      description: Shipping method ID.
                      type: string
                      readOnly: true
                    instance_id:
                      description: Shipping method instance ID.
                      type: integer
                      readOnly: true
                    label:
                      description: Label for display.
                      type: string
                      readOnly: true
                    cost:
                      description: Cost, excluding tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
                      type: string
                      readOnly: true
                    tax:
                      description: Tax on the cost, all tax rates added together. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
                      type: string
                      readOnly: true
                    meta_data:
                      description: More about the rate, e.g. the items it ships.
                      type: array
                      items:
                        type: object
                        properties:
                          key:
                            description: Meta key.
                            type: string
                            readOnly: true
                          value:
                            description: Meta value.
                            type: string
                            readOnly: true
                      readOnly: true
                readOnly: true
          readOnly: true
    Subscription:
      description: A subscription, like a receipt, the same for WooCommerce Subscriptions and Milo Subscriptions.
      type: object
      properties:
        object:
          description: 'The kind of document: "subscription".'
          type: string
          enum:
          - subscription
          readOnly: true
        id:
          description: Subscription ID.
          type: integer
          readOnly: true
        number:
          description: Subscription number, for display.
          type: string
          readOnly: true
        status:
          description: Subscription status.
          type: object
          properties:
            code:
              description: Status code, not translated and without the "wc-" prefix, e.g. on-hold. Use this in code.
              type: string
              readOnly: true
            label:
              description: Status label, translated, for display.
              type: string
              readOnly: true
          readOnly: true
        date_created:
          description: When the subscription started. Null when there is none.
          type: object
          properties:
            iso:
              description: The date in ISO 8601 format, with the site's UTC offset.
              type: string
              format: date-time
              readOnly: true
            label:
              description: The date in the site's date and time format, for display.
              type: string
              readOnly: true
          readOnly: true
          nullable: true
        currency:
          description: The subscription's currency. Every amount in the subscription is in it.
          type: object
          properties:
            currency_code:
              description: Currency code.
              type: string
              readOnly: true
            currency_symbol:
              description: Currency symbol.
              type: string
              readOnly: true
            currency_symbol_pos:
              description: The currency symbol position to which the currency needs to return for the prices.
              type: string
              readOnly: true
            currency_minor_unit:
              description: Currency minor unit.
              type: integer
              readOnly: true
            currency_decimal_separator:
              description: Currency decimal separator.
              type: string
              readOnly: true
            currency_thousand_separator:
              description: Currency thousand separator.
              type: string
              readOnly: true
            currency_prefix:
              description: Currency prefix.
              type: string
              readOnly: true
            currency_suffix:
              description: Currency suffix.
              type: string
              readOnly: true
          readOnly: true
        schedule:
          description: When the subscription repeats.
          type: object
          properties:
            interval:
              description: How many periods between payments, e.g. 2 for every 2 months.
              type: integer
              readOnly: true
            period:
              description: 'The billing period: day, week, month or year (or lifetime with Milo Subscriptions).'
              type: string
              readOnly: true
            label:
              description: The schedule for display, e.g. "Every month".
              type: string
              readOnly: true
            next_payment:
              description: The next payment, while the subscription is active. Null when there is none.
              type: object
              properties:
                iso:
                  description: The date in ISO 8601 format, with the site's UTC offset.
                  type: string
                  format: date-time
                  readOnly: true
                label:
                  description: The date in the site's date and time format, for display.
                  type: string
                  readOnly: true
              readOnly: true
              nullable: true
            trial_end:
              description: When the free trial ends. Null when there is none.
              type: object
              properties:
                iso:
                  description: The date in ISO 8601 format, with the site's UTC offset.
                  type: string
                  format: date-time
                  readOnly: true
                label:
                  description: The date in the site's date and time format, for display.
                  type: string
                  readOnly: true
              readOnly: true
              nullable: true
            end:
              description: When the subscription ends. Null when there is none.
              type: object
              properties:
                iso:
                  description: The date in ISO 8601 format, with the site's UTC offset.
                  type: string
                  format: date-time
                  readOnly: true
                label:
                  description: The date in the site's date and time format, for display.
                  type: string
                  readOnly: true
              readOnly: true
              nullable: true
          readOnly: true
        item_count:
          description: Number of items, less the ones refunded.
          type: integer
          readOnly: true
        items:
          description: The order's lines. Amounts exclude tax, with the tax beside them.
          type: array
          items:
            type: object
            properties:
              id:
                description: Order item ID.
                type: integer
                readOnly: true
              name:
                description: Name, as it was ordered.
                type: string
                readOnly: true
              quantity:
                description: Quantity ordered.
                type: integer
                readOnly: true
              price:
                description: Price of one, before discounts, excluding tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
                type: string
                readOnly: true
              totals:
                description: The line's totals.
                type: object
                properties:
                  subtotal:
                    description: Line subtotal, before discounts, excluding tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
                    type: string
                    readOnly: true
                  subtotal_tax:
                    description: Tax on the line subtotal. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
                    type: string
                    readOnly: true
                  total:
                    description: Line total, after discounts, excluding tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
                    type: string
                    readOnly: true
                  tax:
                    description: Tax on the line total. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
                    type: string
                    readOnly: true
                readOnly: true
              refunded_quantity:
                description: Quantity refunded.
                type: integer
                readOnly: true
              sku:
                description: Product SKU.
                type: string
                readOnly: true
              details:
                description: What to print under the item, e.g. its size or an engraving, in order. An empty list when there is none.
                type: array
                items:
                  type: object
                  properties:
                    label:
                      description: Label for display, e.g. "Size".
                      type: string
                      readOnly: true
                    value:
                      description: Value for display, e.g. "L".
                      type: string
                      readOnly: true
                readOnly: true
              meta:
                description: The item's raw meta the store allows (`cocart_order_items_allowed_meta_keys`), keyed by meta key, for code. Show `details` to the customer. Keyed by meta key, with the first value of each as stored. Only keys the store allows, narrowed by `meta_keys`. An empty object when there are none.
                type: object
                additionalProperties: true
                readOnly: true
              purchase_note:
                description: Purchase note, as plain text, once the order is processing or completed.
                type: string
                readOnly: true
              product:
                description: The product the line is for. Null for a line that isn't for a product, such as a fee.
                type: object
                properties:
                  id:
                    description: Product ID.
                    type: integer
                    readOnly: true
                  variation_id:
                    description: Variation ID, or 0.
                    type: integer
                    readOnly: true
                  type:
                    description: Product type. Empty when the product no longer exists.
                    type: string
                    readOnly: true
                  exists:
                    description: False when the product or variation has since been deleted.
                    type: boolean
                    readOnly: true
                  image:
                    description: Product image URL, or empty.
                    type: string
                    readOnly: true
                  href:
                    description: Product route URL. Null when the product no longer exists.
                    type: string
                    format: uri
                    readOnly: true
                    nullable: true
                readOnly: true
                nullable: true
          readOnly: true
        totals:
          description: The order's totals, with the cart's keys.
          type: object
          properties:
            subtotal:
              description: Subtotal, before discounts, excluding tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
            subtotal_tax:
              description: Tax on the subtotal. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
            discount_total:
              description: Discounts, excluding tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
            discount_tax:
              description: Tax on the discounts. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
            shipping_total:
              description: Shipping, excluding tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
            shipping_tax:
              description: Tax on shipping. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
            fee_total:
              description: Fees, excluding tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
            fee_tax:
              description: Tax on fees. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
            total_tax:
              description: Total tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
              type: string
              readOnly: true
            total:
              description: 'Order total: subtotal - discount_total + shipping_total + fee_total + total_tax. In minor units, e.g. "4999", or formatted for display with `formatted=true`.'
              type: string
              readOnly: true
          readOnly: true
        total_lines:
          description: The totals as a receipt prints them, in order. The lines before the total add up to it; refunds follow it.
          type: array
          items:
            type: object
            properties:
              key:
                description: 'What the line is: subtotal, discount, shipping, fee, tax, total, refund, or a key a plugin adds.'
                type: string
                readOnly: true
              label:
                description: Label for display.
                type: string
                readOnly: true
              amount:
                description: 'Amount, signed as printed: a discount or refund is negative. In minor units, e.g. "4999", or formatted for display with `formatted=true`.'
                type: string
                readOnly: true
              detail:
                description: What is printed after the amount, e.g. the coupon codes or the shipping method. Null when there is none.
                type: string
                readOnly: true
                nullable: true
          readOnly: true
        payment:
          description: How the subscription is paid.
          type: object
          properties:
            method:
              description: Payment method ID.
              type: string
              readOnly: true
            title:
              description: Payment method, for display, e.g. "Visa ending in 4242".
              type: string
              readOnly: true
            auto_renew:
              description: Whether the subscription renews automatically, instead of the customer paying for each renewal.
              type: boolean
              readOnly: true
          readOnly: true
        customer:
          description: Who the order is for.
          type: object
          properties:
            id:
              description: Customer ID, or 0 for a guest.
              type: integer
              readOnly: true
            note:
              description: The note the customer left at checkout.
              type: string
              readOnly: true
            billing:
              description: Billing address. Null when there is none.
              type: object
              properties:
                first_name:
                  description: First name.
                  type: string
                  readOnly: true
                last_name:
                  description: Last name.
                  type: string
                  readOnly: true
                company:
                  description: Company name.
                  type: string
                  readOnly: true
                address_1:
                  description: Address line 1.
                  type: string
                  readOnly: true
                address_2:
                  description: Address line 2.
                  type: string
                  readOnly: true
                city:
                  description: City.
                  type: string
                  readOnly: true
                state:
                  description: State/Province.
                  type: string
                  readOnly: true
                postcode:
                  description: Postcode/ZIP.
                  type: string
                  readOnly: true
                country:
                  description: Country code.
