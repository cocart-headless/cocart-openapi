              type: string
              readOnly: true
            href:
              description: Route URL.
              type: string
              format: uri
              readOnly: true
          readOnly: true
          nullable: true
        allowed_actions:
          description: 'What the customer may do with the order now: pay for it (`POST /order-received/{id}/pay`) or cancel it (`POST /my-account/orders/{id}/cancel`). An empty list when there are none.'
