      tags:
      - coupons
      summary: Remove a coupon
      description: 'Removes one coupon from the cart. Returns the cart, as `GET /cart` gives it, with what happened in `notices`. A coupon that isn''t applied is not an error: the cart comes back with an `info` notice.'
