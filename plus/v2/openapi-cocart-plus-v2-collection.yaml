  /my-account/subscriptions/{id}/payment-method:
    post:
      tags:
        - my-account
      summary: Update subscription payment method
      description: |
        Changes the payment method for the authenticated customer's
        subscription, via the
        `cocart_my_account_update_subscription_payment_method` filter.
        Requires login. What actually happens differs by subscription plugin -
        WooCommerce Subscriptions accepts any valid gateway ID and runs a real
        $0 validation charge against the new method before accepting it
        (mirroring its own change-payment-method flow), while Milo
        Subscriptions requires `token_id` (it identifies the gateway from the
        saved token itself, so `payment_method` is otherwise unused) and does
        a pure saved-token swap with no charge - it may also veto a token that
        was never validated for off-session use.
      parameters:
        - name: id
          in: path
          description: Unique identifier for the subscription.
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_method:
                  description: Payment method (gateway) ID.
                  type: string
                token_id:
                  description: Saved payment token ID to use. Required for Milo Subscriptions; optional for WooCommerce Subscriptions.
                  type: integer
              required:
                - payment_method
            example:
              payment_method: stripe
              token_id: 42
      responses:
        '200':
          description: Payment method updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPaymentMethodResult'
              example:
                subscription_id: 89
                payment_method: Visa ending in 1234
                is_manual: false
        '400':
          description: Bad request - the payment method or saved token is invalid, disabled, unavailable, or unsupported for this subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_payment_method:
                  summary: Payment method does not exist (WooCommerce Subscriptions)
                  value:
                    code: cocart_invalid_payment_method
                    message: Invalid payment method.
                    data:
                      status: 400
                payment_method_disabled:
                  summary: Payment method is disabled (WooCommerce Subscriptions)
                  value:
                    code: cocart_payment_method_disabled
                    message: This payment method is currently disabled.
                    data:
                      status: 400
                payment_method_no_subscription_support:
                  summary: Payment method does not support subscriptions (WooCommerce Subscriptions)
                  value:
                    code: cocart_payment_method_no_subscription_support
                    message: The payment method "Stripe" does not support subscriptions. Please choose a different payment method.
                    data:
                      status: 400
                payment_method_not_available:
                  summary: Payment method not available (WooCommerce Subscriptions)
                  value:
                    code: cocart_payment_method_not_available
                    message: This payment method is not available for your order.
                    data:
                      status: 400
                payment_method_not_supported:
                  summary: Subscription plugin does not support changing payment method (WooCommerce Subscriptions)
                  value:
                    code: cocart_subscription_payment_method_not_supported
                    message: Changing payment method is not supported for this subscription.
                    data:
                      status: 400
                payment_token_required:
                  summary: No saved token provided (Milo Subscriptions)
                  value:
                    code: cocart_subscription_payment_token_required
                    message: A saved payment token is required to change this subscription's payment method.
                    data:
                      status: 400
                invalid_payment_token:
                  summary: Saved token does not exist or belongs to another customer (Milo Subscriptions)
                  value:
                    code: cocart_subscription_invalid_payment_token
                    message: Invalid payment method.
                    data:
                      status: 400
                payment_token_needs_confirmation:
                  summary: Saved token needs re-confirmation before recurring use (Milo Subscriptions)
                  value:
                    code: cocart_subscription_payment_token_needs_confirmation
                    message: This payment method needs to be re-confirmed before it can be used for recurring payments.
                    data:
                      status: 400
        '402':
          description: Payment required - the validation charge on the new payment method failed (WooCommerce Subscriptions only; Milo Subscriptions never charges to change payment method).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: cocart_payment_failed
                message: Payment method could not be updated.
                data:
                  status: 402
        '403':
          description: Forbidden - you need to be logged in to manage your subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: cocart_access_my_account_denied
                message: You need to be logged in to manage your subscription!
                data:
                  status: 403
        '404':
          description: Not found - the subscription does not exist or does not belong to the requester.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: cocart_subscription_does_not_exist
                message: Subscription #89 does not exist.
                data:
                  status: 404
      security:
        - basicAuth: []
        - bearerAuth: []
  /my-account/subscriptions/{id}/resubscribe:
    post:
      tags:
        - my-account
      summary: Seed cart to resubscribe
      description: |
        Resubscribing isn't a single atomic action in either WooCommerce
        Subscriptions or Milo Subscriptions - both re-add the old
        subscription's items to the cart and send the customer through
        checkout, where the plugin's own order-creation hooks link the new
        order back to the old subscription. This endpoint only seeds the
        active cart the same way, via the
        `cocart_my_account_seed_resubscribe_cart` filter; the client then
        completes the purchase through CoCart's existing checkout endpoints.
        No payment is processed here. Seeding empties whatever the customer
        already had in their cart, so a non-empty cart is snapshotted into the
        session first - `DELETE` on this same route restores that snapshot and
        discards the in-progress resubscribe attempt. Eligibility (e.g. only
        cancelled/expired subscriptions) and the exact error message are
        decided by the owning subscription plugin; the codes below are shared
        by both providers, but message wording can differ.
      parameters:
        - name: id
          in: path
          description: Unique identifier for the subscription.
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Cart seeded with the subscription's items successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResubscribeResult'
              example:
                subscription_id: 89
                cart_items_added: 1
                cart_item_count: 1
                cart_total: $29.99
                saved_cart_item_count: 2
        '400':
          description: Bad request - none of the subscription's items could be added to the cart (e.g. the products are no longer available).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: cocart_subscription_resubscribe_failed
                message: None of this subscription's items could be added to the cart.
                data:
                  status: 400
        '403':
          description: Forbidden - not logged in, or you cannot resubscribe to this subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_logged_in:
                  summary: Not logged in
                  value:
                    code: cocart_access_my_account_denied
                    message: You need to be logged in to manage your subscription!
                    data:
                      status: 403
                cannot_resubscribe:
                  summary: Cannot resubscribe to this subscription
                  value:
                    code: cocart_subscription_cannot_resubscribe
                    message: You cannot resubscribe to this subscription.
                    data:
                      status: 403
        '404':
          description: Not found - the subscription does not exist or does not belong to the requester.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: cocart_subscription_does_not_exist
                message: Subscription #89 does not exist.
                data:
                  status: 404
      security:
        - basicAuth: []
        - bearerAuth: []
    delete:
      tags:
        - my-account
      summary: Restore cart before resubscribing
      description: |
        Restores the cart snapshot taken before a `POST` to this same route,
        discarding whatever resubscribe items are currently in the cart. Use
        this to abandon an in-progress resubscribe attempt and give the
        customer back what they had in their cart beforehand.
      parameters:
        - name: id
          in: path
          description: Unique identifier for the subscription.
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Saved cart restored successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResubscribeRestoreResult'
              example:
                restored: true
                cart_item_count: 2
                restored_item_count: 2
        '403':
          description: Forbidden - you need to be logged in to manage your subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: cocart_access_my_account_denied
                message: You need to be logged in to manage your subscription!
                data:
                  status: 403
        '404':
          description: Not found - the subscription does not exist or does not belong to the requester, or there is no saved cart to restore.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                subscription_does_not_exist:
                  summary: Subscription does not exist
                  value:
                    code: cocart_subscription_does_not_exist
                    message: Subscription #89 does not exist.
                    data:
                      status: 404
                no_saved_cart:
                  summary: No saved cart to restore
                  value:
                    code: cocart_subscription_no_saved_cart
                    message: There is no saved cart to restore.
                    data:
                      status: 404
      security:
        - basicAuth: []
        - bearerAuth: []
  /my-account/verify-email:
    get:
      tags:
        - my-account
      summary: Verify pending email change
      description: |
        Confirms a pending email address change initiated via
        `POST /my-account` and applies the new email to the user account and
        billing address. This endpoint is intentionally public (no
        authentication required) since the confirmation link is opened from an
        email client that may not share a session with the requester -
        possession of the emailed `key` is the proof of ownership. The link
        expires after 24 hours by default.
      parameters:
        - name: key
          in: query
          description: The verification key sent to the pending new email address.
          required: true
          schema:
            type: string
        - name: user_id
          in: query
          description: The user ID the pending email change belongs to.
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Email address verified and updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailResult'
              example:
                success: true
                email: john.doe@example.com
        '400':
          description: Bad request - the verification key is invalid, expired, or does not match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: cocart_invalid_or_expired_key
                message: This confirmation link is invalid or has expired.
                data:
                  status: 400
        '403':
          description: Forbidden - the pending email address is already registered to a different user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: cocart_account_email_already_registered
                message: This email address is already registered.
                data:
                  status: 403
      security: []
  /my-account/verify-order-email:
    post:
      tags:
        - my-account
      summary: Send order email verification
      description: |
        Sends (or resends) a confirmation email to the authenticated customer's
        account email address, proving they own it so WooCommerce can link any
        past guest orders placed with the same billing email to the account.
        The customer confirms via `GET /my-account/verify-order-email`, using
        the `key` and `user_id` carried in the emailed link. Resending is
        throttled to once every 60 seconds - a request within that window
        returns `status: throttled` rather than sending a new email or minting
        a new key. Requires WooCommerce 11.0+.
      responses:
        '200':
          description: Request processed. Check `status` to tell a new email from a throttled resend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendOrderEmailVerificationResult'
              examples:
                sent:
                  summary: Verification email sent
                  value:
                    success: true
                    status: sent
                throttled:
                  summary: Resent within the 60 second rate limit
                  value:
                    success: true
                    status: throttled
        '400':
          description: Bad request - the account email address is already verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: cocart_email_already_verified
                message: Your account email address is already verified.
                data:
                  status: 400
        '403':
          description: Forbidden - you need to be logged in to verify your email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: cocart_access_my_account_denied
                message: You need to be logged in to view account!
                data:
                  status: 403
        '501':
          description: Not implemented - requires WooCommerce 11.0 or higher.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: cocart_woocommerce_feature_unavailable
                message: This feature requires WooCommerce 11.0 or higher.
                data:
                  status: 501
      security:
        - basicAuth: []
        - bearerAuth: []
    get:
      tags:
        - my-account
      summary: Confirm order email verification
      description: |
        Confirms the verification key emailed via
        `POST /my-account/verify-order-email`, marking the account email
        address verified and letting WooCommerce link any matching guest
        orders to the account. Unlike `GET /my-account/verify-email`, this
        endpoint requires the request be authenticated as the key's target
        user - matching WooCommerce core's own rule that only a request
        authenticated as the link's target user can complete verification, so
        a leaked key with no session behind it (or a session for a different
        account) can never link orders to the wrong customer. Requires
        WooCommerce 11.0+.
      parameters:
        - name: key
          in: query
          description: The verification key emailed to confirm ownership of the account email address.
          required: true
          schema:
            type: string
        - name: user_id
          in: query
          description: The WordPress user ID the verification belongs to.
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Email address verified successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOrderEmailResult'
              example:
                success: true
                email: john.doe@example.com
        '400':
          description: Bad request - the verification key is invalid or has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: cocart_invalid_or_expired_key
                message: This confirmation link is invalid or has expired.
                data:
                  status: 400
        '403':
          description: Forbidden - not logged in, or logged in as a different account than the key's target user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: cocart_access_my_account_denied
                message: You need to be logged in to view account!
                data:
                  status: 403
        '501':
          description: Not implemented - requires WooCommerce 11.0 or higher.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: cocart_woocommerce_feature_unavailable
                message: This feature requires WooCommerce 11.0 or higher.
                data:
                  status: 501
      security:
        - basicAuth: []
        - bearerAuth: []
  /register:
    post:
      tags:
        - customers
      summary: Register customer
      description: |
        Registers a new customer account. A valid email address is required.

        When the WooCommerce setting "generate username from email" is enabled, the
        username may be omitted and is generated automatically. When the WooCommerce
        setting "generate password" is enabled, the password may be omitted and a
        generated password is emailed to the customer.

        A blocklist of reserved usernames (admin, root, support, etc.) cannot be
        registered (filterable via the `cocart_reserved_usernames` filter).

        Passwords provided by the customer must be at least 8 characters
        (filterable via `cocart_minimum_password_length`), must not match the
        username or email address, must not be a common weak password
        (filterable via `cocart_common_weak_passwords`), and must mix at
        least three of: lowercase, uppercase, digit, symbol. This check is
        skipped for a generated password.

        The username/password fields are named `requested_username` /
        `requested_password` rather than `username`/`password` deliberately:
        CoCart Starter's authentication layer treats any request containing
        non-empty `username`/`password` fields as a Basic Auth attempt, which
        would collide with (and reject) this endpoint's own registration fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  description: Customers email address. Required and must not already be registered.
                  type: string
                  format: email
                requested_username:
                  description: Customers requested username. Optional when WooCommerce is set to generate usernames from the email address.
                  type: string
                requested_password:
                  description: Customers requested password. Optional when WooCommerce is set to generate passwords automatically.
                  type: string
              required:
                - email
            example:
              email: jane.doe@example.com
              requested_username: janedoe
              requested_password: hunter2-Str0ng!
      responses:
        '200':
          description: Customer registered successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredCustomer'
              examples:
                password_provided:
                  summary: Password provided
                  value:
                    user_id: 43
                    username: janedoe
                    message: Your account was created successfully. Your login details have been sent to your email address.
                password_generated:
                  summary: Password generated
                  value:
                    user_id: 43
                    username: janedoe
                    message: Your account was created successfully and a password has been sent to your email address.
        '400':
          description: Bad request - reserved username, weak password, or account creation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                reserved_username:
                  summary: Username is reserved
                  value:
                    code: cocart_registration_error_reserved_username
                    message: This username cannot be registered. Please choose another.
                    data:
                      status: 400
                weak_password:
                  summary: Password is too weak
                  value:
                    code: cocart_registration_error_weak_password
                    message: This password is too weak. Please choose a stronger password.
                    data:
                      status: 400
                creation_failed:
                  summary: Account creation failed (message varies)
                  value:
                    code: cocart_registration_error_failed_creation
                    message: Registration is currently not allowed.
                    data:
                      status: 400
        '404':
          description: Not found - invalid email, invalid username or missing password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_email:
                  summary: Invalid email
                  value:
                    code: cocart_registration_invalid_email
                    message: A valid email address is required!
                    data:
                      status: 404
                invalid_username:
                  summary: Invalid username
                  value:
                    code: cocart_registration_error_invalid_username
                    message: Please provide a valid username.
                    data:
                      status: 404
                missing_password:
                  summary: Missing password
                  value:
                    code: registration-error-missing-password
                    message: Please enter an account password.
                    data:
                      status: 404
        '405':
          description: Not allowed - the email address or username is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                email_exists:
                  summary: Email already registered
                  value:
                    code: cocart_registration_error_email_exists
                    message: An account is already registered with your email address.
                    data:
                      status: 405
                username_exists:
                  summary: Username already registered
                  value:
                    code: cocart_registration_error_username_exists
                    message: An account is already registered with that username. Please choose another.
                    data:
                      status: 405
  /order-withdrawal:
    post:
      tags:
        - orders
      summary: Submit order withdrawal request
      description: |
        Submits a public, no-login order withdrawal (right-of-withdrawal)
        request. Reimplements WooCommerce 11.1+'s own My Account →
        /withdraw-order/ form as a REST endpoint, since that form reads
        $_POST/$_SERVER directly and requires a nonce tied to its own HTML
        page, so it can't be called headlessly. Requires WooCommerce's
        `order_withdrawal` feature (WooCommerce > Settings > Advanced >
        Features) to be enabled.

        This is a low-friction request/inquiry, not a direct order mutation -
        a match against an existing order only results in an order note, a
        WooCommerce Admin inbox note and two notification emails (a customer
        acknowledgement and a merchant notification); it never changes the
        order's status. The response is deliberately identical whether or not
        a matching order was found, mirroring WooCommerce's own confirmation
        screen, which never discloses match/no-match status to the submitter.

        An order is matched by comparing the submitted `order_number` (a
        leading `#` is stripped) and `email` against existing orders.
        Submissions are rate limited to one every 30 seconds per IP address
        and per email address. Resubmitting for an order that already has a
        pending withdrawal request is rejected and does not count against the
        rate limit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  description: First name of the person requesting the withdrawal.
                  type: string
                last_name:
                  description: Last name of the person requesting the withdrawal.
                  type: string
                email:
                  description: Email address to match against the order and to send the acknowledgement to.
                  type: string
                  format: email
                email_confirmation:
                  description: Confirmation of the email address. Must match the `email` field.
                  type: string
                  format: email
                order_number:
                  description: The order number to withdraw from.
                  type: string
                withdrawal_type:
                  description: Whether to withdraw the full order or specific items only.
                  type: string
                  enum:
                    - full_order
                    - specific_items_only
                  default: full_order
                additional_details:
                  description: Additional details about the withdrawal. Required when `withdrawal_type` is `specific_items_only`.
                  type: string
              required:
                - first_name
                - last_name
                - email
                - email_confirmation
                - order_number
            example:
              first_name: Jane
              last_name: Doe
              email: jane.doe@example.com
              email_confirmation: jane.doe@example.com
              order_number: '1234'
              withdrawal_type: full_order
      responses:
        '200':
          description: Withdrawal request submitted. Returned identically whether or not a matching order was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderWithdrawalResult'
              example:
                success: true
                email: jane.doe@example.com
        '400':
          description: Bad request - a required field is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_first_name:
                  summary: First name missing
                  value:
                    code: cocart_order_withdrawal_missing_first_name
                    message: First name is required.
                    data:
                      status: 400
                missing_last_name:
                  summary: Last name missing
                  value:
                    code: cocart_order_withdrawal_missing_last_name
                    message: Last name is required.
                    data:
                      status: 400
                invalid_email:
                  summary: Email missing or invalid
                  value:
                    code: cocart_order_withdrawal_invalid_email
                    message: Please enter a valid email address.
                    data:
                      status: 400
                missing_email_confirmation:
                  summary: Email confirmation missing
                  value:
                    code: cocart_order_withdrawal_missing_email_confirmation
                    message: Please confirm your email address.
                    data:
                      status: 400
                email_mismatch:
                  summary: Email and confirmation do not match
                  value:
                    code: cocart_order_withdrawal_email_mismatch
                    message: Email addresses do not match.
                    data:
                      status: 400
                missing_order_number:
                  summary: Order number missing
                  value:
                    code: cocart_order_withdrawal_missing_order_number
                    message: Order number is required.
                    data:
                      status: 400
                invalid_type:
                  summary: Withdrawal type is not one of the accepted values
                  value:
                    code: cocart_order_withdrawal_invalid_type
                    message: Choose what you want to withdraw.
                    data:
                      status: 400
                missing_additional_details:
                  summary: Additional details missing for a specific-items withdrawal
                  value:
                    code: cocart_order_withdrawal_missing_additional_details
                    message: Please list the specific items you want to withdraw.
                    data:
                      status: 400
        '404':
          description: Not found - order withdrawal is not available on this store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: cocart_order_withdrawal_unavailable
                message: Order withdrawal is not available on this store.
                data:
                  status: 404
        '409':
          description: Conflict - a withdrawal request has already been submitted for the matched order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: cocart_order_withdrawal_already_requested
                message: A withdrawal request has already been submitted for this order. Please contact us if you need help or want to make changes.
                data:
                  status: 409
        '429':
          description: Too Many Requests - rate limited by IP address or email address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: cocart_order_withdrawal_rate_limited
                message: Please wait before submitting another withdrawal request.
                data:
                  status: 429
        '500':
          description: Internal server error - the rate limit could not be applied, or the notification emails could not be sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: cocart_order_withdrawal_failed
                message: We could not submit your withdrawal request. Please try again or contact us if the problem continues.
                data:
                  status: 500
  /batch:
    servers:
      - url: "{protocol}://{host}/wp-json/cocart"
        description: The batch route is outside the versioned namespace.
        variables:
          protocol:
            enum:
              - http
              - https
            default: https
          host:
            default: example.com
    post:
      tags:
        - batch
      summary: Run several requests in one
      description: |
        Runs up to 25 CoCart requests (filterable up to 50 with `cocart_get_max_batch_size`) in one HTTP request.

        When every request is a cart route (`/cocart/v2/cart…`), the response is **one cart**: the cart returned by the last request that succeeded, with the notices of every request merged into its `notices`. A request that failed is reported as an `error` notice instead, so the client reads one up-to-date cart. A `cart_key` sent with the batch applies to every request in it.

        If every cart request fails, or the batch includes other routes, or a request fails schema validation with `validation: require-all-validate`, the response is WordPress's standard batch envelope: one entry per request with its own `status`, `headers` and `body` (207 when the statuses differ). `require-all-validate` checks request schemas only: errors raised while a request runs don't stop the others.
      parameters:
        - name: cart_key
          in: query
          required: false
          description: Cart key applied to every cart request in the batch.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - requests
              properties:
                validation:
                  type: string
                  enum:
                    - normal
                    - require-all-validate
                  default: normal
                requests:
                  type: array
                  maxItems: 25
                  items:
                    type: object
                    required:
                      - path
                    properties:
                      method:
                        type: string
                        enum:
                          - GET
                          - POST
                          - PUT
                          - PATCH
                          - DELETE
                        default: POST
                      path:
                        type: string
                        description: Route with a leading slash, e.g. `/cocart/v2/cart/add-item`. API v1 routes are refused.
                      body:
                        type: object
                        additionalProperties: true
                      headers:
                        type: object
                        additionalProperties:
                          oneOf:
                            - type: string
                            - type: array
                              items:
                                type: string
            example:
              requests:
                - method: POST
                  path: /cocart/v2/cart/add-item
                  body:
                    id: "154"
                    quantity: "1"
                - method: POST
                  path: /cocart/v2/cart/apply-coupon
                  body:
                    code: save10
      responses:
        "200":
          description: "Every request was a cart route and at least one succeeded: the cart after the batch, with failed requests as `error` notices."
          content:
            application/json:
              schema:
                type: object
                description: A cart response, as `GET /cocart/v2/cart` returns it.
                additionalProperties: true
              example:
                cart_key: t_d8f5452294c521ed95f41f90b8768d
                item_count: 1
                items: []
                notices:
                  error:
                    "1": Coupon "save1o" does not exist!
        "207":
          description: "The standard batch envelope: one result per request."
          content:
            application/json:
              schema:
                type: object
                properties:
                  failed:
                    type: string
                    description: "`validation` when a request failed schema validation under `require-all-validate`; nothing ran."
                  responses:
                    type: array
                    items:
                      type: object
                      properties:
                        status:
                          type: integer
                        headers:
                          type: object
                          additionalProperties: true
                        body: {}
        "400":
          description: "Invalid batch: more requests than allowed, or an API v1 path (`cocart_rest_invalid_path`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: cocart_rest_invalid_path
                message: Invalid path provided.
                data:
                  status: 400
components:
  headers:
    ETagHeader:
      description: |
        Weak ETag cache validation token. Format: W/"<md5hash>". Use in If-None-Match on subsequent requests for conditional requests.
      schema:
        type: string
        pattern: ^W/"[a-f0-9]{32}"$
        example: W/"d41d8cd98f00b204e9800998ecf8427e"
    CoCartCacheHeader:
      description: |
        ETag cache status: HIT (304 returned), MISS (fresh response), SKIP (_skip_cache used).
      schema:
        type: string
        enum:
          - HIT
          - MISS
          - SKIP
        example: MISS
    GeoCountry:
      description: The geolocated country name of the customer. Only sent when the geolocation feature is enabled.
      schema:
        type: string
        example: United States
    GeoCountryCode:
      description: The geolocated two-letter country code of the customer. Only sent when the geolocation feature is enabled.
      schema:
        type: string
        example: US
    GeoRegion:
      description: The geolocated region of the customer. Only sent when the geolocation feature is enabled.
      schema:
        type: string
        example: California
    GeoTimezone:
      description: The geolocated timezone of the customer. Only sent when the geolocation feature is enabled.
      schema:
        type: string
        example: America/Los_Angeles
    RateLimitLimit:
      description: The maximum number of requests allowed in the current rate limit window. Only sent when rate limiting is enabled. Exposed to cross-origin requests.
      schema:
        type: integer
        example: 25
    RateLimitRemaining:
      description: The number of requests remaining in the current rate limit window. Only sent when rate limiting is enabled. Exposed to cross-origin requests.
      schema:
        type: integer
        example: 24
    RateLimitReset:
      description: Unix timestamp when the current rate limit window resets. Only sent when rate limiting is enabled. Exposed to cross-origin requests.
      schema:
        type: integer
        example: 1767225600
  parameters:
    CartKey:
      name: cart_key
      in: query
      description: Unique identifier for the cart/customer.
      required: false
      schema:
        type: string
    Fields:
      name: fields
      in: query
      description: Specify each parent field you want to request separated by (,) in the response before the data is fetched.
      required: false
      schema:
        type: string
    Thumb:
      name: thumb
      in: query
      description: True if you want to return the URL of the featured product image for each item in the cart.
      required: false
      schema:
        type: boolean
        default: true
    DefaultCart:
      name: default
      in: query
      description: Return the default cart data if set to true.
      required: false
      schema:
        type: boolean
        default: false
    Formatted:
      name: formatted
      in: query
      description: Returns price values as a formatted string (e.g. "$18.00") when true. Defaults to false, returning raw numeric values (e.g. 1800).
      required: false
      schema:
        type: boolean
        default: false
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: |
        Conditional request header. Send previous ETag value; server returns 304 Not Modified if resource unchanged.
      required: false
      schema:
        type: string
        example: W/"d41d8cd98f00b204e9800998ecf8427e"
    SkipCache:
      name: _skip_cache
      in: query
      description: |
        Set to true or 1 to bypass ETag checking. Forces full response with CoCart-Cache: SKIP header.
      required: false
      schema:
        type: string
        enum:
          - 'true'
          - '1'
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        Basic authentication with username and password.

        Since CoCart v4.9.0, if an `X-HTTP-Method-Override` header is present, it is honored
        when determining the request method during authentication (e.g. credentials sent in a
        JSON body are still detected when the original method is tunneled through POST).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer token authentication (JWT). Optional for cart endpoints.
        When provided by customers, enables enhanced functionality like persistent carts and user-specific data.
  schemas:
    MiniCart:
      type: object
      description: Lightweight cart object scoped to the fields needed to render a mini cart.
      properties:
        cart_hash:
          type: string
          nullable: true
          description: A unique hash key of the cart contents.
        cart_key:
          type: string
          description: The cart key identifying the cart in session.
        currency:
          $ref: '#/components/schemas/Currency'
        item_count:
          type: integer
          description: The number of items in the cart.
        items:
          type: array
          description: The items in the cart.
          items:
            $ref: '#/components/schemas/MiniCartItem'
        subtotal:
          type: string
          description: The cart subtotal. Raw numeric string (e.g. "3600") by default; formatted string (e.g. "$36.00") when `formatted=true`.
    MiniCartItem:
      type: object
      properties:
        item_key:
          type: string
          description: Unique identifier for the item within the cart.
        id:
          type: integer
          description: Product ID.
        name:
          type: string
          description: Product name.
        price:
          type: string
          description: Product price. Raw numeric string (e.g. "1800") by default; formatted string (e.g. "$18.00") when `formatted=true`.
        quantity:
          type: number
          description: Quantity of the item in the cart.
        variation:
          description: Variation attributes for the item.
          oneOf:
            - type: object
              additionalProperties:
                type: string
            - type: array
              items:
                type: string
        cart_item_data:
          type: object
          description: Additional cart item data.
          additionalProperties: true
        featured_image:
          type: string
          format: uri
          description: Product featured image URL.
    AppliedCouponDetailed:
      type: object
      description: A coupon applied to the cart with its discount totals.
      properties:
        coupon:
          type: string
          description: Coupon code.
        label:
          type: string
          description: Human-readable coupon label.
        discount_type:
          type: string
          description: Type of discount applied (e.g. percent, fixed_cart, fixed_product).
        totals:
          type: object
          properties:
            discount:
              type: string
              description: Total discounted by this coupon as a raw numeric string (e.g. "360").
            discount_tax:
              type: string
              description: Total discounted tax by this coupon as a raw numeric string.
    CartV2:
      type: object
      description: Complete cart object with enhanced v2 structure. CoCart Plus adds the `meta` property.
      properties:
        cart_hash:
          type: string
          description: Unique cart hash.
        cart_key:
          type: string
          description: Unique cart key for the customer.
        currency:
          $ref: '#/components/schemas/Currency'
        customer:
          $ref: '#/components/schemas/Customer'
        items:
          type: array
          description: Items in the cart.
          items:
            $ref: '#/components/schemas/CartItem'
        item_count:
          type: integer
          description: Total number of items in cart.
        items_weight:
          type: number
          description: Total weight of all items.
        coupons:
          type: array
          description: Applied coupons.
          items:
            $ref: '#/components/schemas/AppliedCoupon'
        needs_payment:
          type: boolean
          description: Whether the cart needs payment.
        needs_shipping:
          type: boolean
          description: Whether the cart needs shipping.
        shipping:
          $ref: '#/components/schemas/Shipping'
        fees:
          description: Fees added to the cart, keyed by fee ID. `{}` when there are none.
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CartFee"
        taxes:
          type: array
          description: Cart taxes.
          items:
            $ref: '#/components/schemas/CartTax'
        totals:
          $ref: '#/components/schemas/CartTotals'
        removed_items:
          type: array
          description: Recently removed items that can be restored.
          items:
            $ref: '#/components/schemas/RemovedItem'
        cross_sells:
          type: array
          description: Cross-sell products.
          items:
            $ref: '#/components/schemas/CrossSellItem'
        notices:
          type: object
          description: Cart notices and messages.
          additionalProperties: true
        meta:
          type: object
          description: Cart meta data stored in session. Added by CoCart Plus.
          additionalProperties: true
        extensions:
          $ref: '#/components/schemas/CartExtensions'
    CartExtensions:
      description: Data added to the cart by extensions (`cocart_cart_extensions`). `{}` when there is none. CoCart Plus adds the keys below, each only when its plugin is active and it applies; other plugins can add their own.
      type: object
      properties:
        points_and_rewards:
          description: 'Points and Rewards for the cart. Plugin: WooCommerce Points and Rewards.'
          type: object
          properties:
            points_balance:
              description: Points balance of the customer.
              type: integer
            points_to_earn:
              description: Points the cart earns.
              type: integer
            redemption_coupon:
              description: Points redemption coupon applied, or empty.
              type: string
        recurring_totals:
          description: 'Recurring totals for each subscription in the cart, keyed by its item key. Plugins: WooCommerce Subscriptions, Milo Subscriptions.'
          type: object
          additionalProperties:
            type: object
            properties:
              coupons:
                description: Coupons applied to the recurring cart (not Milo Subscriptions).
                type: array
                items:
                  $ref: '#/components/schemas/AppliedCoupon'
              shipping:
                description: Shipping of the recurring cart (not Milo Subscriptions).
                allOf:
                  - $ref: '#/components/schemas/Shipping'
              fees:
                description: Fees of the recurring cart, keyed by fee ID (not Milo Subscriptions).
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/CartFee'
              taxes:
                description: Taxes of the recurring cart (not Milo Subscriptions).
                type: array
                items:
                  $ref: '#/components/schemas/CartTax'
              totals:
                description: Recurring totals.
                type: object
                properties:
                  period:
                    description: Billing period, e.g. "/ month".
                    type: string
                  subtotal:
                    description: Recurring subtotal, in minor units (formatted for display with `formatted=true`).
                    type: string
                  total:
                    description: Recurring total, in minor units (formatted for display with `formatted=true`).
                    type: string
                  label:
                    description: Recurring total as WooCommerce displays it (not Milo Subscriptions).
                    type: string
                  first_renewal:
                    description: First renewal.
                    type: object
                    properties:
                      date:
                        description: GMT date (Y-m-d H:i:s), or 0 when there is no renewal.
                        oneOf:
                          - type: string
                          - type: integer
                      formatted_date:
                        description: Date formatted for display.
                        type: string
                      labelled:
                        description: First renewal, ready to display.
                        type: string
      additionalProperties: true
    CartItem:
      type: object
      properties:
        item_key:
          type: string
          description: Unique identifier for the item within the cart.
        id:
          type: integer
          description: Product ID.
        name:
          type: string
          description: Product name.
        title:
          type: string
          description: Product title.
        price:
          type: string
          description: Current product price. Raw numeric value (e.g. "1800") by default; formatted string (e.g. "$18.00") when the `formatted` query parameter is true.
        quantity:
          type: object
          description: Quantity information for this item.
          properties:
            value:
              type: number
              description: Current quantity of the item in the cart.
            minimum:
              type: number
              description: The minimum purchase amount required.
            maximum:
              type: number
              description: The maximum purchase amount allowed. If -1 the item has an unlimited purchase amount.
            multiple_of:
              type: number
              description: The quantity must be a multiple of this value.
            editable:
              type: boolean
              description: Whether the quantity of the item is editable.
        totals:
          type: object
          description: Item totals. All values are raw numeric strings (e.g. "3600") by default; formatted strings (e.g. "$36.00") when `formatted=true`.
          properties:
            subtotal:
              type: string
              description: Line subtotal (before discounts).
            subtotal_tax:
              type: string
              description: Line subtotal tax.
            total:
              type: string
              description: Line total (after discounts).
            tax:
              type: string
              description: Line total tax.
        slug:
          type: string
          description: Product slug.
        meta:
          type: object
          description: Item metadata.
          properties:
            product_type:
              type: string
              description: Product type.
            sku:
              type: string
              description: Product SKU.
            dimensions:
              type: object
              description: Product dimensions.
              properties:
                length:
                  type: string
                  description: Product length.
                width:
                  type: string
                  description: Product width.
                height:
                  type: string
                  description: Product height.
                unit:
                  type: string
                  description: Dimension unit.
            weight:
              type: string
              description: Product weight.
            variation:
              description: Chosen attributes (for variations).
              oneOf:
                - type: object
                  additionalProperties:
                    type: string
                - type: array
                  items:
                    type: string
          additionalProperties: true
        backorders:
          type: string
          description: Backorder status.
        cart_item_data:
          type: object
          description: Custom cart item data.
          additionalProperties: true
        featured_image:
          type: string
          description: Product featured image URL.
        extensions:
          $ref: '#/components/schemas/CartItemExtensions'
    CartItemExtensions:
      description: Data added to a cart item by extensions (`cocart_cart_item_extensions`). `{}` when there is none. CoCart Plus adds the keys below, each only when its plugin is active and it applies to the item; other plugins can add their own.
      type: object
      properties:
        accommodation_booking_data:
          description: 'Accommodation booking check-in and check-out information for the cart item. Plugin: WooCommerce Accommodation Bookings.'
          type: object
          properties:
            check_in:
              description: Check-in date and time.
              type: string
            check_out:
              description: Check-out date and time.
              type: string
        addons:
          description: 'Add-on selections made by the customer for this cart item. Plugin: WooCommerce Product Add-Ons.'
          type: array
          items:
            type: object
            properties:
              field_label:
                description: The add-on field label.
                type: string
              field_type:
                description: The add-on field type (e.g. custom_text, multiple_choice, file_upload).
                type: string
              value:
                description: The selected or entered value, pre-formatted for display.
                type: string
              price:
                description: Price contribution of this selection.
                type: string
              price_type:
                description: 'Price type: flat_fee, quantity_based, or percentage_based.'
                type: string
        adp:
          description: 'Discount applied to this cart item by Advanced Dynamic Pricing. Plugin: Advanced Dynamic Pricing for WooCommerce.'
          type: object
          properties:
            original_price:
              description: Original per-unit price before discount.
              type: string
            saved_amount:
              description: Amount saved on this line by the matched rule(s).
              type: string
            is_free_item:
              description: Whether this item was added free by a Buy X Get Y rule.
              type: boolean
            rules:
              description: Names of the pricing rules that matched this cart item.
              type: array
              items:
                type: string
        booking_data:
          description: 'Booking configuration for the cart item. Plugin: WooCommerce Bookings.'
          type: object
          properties:
            start_date:
              description: Booking start date and time.
              type: string
            end_date:
              description: Booking end date and time.
              type: string
            all_day:
              description: Whether the booking spans the full day.
              type: boolean
            resource_id:
              description: Resource ID assigned to the booking.
              type: integer
            persons:
              description: Person counts per type for the booking.
              type: array
              items:
                type: integer
            cost:
              description: Calculated booking cost in the smallest currency unit.
              type: string
        bundle_data:
          description: 'Bundle configuration for the cart item. Plugin: WooCommerce Product Bundles.'
          type: object
          properties:
            items:
              description: Normalised bundle stamp keyed by bundled item ID.
              type: object
              additionalProperties:
                type: object
                properties:
                  id:
                    description: Selected product or variation ID.
                    type: integer
                  quantity:
                    description: Quantity information.
                    type: object
                    properties:
                      value:
                        description: Quantity value.
                        type: integer
                      minimum:
                        description: Minimum quantity.
                        type: integer
                      maximum:
                        description: Maximum quantity.
                        type: integer
                  variation:
                    description: Selected variation attributes.
                    type: object
                    additionalProperties:
                      type: string
                  discount:
                    description: Discount applied to this item, or null if none.
                    type: number
                    nullable: true
                  optional_selected:
                    description: Whether the customer included this optional item.
                    type: boolean
            child_items:
              description: Summary of bundled child items nested under this container.
              type: array
              items:
                type: object
                properties:
                  item_key:
                    description: Cart item key of the child item.
                    type: string
                  bundled_item_id:
                    description: Internal bundle definition ID for this child.
                    type: integer
                  id:
                    description: Product or variation ID.
                    type: integer
                  name:
                    description: Product name.
                    type: string
                  quantity:
                    description: Quantity information.
                    type: object
                    properties:
                      value:
                        description: Quantity value.
                        type: integer
                      minimum:
                        description: Minimum quantity.
                        type: integer
                      maximum:
                        description: Maximum quantity.
                        type: integer
                  price:
                    description: Unit price in the smallest currency unit.
                    type: string
                  variation:
                    description: Selected variation attributes.
                    type: object
                    additionalProperties:
                      type: string
            child_item_keys:
              description: Cart item keys of the bundled child items.
              type: array
              items:
                type: string
        composite_data:
          description: 'Composite product configuration for the cart item. Plugin: WooCommerce Composite Products.'
          type: object
          properties:
            components:
              description: Component configuration indexed by component ID.
              type: object
              additionalProperties:
                type: object
                properties:
                  id:
                    description: Selected product or variation ID for this component.
                    type: integer
                  quantity:
                    description: Quantity information for this component.
                    type: object
                    properties:
                      value:
                        description: Quantity selected for this component.
                        type: integer
                      minimum:
                        description: Minimum quantity allowed for this component.
                        type: integer
                      maximum:
                        description: Maximum quantity allowed for this component, or null if unlimited.
                        type: integer
                        nullable: true
                  variation:
                    description: Selected variation attributes for this component.
                    type: object
                    additionalProperties:
                      type: string
                  discount:
                    description: Discount applied to this component, or null if none.
                    type: number
                    nullable: true
                  optional:
                    description: Whether this component is optional.
                    type: boolean
                  priced_individually:
                    description: Whether this component is priced individually.
                    type: boolean
                  shipped_individually:
                    description: Whether this component is shipped individually.
                    type: boolean
                  title:
                    description: Component title.
                    type: string
            child_item_keys:
              description: Cart item keys of the composited child items.
              type: array
              items:
                type: string
        discount:
          description: 'Discount applied to this cart item. Plugin: Discount Rules for WooCommerce.'
          type: object
          properties:
            original_price:
              description: Original per-unit price before discount.
              type: string
            saved_amount:
              description: Amount saved on this line by the active rule.
              type: string
            is_free_item:
              description: Whether this item was added free by a Buy X Get Y rule.
              type: boolean
        gift_recipient:
          description: 'Gift recipient for this subscription cart item, set with `recipient_email` on `POST /cart/add-item`. Plugin: WooCommerce Subscriptions gifting.'
          type: object
          properties:
            email:
              description: Email address of the gift recipient.
              type: string
              format: email
        subscription_data:
          description: 'Subscription data (if any) for the item in the cart. Plugins: WooCommerce Subscriptions, Milo Subscriptions.'
          type: object
          properties:
            billing_period:
              description: Subscription billing period.
              type: object
              properties:
                interval:
                  description: Subscription billing interval.
                  oneOf:
                    - type: string
                    - type: integer
                period:
                  description: Subscription billing period.
                  type: string
                length:
                  description: Subscription billing length.
                  oneOf:
                    - type: string
                    - type: integer
                trial_period:
                  description: Subscription billing trial period.
                  type: string
                trial_length:
                  description: Subscription billing trial length.
                  oneOf:
                    - type: string
                    - type: integer
                trial_expiration_date:
                  description: 'When the free trial ends: GMT date (Y-m-d H:i:s) for a subscription started now, or 0 when there is no trial.'
                  oneOf:
                    - type: string
                    - type: integer
                expiration_date:
                  description: 'When the subscription ends: GMT date (Y-m-d H:i:s) for a subscription started now, or 0 when it never expires.'
                  oneOf:
                    - type: string
                    - type: integer
            sign_up_fee:
              description: Subscription sign up fee.
              type: string
            pay_now:
              description: Subscription amount to pay now.
              type: string
            needs_one_time_shipping:
              description: Does the subscription only require shipping once?
              type: boolean
            price_string:
              description: The price of the subscription.
              type: string
            first_renewal:
              description: The subscriptions date and time of the first renewal.
              type: object
              properties:
                date:
                  description: 'First renewal: GMT date (Y-m-d H:i:s) for a subscription started now, or 0 when there is no renewal.'
                  oneOf:
                    - type: string
                    - type: integer
                timestamp:
                  description: First renewal timestamp.
                  type: integer
                html:
                  description: First renewal string.
                  type: string
        subscription_schemes:
          description: 'Purchase options for this cart item: one-time and/or subscription plans, with the current one selected. Listed only when there is a choice. Plugin: All Products for WooCommerce Subscriptions.'
          type: array
          items:
            type: object
            properties:
              price:
                description: Scheme price.
                type: string
              period:
                description: Scheme billing period label.
                type: string
              value:
                description: 'Scheme key: send it as `convert_to_sub` with `namespace` `update-item-schema` and the `item_key` to `POST /cart/update` to switch the item to this option ("0" for one-time).'
                type: string
              selected:
                description: Whether this scheme is currently selected.
                type: boolean
              rest_url:
                description: Ready-made request to switch the item to this option (`POST`).
                type: string
        warranty:
          description: 'Warranty selected for this cart item. Plugin: WooCommerce Warranty.'
          type: object
          properties:
            label:
              description: Warranty label.
              type: string
            type:
              description: 'Warranty type: included or addon.'
              type: string
            duration:
              description: Human-readable warranty duration.
              type: string
            cost:
              description: Additional cost for this warranty.
              type: string
      additionalProperties: true
    Currency:
      type: object
      properties:
        currency_code:
          type: string
          description: Currency code.
        currency_symbol:
          type: string
          description: Currency symbol.
        currency_symbol_pos:
          type: string
          description: Currency symbol position.
        currency_minor_unit:
          type: integer
          description: Currency minor unit.
        currency_decimal_separator:
          type: string
          description: Currency decimal separator.
        currency_thousand_separator:
          type: string
          description: Currency thousand separator.
        currency_prefix:
          type: string
          description: Currency prefix.
        currency_suffix:
          type: string
          description: Currency suffix.
    Customer:
      type: object
      properties:
        billing_address:
          $ref: '#/components/schemas/BillingAddress'
        shipping_address:
          $ref: '#/components/schemas/ShippingAddress'
    BillingAddress:
      type: object
      properties:
        billing_first_name:
          type: string
        billing_last_name:
          type: string
        billing_company:
          type: string
        billing_country:
          type: string
        billing_address_1:
          type: string
        billing_address_2:
          type: string
        billing_postcode:
          type: string
        billing_city:
          type: string
        billing_state:
          type: string
        billing_phone:
          type: string
        billing_email:
          type: string
    ShippingAddress:
      type: object
      properties:
        shipping_first_name:
          type: string
        shipping_last_name:
          type: string
        shipping_company:
          type: string
        shipping_country:
          type: string
        shipping_address_1:
          type: string
        shipping_address_2:
          type: string
        shipping_postcode:
          type: string
        shipping_city:
          type: string
        shipping_state:
          type: string
    Shipping:
      type: object
      properties:
        total_packages:
          type: integer
          description: Number of shipping packages.
        show_package_details:
          type: boolean
          description: Whether to show package details.
        has_calculated_shipping:
          type: boolean
          description: Whether shipping has been calculated.
        packages:
          type: object
          description: Shipping packages.
          additionalProperties:
            $ref: '#/components/schemas/ShippingPackage'
    ShippingPackage:
      type: object
      properties:
        package_name:
          type: string
          description: Package name.
        rates:
          type: object
          description: Available shipping rates.
          additionalProperties:
            $ref: '#/components/schemas/ShippingRate'
        package_details:
          type: string
          description: Package details.
        index:
          type: integer
          description: Package index.
        chosen_method:
          type: string
          description: Chosen shipping method.
        formatted_destination:
          type: string
          description: Formatted destination address.
    ShippingRate:
      type: object
      properties:
        key:
          type: string
        method_id:
          type: string
        instance_id:
          type: integer
        label:
          type: string
        cost:
          type: string
          description: The rate cost. In minor units (e.g. `"1800"` for 18.00), or formatted (e.g. `"$18.00"`) when requested with `formatted`.
        html:
          type: string
        taxes:
          type: string
          description: The rate tax cost, all of its taxes added together. In minor units (e.g. `"1800"` for 18.00), or formatted (e.g. `"$18.00"`) when requested with `formatted`.
        chosen_method:
          type: boolean
    CartTotals:
      type: object
      description: All monetary values are raw numeric strings (e.g. "1800") by default. Pass `formatted=true` to receive formatted strings (e.g. "$18.00").
      properties:
        subtotal:
          type: string
          description: Cart subtotal.
        subtotal_tax:
          type: string
          description: Cart subtotal tax.
        shipping_total:
          type: string
          description: Shipping total.
        shipping_tax:
          type: string
          description: Shipping tax.
        shipping_taxes:
          type: array
          items:
            type: number
        discount_total:
          type: string
          description: Discount total.
        discount_tax:
          type: string
          description: Discount tax.
        cart_contents_total:
          type: string
          description: Cart contents total.
        cart_contents_tax:
          type: string
          description: Cart contents tax.
        cart_contents_taxes:
          type: array
          items:
            type: number
        fee_total:
          type: string
          description: Fee total.
        fee_tax:
          type: string
          description: Fee tax.
        fee_taxes:
          type: array
          items:
            type: number
        total:
          type: string
          description: Cart total.
        total_tax:
          type: string
          description: Total tax.
    CartFee:
      type: object
      description: A fee added to the cart.
      properties:
        name:
          type: string
          description: Fee name.
        fee:
          type: string
          description: Fee amount, including tax when the store displays prices including tax. In minor units (e.g. `"1800"` for 18.00), or formatted (e.g. `"$18.00"`) when requested with `formatted`.
    CartTax:
      type: object
      description: |
        Tax entry. Structure depends on the WooCommerce tax display setting:
        - Non-itemized: `{ label, total }` — a single combined tax line.
        - Itemized: `{ name, price }` — one entry per tax rate.
      properties:
        label:
          type: string
          description: Tax label (non-itemized mode).
        total:
          type: string
          description: Combined tax total as raw numeric string, e.g. "1310" (non-itemized mode). Formatted string when `formatted=true`.
        name:
          type: string
          description: Tax rate name (itemized mode).
        price:
          type: string
          description: Tax amount as raw numeric string (itemized mode). Formatted string when `formatted=true`.
    AppliedCoupon:
      type: object
      properties:
        coupon:
          type: string
          description: Coupon code.
        label:
          type: string
          description: Human-readable coupon label.
        discount_type:
          type: string
          description: Type of discount applied (e.g. percent, fixed_cart, fixed_product).
        saving:
          type: string
          description: Amount saved by this coupon, as a negative amount (e.g. `-180`, in the currency's minor units).
        saving_html:
          type: string
          description: Amount saved by this coupon, formatted for display without a sign (e.g. `$1.80`). `saving` carries the negative sign.
    RemovedItem:
      type: object
      properties:
        key:
          type: string
        product_id:
          type: integer
        quantity:
          type: integer
        name:
          type: string
    CrossSellItem:
      type: object
      properties:
        id:
          type: integer
        product_name:
          type: string
        product_title:
          type: string
        price:
          type: string
          description: Current price. Raw numeric string (e.g. "1800") by default; formatted string (e.g. "$18.00") when `formatted=true`.
        regular_price:
          type: string
          description: Regular price. Raw numeric string by default; formatted when `formatted=true`.
        sale_price:
          type: string
          description: Sale price if on sale, otherwise empty string. Raw numeric string by default; formatted when `formatted=true`.
        product_image:
          type: string
    ErrorResponse:
      type: object
      description: Standard error response structure.
      properties:
        code:
          type: string
          description: Machine-readable error code.
          example: cocart_invalid_parameter
        message:
          type: string
          description: Human-readable error message.
          example: Invalid parameter provided.
        data:
          type: object
          description: Additional error data.
          properties:
            status:
              type: integer
              description: HTTP status code.
              example: 400
          additionalProperties: true
    ProductShippingRates:
      type: object
      description: Shipping rates calculated for a product.
      properties:
        item_key:
          type: string
          description: The cart item key generated from the product, variation and item data.
        id:
          type: integer
          description: Product ID.
        parent_id:
          type: integer
          description: Parent product ID. 0 when the product has no parent.
        name:
          type: string
          description: Product name.
        type:
          type: string
          description: Product type (e.g. simple, variable, variation).
        item_match:
          type: boolean
          description: Whether the generated item key matched the cart item key during simulation.
        packages:
          type: object
          description: Shipping packages keyed by package number, each containing the available rates.
          additionalProperties:
            $ref: '#/components/schemas/ShippingRatesPackage'
    ShippingRatesPackage:
      type: object
      properties:
        rates:
          type: object
          description: Available shipping rates keyed by rate key.
          additionalProperties:
            $ref: '#/components/schemas/ProductShippingRate'
        formatted_destination:
          type: string
          description: Formatted destination address the rates were calculated for.
    ProductShippingRate:
      type: object
      properties:
        key:
          type: string
          description: Rate key (e.g. "flat_rate:1").
        method_id:
          type: string
          description: Shipping method ID.
        instance_id:
          type: integer
          description: Shipping method instance ID.
        label:
          type: string
          description: Shipping method label.
        cost:
          type: string
          description: Shipping cost as a raw numeric string in the currency's smallest unit (e.g. "1000" = $10.00).
        html:
          type: string
          description: Shipping method label with cost, formatted without HTML tags.
        taxes:
          type: string
          description: Shipping tax amount as a raw numeric string. Empty string when no tax applies.
        meta_data:
          type: object
          description: Rate meta data (e.g. the items included in the package).
          additionalProperties: true
    Account:
      type: object
      description: The customer's account details.
      properties:
        user:
          type: object
          description: User account information.
          properties:
            id:
              type: integer
              description: Unique identifier for the user.
            date_registered:
              type: string
              format: date-time
              description: User registration date.
            email:
              type: string
              format: email
              description: Email address used when registered. May differ from the billing email address.
            first_name:
              type: string
              description: First name.
            last_name:
              type: string
              description: Last name.
            display_name:
              type: string
              description: Display name.
            addresses:
              type: object
              description: Customer addresses. The `shipping` address is only included when the store ships to an address other than billing.
              additionalProperties:
                $ref: '#/components/schemas/AccountAddress'
            orders_count:
              type: integer
              description: Total number of orders.
            total_spent:
              type: string
              description: Total amount spent, formatted without HTML.
            is_paying_customer:
              type: boolean
              description: Whether the customer has made any purchase.
            avatar_url:
              type: string
              format: uri
              description: Avatar URL.
        recent_order:
          type: object
          description: Most recent order information.
          properties:
            order_id:
              type: integer
              nullable: true
              description: Most recent order ID. Null when no order has been made.
            order_date:
              type: string
              nullable: true
              description: Most recent order date. Null when no order has been made.
            order_data:
              type: string
              format: uri
              description: Link to the order details endpoint. Empty string when no order has been made.
        meta:
          type: object
          description: Additional customer metadata.
          properties:
            is_customer_outside_base:
              type: boolean
              description: Whether the customer is outside the base location.
            is_vat_exempt:
              type: boolean
              description: Whether the customer is VAT exempt.
        extensions:
          type: object
          description: |
            Additional data added by third-party extensions via the
            `cocart_get_account_extensions` filter. Includes
            `email_verification.verified` (WooCommerce 11.0+ only) - whether
            the account email address has been confirmed via
            `POST /my-account/verify-order-email`.
          additionalProperties: true
    AccountUpdateResult:
      type: object
      description: The result of updating the customer's account details.
      properties:
        success:
          type: boolean
          description: Whether the account details were saved.
        email_verification_pending:
          type: boolean
          description: |
            True when an email address change was requested and is awaiting
            confirmation via `GET /my-account/verify-email` - the account's
            email address has not changed yet. False when there was no email
            change, or verification is disabled and the email updated immediately.
      required:
        - success
        - email_verification_pending
    VerifyEmailResult:
      type: object
      description: The result of confirming a pending email address change.
      properties:
        success:
          type: boolean
        email:
          type: string
          format: email
          description: The email address that was applied to the account.
      required:
        - success
        - email
    SendOrderEmailVerificationResult:
      type: object
      description: The result of requesting an order email verification.
      properties:
        success:
          type: boolean
        status:
          type: string
          description: |
            `sent` when a new verification email was minted and sent,
            `throttled` when a resend was requested within the 60 second
            rate-limit window and no new email was sent.
          enum:
            - sent
            - throttled
      required:
        - success
        - status
    VerifyOrderEmailResult:
      type: object
      description: The result of confirming ownership of the account email address.
      properties:
        success:
          type: boolean
        email:
          type: string
          format: email
          description: The account email address that was verified.
      required:
        - success
        - email
    AccountAddress:
      type: object
      properties:
        first_name:
          type: string
          description: First name.
        last_name:
          type: string
          description: Last name.
        company:
          type: string
          description: Company name.
        address_1:
          type: string
          description: Address line 1.
        address_2:
          type: string
          description: Address line 2.
        city:
          type: string
          description: City.
        state:
          type: string
          description: State/Province.
        postcode:
          type: string
          description: Postcode/ZIP.
        country:
          type: string
          description: Country code.
        email:
          type: string
          format: email
          description: Email address (billing only).
        phone:
          type: string
          description: Phone number (billing only).
    AccountAddressUpdateRequest:
      type: object
      description: |
        At least one of `billing_address` or `shipping_address` must be provided.
        Only the fields included in each address object are updated; omitted
        fields are left unchanged.
      properties:
        billing_address:
          type: object
          description: Billing address fields to update.
          additionalProperties: true
        shipping_address:
          type: object
          description: Shipping address fields to update.
          additionalProperties: true
    AccountAddressUpdateResult:
      type: object
      description: The result of updating the customer's saved address(es).
      properties:
        addresses:
          type: object
          description: The customer addresses after the update.
          additionalProperties:
            $ref: '#/components/schemas/AccountAddress'
      required:
        - addresses
    CancelOrderResult:
      type: object
      description: The result of cancelling an order.
      properties:
        success:
          type: boolean
          description: Whether the order was cancelled.
        order_id:
          type: integer
          description: Unique identifier for the order.
        order_status:
          type: string
          description: Order status after cancellation.
      required:
        - success
        - order_id
        - order_status
    CustomerDownload:
      type: object
      properties:
        product_name:
          type: string
          description: Product name.
        download_name:
          type: string
          description: Download name.
        file:
          type: string
          format: uri
          description: Download URL.
        downloads_remaining:
          type: string
          description: Number of downloads remaining, or the infinity symbol when unlimited.
        download_expires:
          type: string
          description: Download expiration date, or "Never".
    CustomerOrders:
      type: object
      description: Paginated list of customer orders.
      properties:
        orders:
          type: array
          description: List of customer orders.
          items:
            type: object
            properties:
              order_id:
                type: integer
                description: Unique identifier for the order.
              order_status:
                type: string
                description: Order status.
              order_date:
                type: string
                description: Order date.
              item_count:
                type: integer
                description: Number of items in the order (excluding refunded items).
              order_total:
                type: string
                description: Order total amount, formatted without HTML.
              order_actions:
                type: object
                description: Available actions for the order (e.g. view), each with a `url` and `label`.
                additionalProperties:
                  $ref: '#/components/schemas/OrderAction'
        pagination:
          type: object
          description: Pagination information. Links are only present when more pages are available.
          properties:
            previous:
              type: string
              format: uri
              description: Link to previous page.
            next:
              type: string
              format: uri
              description: Link to next page.
    OrderAction:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: URL to perform the action.
        label:
          type: string
          description: Human-readable action label.
    CustomerOrder:
      type: object
      description: A single customer order. Extendable via the `cocart_add_additional_single_order_fields` filter.
      properties:
        order_id:
          type: integer
          description: Unique identifier for the order.
        order_key:
          type: string
          description: Order key for verification, required to pay for the order.
        order_number:
          type: string
          description: Order number.
        order_parent:
          type: integer
          description: Parent order ID. 0 when the order has no parent.
        order_date:
          type: string
          description: Order date.
        order_status:
          type: string
          description: Order status.
        order_currency:
          type: string
          description: Order currency code.
        billing_address:
          type: string
          description: Formatted billing address as a single line.
        shipping_address:
          type: string
          description: Formatted shipping address as a single line.
        phone:
          type: string
          description: Billing phone number.
        email:
          type: string
          format: email
          description: Billing email address.
        ship_to_billing:
          type: boolean
          description: Whether the order needs a shipping address.
        items:
          type: array
          description: Order items.
          items:
            $ref: '#/components/schemas/OrderItem'
        totals:
          type: object
          description: Order totals rows keyed by total type (e.g. subtotal, shipping, payment_method, total), each with a `label` and `value`.
          additionalProperties:
            type: object
            properties:
              label:
                type: string
                description: Total row label.
              value:
                type: string
                description: Total row value, formatted without HTML.
        order_note:
          type: string
          description: Customer note left on the order.
        order_notes:
          type: array
          description: Order notes shared with the customer.
          items:
            type: object
            properties:
              date:
                type: string
                description: Note date.
              note:
                type: string
                description: Note content.
        downloads:
          type: array
          description: Downloadable items for the order. Empty when the order has no permitted downloads.
          items:
            $ref: '#/components/schemas/CustomerDownload'
        order_actions:
          type: object
          description: Available actions for the order (e.g. pay, cancel), each with a `url` and `label`.
          additionalProperties:
            $ref: '#/components/schemas/OrderAction'
    OrderItem:
      type: object
      properties:
        item_id:
          type: integer
          description: Order item ID.
        product_id:
          type: integer
          description: Product ID. Empty when the product no longer exists.
        variation_id:
          type: integer
          description: Variation ID. 0 when the item is not a variation.
        product_image:
          type: string
          format: uri
          description: Product featured image URL.
        product_name:
          type: string
          description: Product name.
        product_title:
          type: string
          description: Product title.
        product_type:
          type: string
          description: Product type.
        sku:
          type: string
          description: Product SKU.
        quantity:
          type: string
          description: Quantity ordered.
        subtotal:
          type: string
          description: Line subtotal, formatted without HTML.
        purchase_note:
          type: string
          description: Product purchase note. Only shown for completed and processing orders.
        refunded_qty:
          type: string
          description: Quantity refunded for this item.
        meta:
          type: object
          description: Formatted item meta data keyed by meta ID.
          additionalProperties: true
        link:
          type: string
          format: uri
          description: Link to the product endpoint. Empty when the product no longer exists.
    CustomerSubscriptions:
      type: object
      description: Paginated list of customer subscriptions.
      properties:
        subscriptions:
          type: array
          description: List of customer subscriptions.
          items:
            type: object
            properties:
              subscription_id:
                type: integer
                description: Unique identifier for the subscription.
              subscription_number:
                type: string
                description: Subscription number.
              subscription_status:
                type: string
                description: Subscription status.
              next_payment:
                type: string
                description: Next payment date. Empty when no future payment is scheduled.
              subscription_total:
                type: string
                description: Subscription total, formatted without HTML.
              is_manual:
                type: boolean
                description: Whether the subscription requires manual renewal.
              view:
                type: string
                format: uri
                description: Link to view the subscription.
        pagination:
          type: object
          description: Pagination information. Links are only present when more pages are available.
          properties:
            previous:
              type: string
              format: uri
              description: Link to previous page.
            next:
              type: string
              format: uri
              description: Link to next page.
    CustomerSubscription:
      type: object
      description: A single customer subscription.
      properties:
        subscription_id:
          type: integer
          description: Unique identifier for the subscription.
        subscription_number:
          type: string
          description: Subscription number.
        parent_order:
          type: integer
          description: Parent order ID.
        order:
          type: string
          format: uri
          description: Link to the parent order.
        subscription_status:
          type: string
          description: Subscription status.
        subscription_total:
          type: string
          description: Subscription total, formatted without HTML.
        is_manual:
          type: boolean
          description: Whether the subscription requires manual renewal.
        start_date:
          $ref: '#/components/schemas/SubscriptionTitledValue'
        next_payment:
          $ref: '#/components/schemas/SubscriptionTitledValue'
        end_date:
          $ref: '#/components/schemas/SubscriptionTitledValue'
        trial_end:
          $ref: '#/components/schemas/SubscriptionTitledValue'
        payment:
          $ref: '#/components/schemas/SubscriptionTitledValue'
        billing_address:
          type: string
          description: Formatted billing address as a single line.
        shipping_address:
          type: string
          description: Formatted shipping address as a single line.
        notes:
          type: array
          description: Subscription notes shared with the customer.
          items:
            type: object
            properties:
              date:
                type: string
                description: Note date.
              note:
                type: string
                description: Note content.
    SubscriptionTitledValue:
      type: object
      description: A labelled subscription detail row, e.g. a date or the payment method.
      properties:
        title:
          type: string
          description: Field title.
        value:
          type: string
          description: Field value. Empty when not applicable to this subscription.
    SubscriptionActionResult:
      type: object
      description: Result of a subscription status action (suspend, cancel, reactivate).
      properties:
        subscription_id:
          type: integer
          description: Unique identifier for the subscription.
        subscription_status:
          type: string
          description: Subscription status after the action.
    SubscriptionAutoRenewResult:
      type: object
      description: Result of toggling subscription auto-renewal.
      properties:
        subscription_id:
          type: integer
          description: Unique identifier for the subscription.
        is_manual:
          type: boolean
          description: Whether the subscription now requires manual renewal.
    SubscriptionPaymentMethodResult:
      type: object
      description: Result of updating a subscription's payment method.
      properties:
        subscription_id:
          type: integer
          description: Unique identifier for the subscription.
        payment_method:
          type: string
          description: Payment method display name after the change.
        is_manual:
          type: boolean
          description: Whether the subscription requires manual renewal.
    SubscriptionResubscribeResult:
      type: object
      description: Result of seeding the cart to resubscribe.
      properties:
        subscription_id:
          type: integer
          description: Unique identifier for the subscription.
        cart_items_added:
          type: integer
          description: Number of line items added to the cart.
        cart_item_count:
          type: integer
          description: Total items now in the cart.
        cart_total:
          type: string
          description: Formatted cart total.
        saved_cart_item_count:
          type: integer
          description: Number of items from the customer's previous cart that were snapshotted before it was replaced (0 if the cart was already empty).
    SubscriptionResubscribeRestoreResult:
      type: object
      description: Result of restoring the cart snapshot taken before a resubscribe attempt.
      properties:
        restored:
          type: boolean
          description: Whether a saved cart snapshot was restored.
        cart_item_count:
          type: integer
          description: Total items now in the cart.
        restored_item_count:
          type: integer
          description: Number of items restored from the saved cart snapshot.
    RegisteredCustomer:
      type: object
      description: The newly registered customer.
      properties:
        user_id:
          type: integer
          description: Unique identifier for the new user.
        username:
          type: string
          description: The username registered for the new user.
        message:
          type: string
          description: Human-readable confirmation message.
    OrderWithdrawalResult:
      type: object
      description: |
        The result of submitting an order withdrawal request. Returned
        identically whether or not the request matched an existing order.
      properties:
        success:
          type: boolean
          description: Whether the withdrawal request was submitted.
        email:
          type: string
          format: email
          description: The email address the acknowledgement was sent to.
    ProductExtensions:
      description: What CoCart Plus adds to a product's `extensions` in the CoCart Starter products API (`GET /products`, `GET /products/{id}` and their variations). `{}` when there is none. Each key is there only when its plugin is active and it applies to the product; other plugins can add their own.
      type: object
      properties:
        accommodation_booking_data:
          description: 'Accommodation booking constraints for the product. Plugin: WooCommerce Accommodation Bookings.'
          type: object
          properties:
            min_nights:
              description: Minimum number of nights required for the booking.
              type: integer
            max_nights:
              description: Maximum number of nights allowed for the booking.
              type: integer
            check_in_time:
              description: Check-in time in HH:MM format.
              type: string
            check_out_time:
              description: Check-out time in HH:MM format.
              type: string
        addons:
          description: 'Add-on field definitions configured for this product. Plugin: WooCommerce Product Add-Ons.'
          type: array
          items:
            type: object
            properties:
              id:
                description: Unique add-on field identifier.
                type: integer
              name:
                description: Add-on field label shown to the customer.
                type: string
              type:
                description: Field type (custom_text, custom_textarea, multiple_choice, checkbox, select, datepicker, file_upload, input_multiplier, custom_price).
                type: string
              description:
                description: Optional field description shown below the label.
                type: string
              required:
                description: Whether the field must be filled before adding to cart.
                type: boolean
              position:
                description: Display order position (zero-based).
                type: integer
              display:
                description: Sub-display style for multiple_choice fields (select, radiobutton, images).
                type: string
              adjust_price:
                description: Whether this field adds a price adjustment to the product price.
                type: boolean
              price:
                description: Base price adjustment when adjust_price is true (options override this for choice-based types).
                type: string
              price_type:
                description: 'Price type: flat_fee, quantity_based, or percentage_based.'
                type: string
              restrictions:
                description: Whether min/max restrictions are enabled for this field.
                type: boolean
              min:
                description: Minimum value (character count for text fields, quantity for multiplier, price for custom_price).
                type: number
              max:
                description: Maximum value (same units as min).
                type: number
              limit_file_types:
                description: Whether file type restrictions are enabled (file_upload fields only).
                type: boolean
              allowed_file_types:
                description: Allowed file extensions when limit_file_types is true (e.g. ["jpg","pdf"]).
                type: array
                items:
                  type: string
              options:
                description: Selectable options for choice-based field types.
                type: array
                items:
                  type: object
                  properties:
                    label:
                      description: Option label.
                      type: string
                    price:
                      description: Price adjustment for this option.
                      type: string
                    price_type:
                      description: Price type for this option.
                      type: string
                    image:
                      description: Image URL for swatch display (multiple_choice with images display).
                      type: string
        booking_data:
          description: 'Bookable product configuration. Plugin: WooCommerce Bookings.'
          type: object
          properties:
            duration_type:
              description: Whether the booking duration is fixed or set by the customer.
              type: string
            duration_unit:
              description: Unit of time used for the booking duration.
              type: string
            duration:
              description: Number of duration units for the booking.
              type: integer
            has_persons:
              description: Whether the booking supports person counts.
              type: boolean
            min_persons:
              description: Minimum number of persons required for the booking.
              type: integer
            max_persons:
              description: Maximum number of persons allowed for the booking.
              type: integer
            has_resources:
              description: Whether the booking has selectable resources.
              type: boolean
            resource_label:
              description: Label displayed for the resource selector.
              type: string
            booking_location:
              description: Location details for the booking.
              type: string
        bundle_data:
          description: 'Bundle product form configuration. Plugin: WooCommerce Product Bundles.'
          type: object
          properties:
            layout:
              description: Bundle layout mode.
              type: string
            items:
              description: Bundled item definitions for form rendering.
              type: array
              items:
                type: object
                properties:
                  id:
                    description: Bundled product ID.
                    type: integer
                  optional:
                    description: Whether this bundled item is optional.
                    type: boolean
                  quantity:
                    description: Quantity constraints for this bundled item.
                    type: object
                    properties:
                      value:
                        description: Default quantity.
                        type: integer
                      minimum:
                        description: Minimum quantity.
                        type: integer
                      maximum:
                        description: Maximum quantity, or null if unlimited.
                        type: integer
                        nullable: true
                  priced_individually:
                    description: Whether this bundled item is priced individually.
                    type: boolean
                  discount:
                    description: Discount applied to this bundled item, or null if none.
                    type: number
                    nullable: true
        composite_data:
          description: 'Composite product form configuration. Plugin: WooCommerce Composite Products.'
          type: object
          properties:
            layout:
              description: Composite layout mode.
              type: string
            components:
              description: Component definitions for form rendering.
              type: array
              items:
                type: object
                properties:
                  id:
                    description: Component ID.
                    type: string
                  title:
                    description: Component title.
                    type: string
                  optional:
                    description: Whether this component is optional.
                    type: boolean
                  quantity_min:
                    description: Minimum quantity for this component.
                    type: integer
                  quantity_max:
                    description: Maximum quantity for this component, or null if unlimited.
                    type: integer
                    nullable: true
                  priced_individually:
                    description: Whether this component is priced individually.
                    type: boolean
                  discount:
                    description: Discount applied to this component, or null if none.
                    type: number
                    nullable: true
                  default_option_id:
                    description: Default product ID pre-selected for this component.
                    type: integer
                  options_style:
                    description: Display style for component options.
                    type: string
        condition:
          description: 'Product condition information. Plugin: Product Condition for WooCommerce.'
          type: object
          properties:
            slug:
              description: Condition slug identifier.
              type: string
            label:
              description: Human-readable condition label.
              type: string
            schema_condition:
              description: Schema.org OfferItemCondition value.
              type: string
            custom_label:
              description: Custom condition label text, when condition is "other" or "new-other".
              type: string
        discount:
          description: 'Active discount information for this product. Plugin: Discount Rules for WooCommerce.'
          type: object
          properties:
            original_price:
              description: Original price before the discount rule is applied.
              type: string
            saved_amount:
              description: Amount saved by the active discount rule.
              type: string
        gifting:
          description: 'Gifting configuration for this product. Plugin: WooCommerce Subscriptions gifting.'
          type: object
          properties:
            giftable:
              description: Whether this product can be purchased as a gift for a recipient (send `recipient_email` to `POST /cart/add-item`).
              type: boolean
        msrp_data:
          description: "Manufacturer's suggested retail price data for the product. Plugin: WooCommerce MSRP Pricing."
          type: object
          properties:
            msrp_price:
              description: MSRP in the smallest currency unit (simple products only).
              type: string
            msrp_price_min:
              description: Lowest MSRP across variations in the smallest currency unit (variable products only).
              type: string
            msrp_price_max:
              description: Highest MSRP across variations in the smallest currency unit (variable products only).
              type: string
        points_and_rewards:
          description: 'Points earning and redemption data for the product. Plugin: WooCommerce Points and Rewards.'
          type: object
          properties:
            points_earned:
              description: Number of points earned when purchasing this product.
              type: integer
            max_discount:
              description: Maximum discount redeemable on this product in the smallest currency unit. Empty string when no limit is set.
              type: string
        quantity_rules:
          description: 'Quantity purchase rules for the product. Plugin: WooCommerce Min/Max Quantities.'
          type: object
          properties:
            minimum:
              description: Minimum quantity required to purchase. Zero means no minimum.
              type: integer
            maximum:
              description: Maximum quantity allowed to purchase, or null if unlimited.
              type: integer
              nullable: true
            group_of:
              description: Quantity must be purchased in multiples of this value. Zero means no restriction.
              type: integer
            combine_variations:
              description: Whether quantities across all variations are combined when checking rules (variable products only).
              type: boolean
        subscription_data:
          description: 'Subscription data (if any) for the product. Plugins: WooCommerce Subscriptions, Milo Subscriptions.'
          type: object
          properties:
            billing_period:
              description: Subscription billing period details.
              type: object
              properties:
                interval:
                  description: Subscription billing interval.
                  oneOf:
                    - type: string
                    - type: integer
                period:
                  description: Subscription billing period.
                  type: string
                length:
                  description: Subscription billing length.
                  oneOf:
                    - type: string
                    - type: integer
                trial_period:
                  description: Subscription trial period.
                  type: string
                trial_length:
                  description: Subscription trial length.
                  oneOf:
                    - type: string
                    - type: integer
                trial_expiration_date:
                  description: 'When the free trial ends: GMT date (Y-m-d H:i:s) for a subscription started now, or 0 when there is no trial.'
                  oneOf:
                    - type: string
                    - type: integer
                expiration_date:
                  description: 'When the subscription ends: GMT date (Y-m-d H:i:s) for a subscription started now, or 0 when it never expires.'
                  oneOf:
                    - type: string
                    - type: integer
            sign_up_fee:
              description: Subscription sign up fee.
              type: string
            pay_now:
              description: Subscription amount to pay now.
              type: string
            needs_one_time_shipping:
              description: Does the subscription only require shipping once?
              type: boolean
            price_string:
              description: The subscription price string.
              type: string
            first_renewal:
              description: The first renewal date and time of the subscription.
              type: object
              properties:
                date:
                  description: 'First renewal: GMT date (Y-m-d H:i:s) for a subscription started now, or 0 when there is no renewal.'
                  oneOf:
                    - type: string
                    - type: integer
                timestamp:
                  description: First renewal Unix timestamp.
                  type: integer
                html:
                  description: First renewal date as a human-readable string.
                  type: string
        subscription_schemes:
          description: 'Purchase options for this product: one-time and/or subscription plans. Listed only when there is a choice. Plugin: All Products for WooCommerce Subscriptions.'
          type: array
          items:
            type: object
            properties:
              price:
                description: Scheme price.
                type: string
              period:
                description: Scheme billing period label.
                type: string
              value:
                description: 'Scheme key: send it as `convert_to_sub` to `POST /cart/add-item` to add the product with this option ("0" for one-time). Without `convert_to_sub` the default option applies.'
                type: string
              rest_url:
                description: Ready-made request to add the product with this option (`POST`).
                type: string
        vendor:
          description: 'Vendor store information for the product. Plugin: Dokan.'
          type: object
          properties:
            id:
              description: Unique vendor identifier.
              type: integer
            store_name:
              description: Vendor store display name.
              type: string
            store_url:
              description: URL to the vendor store page.
              type: string
              format: uri
            avatar:
              description: URL to the vendor avatar image.
              type: string
              format: uri
            rating:
              description: Vendor rating summary.
              type: object
              properties:
                average:
                  description: Average vendor rating across all products.
                  type: string
                count:
                  description: Total number of reviews for the vendor.
                  type: integer
        warranty:
          description: 'Warranty configuration for this product. Plugin: WooCommerce Warranty.'
          type: object
          properties:
            type:
              description: 'Warranty type: included or addon.'
              type: string
            label:
              description: Warranty field label shown to the customer.
              type: string
            options:
              description: Selectable warranty tiers.
              type: array
              items:
                type: object
                properties:
                  key:
                    description: Key to send as `item_data[warranty]` to `POST /cart/add-item` to choose this warranty (the numeric index works too).
                    type: string
                  duration:
                    description: Human-readable warranty duration.
                    type: string
                  cost:
                    description: Additional cost for this warranty tier.
                    type: string
      additionalProperties: true
security:
  - {}
  - basicAuth: []
  - bearerAuth: []
