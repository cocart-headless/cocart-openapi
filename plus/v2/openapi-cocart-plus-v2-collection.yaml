          items:
            type: string
            enum:
            - pay
            - cancel
          readOnly: true
        meta:
          description: The order's meta the store allows (`cocart_orders_allowed_meta_keys`). Keyed by meta key, with the first value of each as stored. Only keys the store allows, narrowed by `meta_keys`. An empty object when there are none.
          type: object
          additionalProperties: true
          readOnly: true
        extensions:
          description: Other plugins' data on the order, keyed by plugin. An empty object when there is none.
          type: object
          properties:
            subscription_data:
              description: How this order relates to a subscription, and the subscriptions linked to it.
              type: object
              properties:
                order_type:
                  description: How this order relates to a subscription, or null when it is not for one.
                  type: string
                  enum:
                  - parent
                  - renewal
                  - switch
                  - resubscribe
                  - null
                  readOnly: true
                  nullable: true
                subscriptions:
                  description: Each subscription linked to this order, in short, as the subscriptions list gives it.
                  type: array
                  items:
                    type: object
                    properties:
                      object:
                        description: 'The kind of document: "subscription".'
                        type: string
                        enum:
                        - subscription
                        readOnly: true
                      id:
                        description: Subscription ID.
                        type: integer
                        readOnly: true
                      number:
                        description: Subscription number, for display.
                        type: string
                        readOnly: true
                      status:
                        description: Subscription status.
                        type: object
                        properties:
                          code:
                            description: Status code, not translated and without the "wc-" prefix, e.g. on-hold. Use this in code.
                            type: string
                            readOnly: true
                          label:
                            description: Status label, translated, for display.
                            type: string
                            readOnly: true
                        readOnly: true
                      date_created:
                        description: When the subscription started. Null when there is none.
                        type: object
                        properties:
                          iso:
                            description: The date in ISO 8601 format, with the site's UTC offset.
                            type: string
                            format: date-time
                            readOnly: true
                          label:
                            description: The date in the site's date and time format, for display.
                            type: string
                            readOnly: true
                        readOnly: true
                        nullable: true
                      currency:
                        description: The subscription's currency. Every amount in the subscription is in it.
                        type: object
                        properties:
                          currency_code:
                            description: Currency code.
                            type: string
                            readOnly: true
                          currency_symbol:
                            description: Currency symbol.
                            type: string
                            readOnly: true
                          currency_symbol_pos:
                            description: The currency symbol position to which the currency needs to return for the prices.
                            type: string
                            readOnly: true
                          currency_minor_unit:
                            description: Currency minor unit.
                            type: integer
                            readOnly: true
                          currency_decimal_separator:
                            description: Currency decimal separator.
                            type: string
                            readOnly: true
                          currency_thousand_separator:
                            description: Currency thousand separator.
                            type: string
                            readOnly: true
                          currency_prefix:
                            description: Currency prefix.
                            type: string
                            readOnly: true
                          currency_suffix:
                            description: Currency suffix.
                            type: string
                            readOnly: true
                        readOnly: true
                      schedule:
                        description: When the subscription repeats.
                        type: object
                        properties:
                          interval:
                            description: How many periods between payments, e.g. 2 for every 2 months.
                            type: integer
                            readOnly: true
                          period:
                            description: 'The billing period: day, week, month or year (or lifetime with Milo Subscriptions).'
                            type: string
                            readOnly: true
                          label:
                            description: The schedule for display, e.g. "Every month".
                            type: string
                            readOnly: true
                          next_payment:
                            description: The next payment, while the subscription is active. Null when there is none.
                            type: object
                            properties:
                              iso:
                                description: The date in ISO 8601 format, with the site's UTC offset.
                                type: string
                                format: date-time
                                readOnly: true
                              label:
                                description: The date in the site's date and time format, for display.
                                type: string
                                readOnly: true
                            readOnly: true
                            nullable: true
                          trial_end:
                            description: When the free trial ends. Null when there is none.
                            type: object
                            properties:
                              iso:
                                description: The date in ISO 8601 format, with the site's UTC offset.
                                type: string
                                format: date-time
                                readOnly: true
                              label:
                                description: The date in the site's date and time format, for display.
                                type: string
                                readOnly: true
                            readOnly: true
                            nullable: true
                          end:
                            description: When the subscription ends. Null when there is none.
                            type: object
                            properties:
                              iso:
                                description: The date in ISO 8601 format, with the site's UTC offset.
                                type: string
                                format: date-time
                                readOnly: true
                              label:
                                description: The date in the site's date and time format, for display.
                                type: string
                                readOnly: true
                            readOnly: true
                            nullable: true
                        readOnly: true
                      total:
                        description: The subscription's total, charged on its schedule. In minor units, e.g. "4999", or formatted for display with `formatted=true`.
                        type: string
                        readOnly: true
                      payment:
                        description: How the subscription is paid.
                        type: object
                        properties:
                          auto_renew:
                            description: Whether the subscription renews automatically, instead of the customer paying for each renewal.
                            type: boolean
                            readOnly: true
                        readOnly: true
                      meta:
                        description: The subscription's meta the store allows (`cocart_subscriptions_allowed_meta_keys`). Keyed by meta key, with the first value of each as stored. Only keys the store allows, narrowed by `meta_keys`. An empty object when there are none.
                        type: object
                        additionalProperties: true
                        readOnly: true
                      extensions:
                        description: Other plugins' data on the subscription, keyed by plugin. An empty object when there is none.
                        type: object
                        readOnly: true
                  readOnly: true
              readOnly: true
            points_and_rewards:
              description: Points earned and redeemed on this order.
              type: object
              properties:
                points_earned:
                  description: Number of points awarded to the customer for this order.
                  type: integer
                  readOnly: true
                points_redeemed:
                  description: Number of points the customer redeemed as a discount on this order.
                  type: integer
                  readOnly: true
              readOnly: true
            subscription_schemes:
              description: The subscription plan each order line was bought on, with All Products for Subscriptions. Left out when no line was bought on a plan.
              type: array
              items:
                type: object
                properties:
                  item_id:
                    description: Order line item ID.
                    type: integer
                    readOnly: true
                  product_id:
                    description: Product ID for the line item.
                    type: integer
                    readOnly: true
                  scheme_key:
                    description: The subscription scheme key active at the time of purchase.
                    type: string
                    readOnly: true
              readOnly: true
            shipment_tracking:
              description: List of shipment tracking entries for the order.
              type: array
              items:
                type: object
                properties:
                  tracking_id:
                    description: Unique tracking entry identifier.
                    type: string
                    readOnly: true
                  tracking_provider:
                    description: Shipping provider display name.
                    type: string
                    readOnly: true
                  tracking_number:
                    description: Shipment tracking number.
                    type: string
                    readOnly: true
                  tracking_link:
                    description: URL to track the shipment on the carrier website.
