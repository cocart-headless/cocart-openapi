                    readOnly: true
                  carrier:
                    description: Carrier identifier (e.g. usps, fedex, ups).
                    type: string
                    readOnly: true
                  service_name:
                    description: Human-readable shipping service name.
                    type: string
                    readOnly: true
                  tracking_number:
                    description: Shipment tracking number.
                    type: string
                    readOnly: true
                  tracking_url:
                    description: URL to track the shipment on the carrier website.
                    type: string
                    format: uri
                    readOnly: true
                  status:
                    description: Label purchase status.
                    type: string
                    readOnly: true
                  created_date:
                    description: Date the label was purchased.
                    type: string
                    readOnly: true
                  is_return:
