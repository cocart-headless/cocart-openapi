openapi: 3.0.3
info:
  title: CoCart - Other API v2
  version: 5.0.0
  description: |
    CoCart REST API for authentication, logout, and store information.
  termsOfService: https://cocartapi.com/terms-of-conditions-polar/
  contact:
    email: support@cocartapi.com
  license:
    name: GNU General Public License v3.0
    url: http://www.gnu.org/licenses/gpl-3.0.html
externalDocs:
  description: Find out more about CoCart API
  url: https://docs.cocartapi.com
servers:
- url: '{protocol}://{host}/wp-json/cocart/v2'
  description: API v2
  variables:
    protocol:
      enum:
      - http
      - https
      default: https
    host:
      default: example-store.com
      description: Your store domain
tags:
- name: authentication
  description: Operations for user authentication
- name: store
  description: Operations for retrieving store information and configuration
paths:
  /login:
    post:
      tags:
      - authentication
      summary: Login user
      description: Logs in a user and creates a session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  description: Username, email address, or phone for authentication.
                  type: string
                password:
                  description: User password.
                  type: string
                avatars:
                  description: Include avatar URLs in the response.
                  type: boolean
                  default: false
              required:
              - username
              - password
      responses:
        '200':
          description: User logged in successfully.
          headers:
            Cache-Control:
              $ref: '#/components/headers/SessionCacheControlHeader'
            Vary:
              $ref: '#/components/headers/SessionVaryHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                user_id: '42'
                first_name: John
                last_name: Doe
                display_name: John Doe
                role: Customer
                avatar_urls:
                  '24': https://secure.gravatar.com/avatar/example?s=24&d=mm&r=g
                  '48': https://secure.gravatar.com/avatar/example?s=48&d=mm&r=g
                  '96': https://secure.gravatar.com/avatar/example?s=96&d=mm&r=g
                email: john.doe@example.com
                extras: {}
                dev_note: Don't forget to store the users login information in order to authenticate all other routes with CoCart.
        '400':
          description: Bad request - invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: cocart_invalid_credentials
                message: Invalid username or password.
                data:
                  status: 400
        '403':
          description: Authentication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: cocart_authentication_failed
                message: Authentication failed. Please check your credentials.
                data:
                  status: 403
  /logout:
    post:
      tags:
      - authentication
      summary: Logout user
      description: Logs out the current user and destroys the session.
      responses:
        '200':
          description: User logged out successfully.
          headers:
            Cache-Control:
              $ref: '#/components/headers/SessionCacheControlHeader'
            Vary:
              $ref: '#/components/headers/SessionVaryHeader'
          content:
            application/json:
              schema:
                type: boolean
                example: true
        '400':
          description: Bad request - logout failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: cocart_logout_failed
                message: Logout failed.
                data:
                  status: 400
  /store:
    get:
      tags:
      - store
      summary: Get store information
      description: |
        Gets general store information including routes and configuration.
      responses:
        '200':
          description: Store information retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreInfo'
              example:
                version: 4.6.0
                title: Example Store
                description: Your trusted online retailer for electronics, clothing, and more
                home_url: https://example-store.com
                language: en_US
                gmt_offset: '-5'
                timezone_string: America/New_York
                store_address:
                  address: 123 Commerce Street
                  address_2: Suite 500
                  city: New York
                  state: NY
                  postcode: '10001'
                  country: US
                routes:
                  /cart: Manage shopping cart
                  /cart/add-item: Add item to cart
                  /cart/items: Get cart items
                  /products: Browse products
                  /products/categories: Browse product categories
                  /login: User authentication
                  /logout: User logout
      security:
      - {}
components:
  headers:
    CartKeyHeader:
      description: |
        The cart key for this session. Send it back in the `Cart-Key` request
        header (or the `cart_key` query parameter) to keep using the same cart.
      schema:
        type: string
        example: t_d8f5452294c521ed95f41f90b8768d
    SessionCacheControlHeader:
      description: |
        Per-session responses are kept out of shared caches (CDNs, a host's nginx
        microcache), for guests too. Sent with `Pragma: no-cache` and
        `X-Accel-Expires: 0`, which nginx honours even when it is set to ignore
        `Cache-Control` (nginx consumes it, so clients rarely see it).
      schema:
        type: string
        example: no-cache, no-store, must-revalidate, max-age=0, private
    CartExpiresHeader:
      description: |
        The cart session's expiry, as an HTTP date. Caches don't keep the response
        until then: `max-age=0` in `Cache-Control` overrides `Expires`, and nginx
        gives `X-Accel-Expires: 0` priority over it.
      schema:
        type: string
        example: Tue, 06 Oct 2026 10:14:43 GMT
    SessionVaryHeader:
      description: |
        Request headers the response depends on. Lists the session headers
        `Cart-Key`, `CoCart-API-Cart-Key` and `Authorization` (filterable with
        `cocart_session_vary_headers`), so a cache that stores the response anyway
        keeps one copy per cart. May arrive as several `Vary` lines (e.g. `Origin`
        from CORS, `CF-IPCountry` from geolocation, `Accept-Encoding` when PHP
        compresses the response), which mean one combined list.
      schema:
        type: string
        example: Origin, Cart-Key, CoCart-API-Cart-Key, Authorization
    CartExpiringHeader:
      description: |
        Only when `WP_DEBUG` is on. Unix timestamp after which the session is
        extended on its next use (one day from now by default, filterable with
        `cocart_cart_expiring`).
      schema:
        type: integer
        example: 1791108883
    CartExpirationHeader:
      description: |
        Only when `WP_DEBUG` is on. Unix timestamp when the cart session expires
        (2 days for guests and 7 days for customers by default, set in the session
        settings or with `cocart_cart_expiration`). Outside debugging, `Expires`
        carries the same time.
      schema:
        type: integer
        example: 1791195283
    CartHashHeader:
      description: |
        Only when `WP_DEBUG` is on. Hash of the cart contents, for debugging; use
        `ETag` to detect changes.
      schema:
        type: string
        example: 838029ced1a28de909704ef32ca99e91
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        Basic authentication with username and password.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer token authentication (JWT). Optional for cart and products endpoints.
        When provided by customers, enables enhanced functionality like persistent carts and user-specific data.
        Required only for admin operations like managing cart sessions.
  schemas:
    LoginResponse:
      type: object
      properties:
        user_id:
          type: string
          description: Unique ID of the user on the site.
        first_name:
          type: string
          description: The first name of the user (if any).
        last_name:
          type: string
          description: The last name of the user (if any).
        display_name:
          type: string
          description: The display name of the user (if any).
        role:
          type: string
          description: The role type assigned to the user.
        avatar_urls:
          type: object
          description: The avatar URLs of the user for each avatar size registered.
          additionalProperties:
            type: string
        email:
          type: string
          description: The email address of the user.
        extras:
          type: object
          description: Extra details added via the filter.
          additionalProperties: true
        dev_note:
          type: string
          description: A message to developers.
    StoreInfo:
      type: object
      properties:
        title:
          type: string
          description: Store title.
        description:
          type: string
          description: Store description.
        home_url:
          type: string
          description: Store home URL.
        language:
          type: string
          description: Store language.
        gmt_offset:
          type: string
          description: GMT offset.
        timezone_string:
          type: string
          description: Timezone string.
        store_address:
          type: object
          description: The store's address.
          additionalProperties:
            type: string
        routes:
          type: object
          description: Available API routes.
          additionalProperties: true
        versions:
          type: object
          description: Versions of the CoCart plugins installed (`core`, plus `plus` and other add-ons when active).
          required:
          - core
          properties:
            core:
              type: string
            plus:
              type: string
          additionalProperties:
            type: string
    ErrorResponse:
      type: object
      description: Standard error response structure.
      properties:
        code:
          type: string
          description: Machine-readable error code.
          example: cocart_invalid_parameter
        message:
          type: string
          description: Human-readable error message.
          example: Invalid parameter provided.
        data:
          type: object
          description: Additional error data.
          properties:
            status:
              type: integer
              description: HTTP status code.
              example: 400
            params:
              type: object
              description: Parameter-specific error details.
              additionalProperties: true
          additionalProperties: true
